<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二叉排序树 BST 演示 (408标准)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tree-area { position: relative; min-height: 450px; overflow: auto; }
        .tnode {
            position: absolute; width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: bold; border: 2.5px solid #93c5fd;
            background: #eff6ff; transition: all 0.4s ease; z-index: 2;
            cursor: default; flex-direction: column;
        }
        .tnode.root-node { border-color: #3b82f6; border-width: 3px; }
        .tnode.search-path { border-color: #f59e0b; background: #fef3c7; box-shadow: 0 0 0 5px rgba(245,158,11,0.3); }
        .tnode.found-node { border-color: #22c55e; background: #f0fdf4; box-shadow: 0 0 0 6px rgba(34,197,94,0.3); transform: scale(1.15); }
        .tnode.delete-target { border-color: #ef4444; background: #fef2f2; box-shadow: 0 0 0 5px rgba(239,68,68,0.3); }
        .tnode.insert-highlight { border-color: #8b5cf6; background: #f5f3ff; box-shadow: 0 0 0 5px rgba(139,92,246,0.3); }
        .tnode.bf-label { font-size: 0.6rem; position: absolute; top: -16px; color: #f59e0b; font-weight: bold; }
        .tree-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col font-sans">

    <!-- 顶部控制栏 -->
    <div class="bg-white shadow-sm border-b p-4 flex flex-wrap gap-4 items-center justify-between z-10">
        <div class="flex gap-4 items-center flex-wrap">
            <h1 class="text-xl font-bold text-blue-600 mr-2">二叉排序树 BST 演示</h1>
            <div class="flex items-center gap-2">
                <label class="text-sm font-medium">插入值:</label>
                <input type="number" id="input-insert" value="" placeholder="数字" class="border rounded px-2 py-1 w-24 focus:outline-none focus:border-blue-500 text-sm">
                <button onclick="doInsert()" class="px-3 py-1 bg-purple-600 text-white rounded hover:bg-purple-700 transition text-sm">插入</button>
            </div>
            <div class="flex items-center gap-2">
                <label class="text-sm font-medium">查找/删除:</label>
                <input type="number" id="input-search" value="" placeholder="数字" class="border rounded px-2 py-1 w-24 focus:outline-none focus:border-blue-500 text-sm">
                <button onclick="doSearch()" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 transition text-sm">查找</button>
                <button onclick="doDelete()" class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition text-sm">删除</button>
            </div>
            <button onclick="resetTree()" class="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-700 transition text-sm">重置</button>
        </div>
        <div class="flex gap-2 items-center">
            <span id="status-badge" class="px-2 py-1 rounded text-xs bg-gray-200 text-gray-700">就绪</span>
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden">
        <!-- 左：树可视化 -->
        <div class="flex-1 p-6 overflow-auto bg-gray-50 flex flex-col gap-4">
            <div class="bg-white p-4 rounded-lg shadow-sm border flex-1">
                <h2 class="text-lg font-bold mb-3">BST 二叉排序树</h2>
                <div class="tree-area" id="tree-area"></div>
            </div>
            <!-- 结点信息 -->
            <div class="bg-white p-4 rounded-lg shadow-sm border">
                <div class="grid grid-cols-3 gap-4 text-sm">
                    <div class="bg-blue-50 p-3 rounded-lg text-center"><div class="text-gray-500">结点总数</div><div class="text-xl font-bold text-blue-600 font-mono" id="stat-count">0</div></div>
                    <div class="bg-purple-50 p-3 rounded-lg text-center"><div class="text-gray-500">树高度</div><div class="text-xl font-bold text-purple-600 font-mono" id="stat-height">0</div></div>
                    <div class="bg-green-50 p-3 rounded-lg text-center"><div class="text-gray-500">中序遍历</div><div class="text-sm font-bold text-green-600 font-mono" id="stat-inorder">-</div></div>
                </div>
            </div>
        </div>

        <!-- 右侧日志 -->
        <div class="w-80 bg-white border-l flex flex-col shadow-[-4px_0_15px_rgba(0,0,0,0.03)]">
            <div class="p-4 border-b bg-gray-50 font-bold">执行日志</div>
            <div id="log-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 font-mono text-sm"></div>
        </div>
    </div>

    <!-- 删除操作选单（间接前驱/后继选择） -->
    <div id="delete-modal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <p class="font-bold mb-4">该结点有两个孩子，请选择替代方式：</p>
            <div class="flex gap-3">
                <button onclick="deleteWith('predecessor')" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">用直接前驱替代</button>
                <button onclick="deleteWith('successor')" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">用直接后继替代</button>
                <button onclick="hideDeleteModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">取消</button>
            </div>
        </div>
    </div>

    <script>
        // ---- BST 数据结构 ----
        class TreeNode {
            constructor(val) { this.val = val; this.left = null; this.right = null; this.x = 0; this.y = 0; }
        }
        let root = null;
        let searchPathNodes = [];   // 搜索路径上的结点值
        let specialNode = null;     // 特殊高亮结点值
        let highlightType = '';     // 'search','found','delete','insert'
        let pendingDeleteVal = null;

        function resetTree() {
            root = null; searchPathNodes = []; specialNode = null; highlightType = '';
            document.getElementById('log-container').innerHTML = '';
            updateStats();
            renderTree();
            addLog('系统', 'BST 已重置为空树。');
            updateStatusBadge('就绪', 'bg-gray-200 text-gray-700');
        }

        // ---- 插入 ----
        function doInsert() {
            const val = document.getElementById('input-insert').value;
            if (!val && val !== 0) return alert('请输入插入值');
            const num = Number(val);
            if (isNaN(num)) return alert('请输入有效数字');
            searchPathNodes = [];
            specialNode = null; highlightType = 'insert';
            root = bstInsert(root, num);
            document.getElementById('input-insert').value = '';
            specialNode = num;
            addLog('插入', `插入结点 ${num}。搜索路径: ${searchPathNodes.join(' → ')}`, 'text-purple-600 font-bold');
            updateStatusBadge('已插入 ' + num, 'bg-purple-100 text-purple-700');
            updateStats();
            renderTree();
            // 2秒后清除高亮
            setTimeout(() => { specialNode = null; highlightType = ''; renderTree(); }, 2000);
        }

        function bstInsert(node, val) {
            if (!node) { searchPathNodes.push('NULL→新建'); return new TreeNode(val); }
            searchPathNodes.push(String(node.val));
            if (val < node.val) node.left = bstInsert(node.left, val);
            else if (val > node.val) node.right = bstInsert(node.right, val);
            // 相等不插入
            return node;
        }

        // ---- 查找 ----
        function doSearch() {
            const val = document.getElementById('input-search').value;
            if (!val && val !== 0) return alert('请输入查找值');
            const num = Number(val);
            if (isNaN(num)) return alert('请输入有效数字');
            searchPathNodes = [];
            specialNode = null; highlightType = 'search';
            const found = bstSearch(root, num);
            if (found) {
                specialNode = num;
                highlightType = 'found';
                addLog('查找成功', `找到结点 ${num}！搜索路径: ${searchPathNodes.join(' → ')}`, 'text-green-600 font-bold text-base');
                updateStatusBadge('查找成功', 'bg-green-100 text-green-700');
            } else {
                addLog('查找失败', `未找到结点 ${num}。搜索路径: ${searchPathNodes.join(' → ')} → NULL`, 'text-red-600 font-bold');
                updateStatusBadge('查找失败', 'bg-red-100 text-red-700');
            }
            renderTree();
            setTimeout(() => { specialNode = null; highlightType = ''; renderTree(); updateStatusBadge('就绪', 'bg-gray-200 text-gray-700'); }, 2500);
        }

        function bstSearch(node, val) {
            if (!node) { searchPathNodes.push('NULL'); return false; }
            searchPathNodes.push(String(node.val));
            if (val === node.val) return true;
            if (val < node.val) return bstSearch(node.left, val);
            return bstSearch(node.right, val);
        }

        // ---- 删除 ----
        function doDelete() {
            const val = document.getElementById('input-delete')?.value || document.getElementById('input-search').value;
            if (!val && val !== 0) return alert('请输入删除值');
            const num = Number(val);
            if (isNaN(num)) return alert('请输入有效数字');

            // 先检查是否有两个孩子
            const node = findNode(root, num);
            if (!node) { addLog('删除失败', `结点 ${num} 不存在于树中。`, 'text-red-600 font-bold'); return; }

            searchPathNodes = []; specialNode = num; highlightType = 'delete';
            if (node.left && node.right) {
                pendingDeleteVal = num;
                showDeleteModal();
                return;
            }
            executeDelete(num, 'direct');
        }

        function findNode(node, val) {
            if (!node) return null;
            if (val === node.val) return node;
            if (val < node.val) return findNode(node.left, val);
            return findNode(node.right, val);
        }

        function showDeleteModal() {
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function hideDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
            pendingDeleteVal = null;
            specialNode = null; highlightType = '';
            renderTree();
        }

        function deleteWith(method) {
            hideDeleteModal();
            executeDelete(pendingDeleteVal, method);
        }

        function executeDelete(val, method) {
            searchPathNodes = []; specialNode = val; highlightType = 'delete';
            const deleted = { caseType: '' };
            root = bstDelete(root, val, method, deleted);
            addLog('删除', `删除结点 ${val} (${deleted.caseType})。搜索路径: ${searchPathNodes.join(' → ')}`, 'text-red-600 font-bold text-base');
            updateStatusBadge('已删除 ' + val, 'bg-red-100 text-red-700');
            updateStats();
            renderTree();
            setTimeout(() => { specialNode = null; highlightType = ''; renderTree(); updateStatusBadge('就绪', 'bg-gray-200 text-gray-700'); }, 2500);
        }

        function bstDelete(node, val, method, deleted) {
            if (!node) { searchPathNodes.push('NULL'); return null; }
            searchPathNodes.push(String(node.val));
            if (val < node.val) { node.left = bstDelete(node.left, val, method, deleted); return node; }
            if (val > node.val) { node.right = bstDelete(node.right, val, method, deleted); return node; }
            // 找到目标
            if (!node.left && !node.right) {
                deleted.caseType = '情况1: 叶子结点，直接删除';
                return null;
            }
            if (!node.left) {
                deleted.caseType = '情况2: 只有右孩子，用右孩子替代';
                return node.right;
            }
            if (!node.right) {
                deleted.caseType = '情况2: 只有左孩子，用左孩子替代';
                return node.left;
            }
            // 两个孩子
            if (method === 'predecessor') {
                deleted.caseType = '情况3: 两个孩子，用直接前驱替代';
                let pred = node.left, predParent = node;
                while (pred.right) { predParent = pred; pred = pred.right; }
                node.val = pred.val;
                // 递归删除前驱(前驱不可能有两个孩子)
                const subDel = { caseType: '' };
                node.left = bstDelete(node.left, pred.val, 'direct', subDel);
            } else {
                deleted.caseType = '情况3: 两个孩子，用直接后继替代';
                let succ = node.right, succParent = node;
                while (succ.left) { succParent = succ; succ = succ.left; }
                node.val = succ.val;
                const subDel = { caseType: '' };
                node.right = bstDelete(node.right, succ.val, 'direct', subDel);
            }
            return node;
        }

        // ---- 树绘制 ----
        function getHeight(node) { if (!node) return 0; return 1 + Math.max(getHeight(node.left), getHeight(node.right)); }
        function countNodes(node) { if (!node) return 0; return 1 + countNodes(node.left) + countNodes(node.right); }
        function inorder(node) { if (!node) return []; return [...inorder(node.left), node.val, ...inorder(node.right)]; }

        function updateStats() {
            document.getElementById('stat-count').textContent = countNodes(root);
            document.getElementById('stat-height').textContent = getHeight(root);
            document.getElementById('stat-inorder').textContent = inorder(root).join(', ') || '-';
        }

        function renderTree() {
            const area = document.getElementById('tree-area');
            area.innerHTML = '';
            if (!root) { area.innerHTML = '<div class="text-gray-400 text-center py-16">空树，请插入结点</div>'; return; }

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.classList.add('tree-svg');
            svg.style.width = '100%';
            svg.style.height = '100%';
            area.appendChild(svg);

            const h = getHeight(root);
            const areaW = area.clientWidth || 800;
            const totalW = Math.pow(2, h) * 60;
            const w = Math.max(areaW, totalW);
            const nodeSize = 48;
            const levelH = 85;

            // 先布局
            function layout(node, depth, left, right) {
                if (!node) return;
                const x = (left + right) / 2;
                const y = depth * levelH + 40;
                node.x = x; node.y = y;
                layout(node.left, depth + 1, left, x);
                layout(node.right, depth + 1, x, right);
            }
            layout(root, 0, 0, w);

            // 绘制边
            function drawEdges(node) {
                if (!node) return;
                if (node.left) {
                    drawLine(node.x + nodeSize / 2, node.y + nodeSize / 2, node.left.x + nodeSize / 2, node.left.y + nodeSize / 2, svg);
                    drawEdges(node.left);
                }
                if (node.right) {
                    drawLine(node.x + nodeSize / 2, node.y + nodeSize / 2, node.right.x + nodeSize / 2, node.right.y + nodeSize / 2, svg);
                    drawEdges(node.right);
                }
            }
            drawEdges(root);

            // 绘制结点
            function drawNodes(node, isRoot) {
                if (!node) return;
                const div = document.createElement('div');
                div.className = 'tnode';
                div.style.left = (node.x) + 'px';
                div.style.top = (node.y) + 'px';
                if (isRoot) div.classList.add('root-node');
                div.textContent = node.val;

                if (highlightType === 'search' && searchPathNodes.includes(String(node.val))) div.classList.add('search-path');
                if ((highlightType === 'found' || highlightType === 'insert') && specialNode === node.val) {
                    div.classList.add(highlightType === 'found' ? 'found-node' : 'insert-highlight');
                }
                if (highlightType === 'delete' && specialNode === node.val) div.classList.add('delete-target');

                area.appendChild(div);
                drawNodes(node.left, false);
                drawNodes(node.right, false);
            }
            drawNodes(root, true);

            area.style.width = w + 'px';
            area.style.height = (h * levelH + 80) + 'px';
        }

        function drawLine(x1, y1, x2, y2, svg) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1); line.setAttribute('y1', y1);
            line.setAttribute('x2', x2); line.setAttribute('y2', y2);
            line.setAttribute('stroke', '#cbd5e1');
            line.setAttribute('stroke-width', '2');
            line.setAttribute('stroke-linecap', 'round');
            svg.appendChild(line);
        }

        function addLog(type, message, colorClass = 'text-gray-800') {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = `p-3 bg-white rounded border border-gray-100 shadow-sm ${colorClass} leading-relaxed animate-fade-in`;
            entry.innerHTML = `<span class="inline-block px-1.5 py-0.5 bg-gray-100 rounded text-xs text-gray-500 mb-1 border">${type}</span><br>${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function updateStatusBadge(text, classes) {
            const badge = document.getElementById('status-badge');
            badge.textContent = text; badge.className = `px-2 py-1 rounded text-xs font-bold ${classes}`;
        }

        // ---- 预设示例 ----
        window.onload = function () {
            resetTree();
            // 构建示例树: 50,30,80,20,40,70,90,35,45
            [50, 30, 80, 20, 40, 70, 90, 35, 45].forEach(v => {
                root = bstInsert(root, v);
            });
            searchPathNodes = [];
            updateStats();
            renderTree();
            addLog('系统', '初始化示例 BST：50,30,80,20,40,70,90,35,45。相邻输入框可插入/查找/删除结点。');
            addLog('提示', '删除有两个孩子的结点时会弹出选择框。注意观察三种删除情况。');
        };
    </script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</body>
</html>
