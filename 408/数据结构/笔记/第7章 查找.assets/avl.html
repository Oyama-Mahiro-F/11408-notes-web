<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平衡二叉树 AVL 演示 (408标准)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tree-area { position: relative; min-height: 450px; overflow: auto; }
        .anode {
            position: absolute; width: 52px; height: 52px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: bold; border: 2.5px solid #93c5fd;
            background: white; transition: all 0.5s ease; z-index: 2; flex-direction: column;
        }
        .anode .bf-tag {
            font-size: 0.55rem; font-weight: bold; position: absolute; top: -18px;
            background: white; border: 1px solid #f59e0b; border-radius: 10px;
            padding: 0 4px; color: #f59e0b; white-space: nowrap;
        }
        .anode.unbalanced { border-color: #ef4444; background: #fef2f2; box-shadow: 0 0 0 6px rgba(239,68,68,0.25); }
        .anode.unbalanced .bf-tag { color: #ef4444; border-color: #ef4444; background: #fef2f2; }
        .anode.inserted { border-color: #8b5cf6; background: #f5f3ff; box-shadow: 0 0 0 6px rgba(139,92,246,0.25); transform: scale(1.12); }
        .anode.rotation-node { border-color: #f59e0b; background: #fef3c7; box-shadow: 0 0 0 5px rgba(245,158,11,0.25); }
        .tree-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col font-sans">

    <!-- 顶部控制栏 -->
    <div class="bg-white shadow-sm border-b p-4 flex flex-wrap gap-4 items-center justify-between z-10">
        <div class="flex gap-4 items-center flex-wrap">
            <h1 class="text-xl font-bold text-blue-600 mr-2">平衡二叉树 AVL 演示</h1>
            <div class="flex items-center gap-2">
                <label class="text-sm font-medium">插入值:</label>
                <input type="number" id="input-val" value="" placeholder="数字" class="border rounded px-2 py-1 w-24 focus:outline-none focus:border-blue-500 text-sm">
                <button onclick="doInsert()" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 transition text-sm">插入</button>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm text-gray-500">示例序列:</span>
                <button onclick="loadExample([10,20,30])" class="px-3 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 text-xs">RR旋转</button>
                <button onclick="loadExample([30,20,10])" class="px-3 py-1 bg-green-100 text-green-700 rounded hover:bg-green-200 text-xs">LL旋转</button>
                <button onclick="loadExample([30,10,20])" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded hover:bg-yellow-200 text-xs">LR旋转</button>
                <button onclick="loadExample([10,30,20])" class="px-3 py-1 bg-purple-100 text-purple-700 rounded hover:bg-purple-200 text-xs">RL旋转</button>
                <button onclick="loadExample([50,30,80,20,40,70,90,15,25,35])" class="px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 text-xs">综合示例</button>
            </div>
            <button onclick="resetTree()" class="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-700 transition text-sm">重置</button>
        </div>
        <div class="flex gap-2">
            <button id="btn-play" onclick="replayInsertions()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition text-sm disabled:opacity-50">回放</button>
            <span id="status-badge" class="px-2 py-1 rounded text-xs bg-gray-200 text-gray-700">就绪</span>
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden">
        <!-- 左：树可视化 -->
        <div class="flex-1 p-6 overflow-auto bg-gray-50 flex flex-col gap-4">
            <div class="bg-white p-4 rounded-lg shadow-sm border flex-1">
                <h2 class="text-lg font-bold mb-3">AVL 树 (每个结点标注平衡因子)</h2>
                <div class="tree-area" id="tree-area"></div>
            </div>
            <!-- 说明 -->
            <div class="bg-white p-4 rounded-lg shadow-sm border">
                <div class="grid grid-cols-4 gap-3 text-xs">
                    <div class="bg-red-50 p-2 rounded text-center border border-red-200"><b>LL 旋转</b><br>在 A 的左孩子的左子树插入</div>
                    <div class="bg-orange-50 p-2 rounded text-center border border-orange-200"><b>RR 旋转</b><br>在 A 的右孩子的右子树插入</div>
                    <div class="bg-yellow-50 p-2 rounded text-center border border-yellow-200"><b>LR 旋转</b><br>在 A 的左孩子的右子树插入</div>
                    <div class="bg-purple-50 p-2 rounded text-center border border-purple-200"><b>RL 旋转</b><br>在 A 的右孩子的左子树插入</div>
                </div>
            </div>
        </div>

        <!-- 右侧日志 -->
        <div class="w-80 bg-white border-l flex flex-col shadow-[-4px_0_15px_rgba(0,0,0,0.03)]">
            <div class="p-4 border-b bg-gray-50 font-bold">执行日志</div>
            <div id="log-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 font-mono text-sm"></div>
        </div>
    </div>

    <script>
        // ---- AVL 结点 ----
        class AVLNode {
            constructor(val) { this.val = val; this.left = null; this.right = null; this.height = 1; this.x = 0; this.y = 0; }
        }
        let root = null;
        let lastInserted = null;     // 最近插入的结点值
        let unbalancedNode = null;   // 最小不平衡子树根结点值
        let rotationInfo = '';       // 旋转类型说明
        let recentRotations = [];    // 旋转涉及的结点值（用于高亮）
        let insertionHistory = [];   // 回放用

        function resetTree() {
            root = null; lastInserted = null; unbalancedNode = null;
            rotationInfo = ''; recentRotations = [];
            insertionHistory = [];
            document.getElementById('log-container').innerHTML = '';
            renderTree();
            addLog('系统', 'AVL 树已重置为空树。');
            updateStatusBadge('就绪', 'bg-gray-200 text-gray-700');
        }

        function loadExample(arr) {
            resetTree();
            insertionHistory = [...arr];
            // 逐个静默插入，记录旋转信息
            insertionHistory.forEach((v, i) => {
                const result = { val: v, rotation: '' };
                root = avlInsert(root, v, result);
                if (result.rotation) {
                    addLog('旋转', `插入 ${v} 触发 <b>${result.rotation}</b>`, 'text-orange-600 font-bold');
                } else {
                    addLog('插入', `插入结点 ${v}，未触发旋转`, 'text-gray-600');
                }
            });
            lastInserted = null; unbalancedNode = null; recentRotations = [];
            renderTree();
            updateStatusBadge(`${insertionHistory.length}个结点`, 'bg-blue-100 text-blue-700');
        }

        function getHeight(node) { return node ? node.height : 0; }
        function getBalance(node) { return node ? getHeight(node.left) - getHeight(node.right) : 0; }

        function updateHeight(node) {
            node.height = 1 + Math.max(getHeight(node.left), getHeight(node.right));
        }

        function rotateRight(y) {
            const x = y.left;
            const T2 = x.right;
            x.right = y;
            y.left = T2;
            updateHeight(y);
            updateHeight(x);
            recentRotations.push(y.val, x.val);
            return x;
        }

        function rotateLeft(x) {
            const y = x.right;
            const T2 = y.left;
            y.left = x;
            x.right = T2;
            updateHeight(x);
            updateHeight(y);
            recentRotations.push(x.val, y.val);
            return y;
        }

        function avlInsert(node, val, result) {
            if (!node) { result.rotation = ''; return new AVLNode(val); }

            if (val < node.val) node.left = avlInsert(node.left, val, result);
            else if (val > node.val) node.right = avlInsert(node.right, val, result);
            else return node; // 不允许重复

            updateHeight(node);
            const bf = getBalance(node);

            // LL: 在左子树的左子树插入
            if (bf > 1 && val < node.left.val) {
                result.rotation = 'LL 旋转 (右单旋): 对结点 ' + node.val + ' 进行右旋';
                unbalancedNode = node.val;
                return rotateRight(node);
            }
            // RR: 在右子树的右子树插入
            if (bf < -1 && val > node.right.val) {
                result.rotation = 'RR 旋转 (左单旋): 对结点 ' + node.val + ' 进行左旋';
                unbalancedNode = node.val;
                return rotateLeft(node);
            }
            // LR: 在左子树的右子树插入
            if (bf > 1 && val > node.left.val) {
                result.rotation = 'LR 旋转 (先左后右双旋): 先对 ' + node.left.val + ' 左旋，再对 ' + node.val + ' 右旋';
                unbalancedNode = node.val;
                node.left = rotateLeft(node.left);
                return rotateRight(node);
            }
            // RL: 在右子树的左子树插入
            if (bf < -1 && val < node.right.val) {
                result.rotation = 'RL 旋转 (先右后左双旋): 先对 ' + node.right.val + ' 右旋，再对 ' + node.val + ' 左旋';
                unbalancedNode = node.val;
                node.right = rotateRight(node.right);
                return rotateLeft(node);
            }
            return node;
        }

        function doInsert() {
            const val = document.getElementById('input-val').value;
            if (!val && val !== 0) return alert('请输入插入值');
            const num = Number(val);
            if (isNaN(num)) return alert('请输入有效数字');

            recentRotations = []; unbalancedNode = null;
            const result = { val: num, rotation: '' };
            root = avlInsert(root, num, result);
            lastInserted = num;
            insertionHistory.push(num);
            document.getElementById('input-val').value = '';

            if (result.rotation) {
                rotationInfo = result.rotation;
                addLog('旋转', `插入 ${num} 触发 <b>${result.rotation}</b>` + '<br>平衡因子绝对值超过1，需要进行旋转调整。', 'text-orange-600 font-bold');
                updateStatusBadge('旋转: ' + (result.rotation.split(' ')[0]), 'bg-orange-100 text-orange-700');
            } else {
                addLog('插入', `插入结点 ${num}，树仍然平衡，无需旋转。`, 'text-gray-600');
                updateStatusBadge('已插入 ' + num, 'bg-purple-100 text-purple-700');
            }
            renderTree();
            // 3秒后清除高亮
            setTimeout(() => {
                lastInserted = null; unbalancedNode = null;
                recentRotations = []; rotationInfo = '';
                updateStatusBadge('就绪', 'bg-gray-200 text-gray-700');
                renderTree();
            }, 3000);
        }

        function replayInsertions() {
            if (insertionHistory.length === 0) return;
            resetTree();
            const arr = [...insertionHistory];
            insertionHistory = [];
            let idx = 0;
            function next() {
                if (idx >= arr.length) return;
                const v = arr[idx];
                recentRotations = []; unbalancedNode = null;
                const result = { val: v, rotation: '' };
                root = avlInsert(root, v, result);
                lastInserted = v;
                insertionHistory.push(v);
                if (result.rotation) {
                    rotationInfo = result.rotation;
                    addLog('旋转', `插入 ${v} 触发 <b>${result.rotation}</b>`, 'text-orange-600 font-bold');
                } else {
                    addLog('插入', `插入结点 ${v}，无需旋转。`, 'text-gray-600');
                }
                renderTree();
                idx++;
                if (idx < arr.length) setTimeout(next, 1200);
                else {
                    setTimeout(() => {
                        lastInserted = null; unbalancedNode = null;
                        recentRotations = []; rotationInfo = '';
                        updateStatusBadge('回放完成', 'bg-green-100 text-green-700');
                        renderTree();
                    }, 1500);
                }
            }
            next();
        }

        // ---- 树绘制 ----
        function getMaxHeight(node) { if (!node) return 0; return 1 + Math.max(getMaxHeight(node.left), getMaxHeight(node.right)); }

        function renderTree() {
            const area = document.getElementById('tree-area');
            area.innerHTML = '';
            if (!root) { area.innerHTML = '<div class="text-gray-400 text-center py-16">空树，请插入结点或选择示例</div>'; return; }

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.classList.add('tree-svg');
            area.appendChild(svg);

            const h = getMaxHeight(root);
            const areaW = area.clientWidth || 800;
            const totalW = Math.pow(2, h) * 60;
            const w = Math.max(areaW, totalW);
            const nodeSize = 52;
            const levelH = 90;

            function layout(node, depth, left, right) {
                if (!node) return;
                const x = (left + right) / 2;
                const y = depth * levelH + 50;
                node.x = x; node.y = y;
                layout(node.left, depth + 1, left, x);
                layout(node.right, depth + 1, x, right);
            }
            layout(root, 0, 0, w);

            function drawEdges(node) {
                if (!node) return;
                if (node.left) {
                    const x1 = node.x + nodeSize / 2, y1 = node.y + nodeSize / 2;
                    const x2 = node.left.x + nodeSize / 2, y2 = node.left.y + nodeSize / 2;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                    line.setAttribute('stroke', '#cbd5e1'); line.setAttribute('stroke-width', '2');
                    svg.appendChild(line);
                    drawEdges(node.left);
                }
                if (node.right) {
                    const x1 = node.x + nodeSize / 2, y1 = node.y + nodeSize / 2;
                    const x2 = node.right.x + nodeSize / 2, y2 = node.right.y + nodeSize / 2;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                    line.setAttribute('stroke', '#cbd5e1'); line.setAttribute('stroke-width', '2');
                    svg.appendChild(line);
                    drawEdges(node.right);
                }
            }
            drawEdges(root);

            function drawNodes(node) {
                if (!node) return;
                const div = document.createElement('div');
                div.className = 'anode';
                div.style.left = node.x + 'px';
                div.style.top = node.y + 'px';
                div.textContent = node.val;

                // 平衡因子标签
                const bf = getBalance(node);
                const bfTag = document.createElement('span');
                bfTag.className = 'bf-tag';
                bfTag.textContent = 'BF=' + (bf >= 0 ? '+' + bf : bf);
                div.appendChild(bfTag);

                // 高亮逻辑
                if (unbalancedNode && node.val === unbalancedNode) div.classList.add('unbalanced');
                if (lastInserted && node.val === lastInserted) div.classList.add('inserted');
                if (recentRotations.includes(node.val)) div.classList.add('rotation-node');

                area.appendChild(div);
                drawNodes(node.left);
                drawNodes(node.right);
            }
            drawNodes(root);

            area.style.minWidth = w + 'px';
            area.style.minHeight = (h * levelH + 80) + 'px';
        }

        function addLog(type, message, colorClass = 'text-gray-800') {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = `p-3 bg-white rounded border border-gray-100 shadow-sm ${colorClass} leading-relaxed animate-fade-in`;
            entry.innerHTML = `<span class="inline-block px-1.5 py-0.5 bg-gray-100 rounded text-xs text-gray-500 mb-1 border">${type}</span><br>${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function updateStatusBadge(text, classes) {
            const badge = document.getElementById('status-badge');
            badge.textContent = text; badge.className = `px-2 py-1 rounded text-xs font-bold ${classes}`;
        }

        // 初始加载示例
        window.onload = function () {
            loadExample([50, 30, 80, 20, 40, 70, 90, 15, 25]);
        };
    </script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</body>
</html>
