<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红黑树 Red-Black Tree 演示 (408标准)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --node-size: 44px;
        }
        .tree-area {
            position: relative;
            min-height: 500px;
            overflow: auto;
        }
        .rnode {
            position: absolute;
            width: var(--node-size);
            height: var(--node-size);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            border: 3px solid;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        /* 红色节点 */
        .rnode.red {
            background: #ef4444;
            border-color: #dc2626;
            box-shadow: 0 0 8px rgba(239,68,68,0.5);
        }
        /* 黑色节点 */
        .rnode.black {
            background: #1f2937;
            border-color: #111827;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
        }
        /* 高亮：新插入 */
        .rnode.new-insert {
            animation: pulse-insert 0.8s ease-out 3;
        }
        @keyframes pulse-insert {
            0%, 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.6); }
            50% { box-shadow: 0 0 0 14px rgba(139,92,246,0); }
        }
        /* 高亮：正在处理的节点 */
        .rnode.highlight {
            animation: glow 0.6s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { filter: brightness(1); transform: scale(1); }
            to { filter: brightness(1.4); transform: scale(1.15); }
        }
        /* 高亮：父节点 */
        .rnode.hl-parent {
            box-shadow: 0 0 0 5px rgba(59,130,246,0.6) !important;
        }
        /* 高亮：叔节点 */
        .rnode.hl-uncle {
            box-shadow: 0 0 0 5px rgba(245,158,11,0.6) !important;
        }
        /* 高亮：祖父节点 */
        .rnode.hl-grand {
            box-shadow: 0 0 0 5px rgba(34,197,94,0.6) !important;
        }
        .tree-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        /* 性质面板 */
        .prop-item { transition: all 0.3s ease; }
        .prop-item.ok { border-left: 4px solid #22c55e; background: #f0fdf4; }
        .prop-item.fail { border-left: 4px solid #ef4444; background: #fef2f2; }
        /* 日志动画 */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .log-entry { animation: slideIn 0.35s ease-out; }
        /* 滚动条美化 */
        .log-panel::-webkit-scrollbar { width: 6px; }
        .log-panel::-webkit-scrollbar-track { background: #f1f5f9; }
        .log-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col font-sans">

    <!-- 顶部控制栏 -->
    <div class="bg-white shadow-sm border-b p-3 flex flex-wrap gap-3 items-center justify-between z-10">
        <div class="flex gap-3 items-center flex-wrap">
            <h1 class="text-lg font-bold text-red-600 mr-1 whitespace-nowrap">红黑树演示</h1>

            <div class="flex items-center gap-1.5">
                <label class="text-xs font-medium whitespace-nowrap">插入序列:</label>
                <input type="text" id="input-keys" value="12,1,9,2,0,11,7"
                    class="border rounded px-2 py-1 w-48 focus:outline-none focus:border-red-400 text-sm font-mono"
                    placeholder="逗号分隔">
                <button onclick="prepareInsertion()" id="btn-prepare"
                    class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition text-sm whitespace-nowrap">
                    准备插入
                </button>
            </div>

            <button onclick="resetTree()"
                class="px-3 py-1 bg-gray-700 text-white rounded hover:bg-gray-800 transition text-sm whitespace-nowrap">
                重置
            </button>
        </div>

        <div class="flex gap-2 items-center">
            <span id="status-badge" class="px-2 py-1 rounded text-xs font-bold bg-gray-200 text-gray-700">就绪</span>

            <button id="btn-step" onclick="doStep()"
                class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 transition text-sm flex items-center gap-1 disabled:opacity-50 whitespace-nowrap">
                <span>▶</span> 单步
            </button>
            <button id="btn-play" onclick="toggleAutoPlay()"
                class="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition text-sm flex items-center gap-1 disabled:opacity-50 whitespace-nowrap">
                <span>▶▶</span> <span id="play-label">自动</span>
            </button>
            <span id="step-counter" class="text-xs text-gray-500 font-mono whitespace-nowrap">步骤 0/0</span>
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden">
        <!-- 左侧：可视化区域 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 树绘制区域 -->
            <div class="flex-1 tree-area bg-gray-50 relative" id="tree-container">
                <svg class="tree-svg" id="tree-svg"></svg>
                <!-- 节点将由JS动态创建 -->
            </div>
            <!-- 图例 -->
            <div class="bg-white border-t px-4 py-2 flex gap-6 items-center text-xs text-gray-600">
                <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 rounded-full bg-[#ef4444] border-2 border-[#dc2626]"></div> 红色节点
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 rounded-full bg-[#1f2937] border-2 border-[#111827]"></div> 黑色节点
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 rounded-full border-3 border-blue-500" style="box-shadow: 0 0 0 4px rgba(59,130,246,0.4);"></div> 当前父节点
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 rounded-full border-3 border-amber-500" style="box-shadow: 0 0 0 4px rgba(245,158,11,0.4);"></div> 叔节点
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 rounded-full border-3 border-green-500" style="box-shadow: 0 0 0 4px rgba(34,197,94,0.4);"></div> 祖父节点
                </div>
                <span class="text-purple-600 font-medium ml-2">NIL节点均为黑色（省略绘制）</span>
            </div>
        </div>

        <!-- 右侧：日志与属性面板 -->
        <div class="w-80 bg-white border-l flex flex-col shadow-[-4px_0_15px_rgba(0,0,0,0.03)]">
            <!-- 红黑树性质 -->
            <div class="p-3 border-b bg-gray-50">
                <div class="font-bold text-sm mb-2 flex items-center gap-1">
                    <span>红黑树五条性质</span>
                </div>
                <div class="flex flex-col gap-1.5 text-xs">
                    <div id="prop1" class="prop-item p-1.5 rounded border ok">
                        1. 每个节点是红色或黑色
                    </div>
                    <div id="prop2" class="prop-item p-1.5 rounded border ok">
                        2. 根节点是黑色
                    </div>
                    <div id="prop3" class="prop-item p-1.5 rounded border ok">
                        3. 叶节点(NIL)是黑色
                    </div>
                    <div id="prop4" class="prop-item p-1.5 rounded border ok">
                        4. 红节点的子节点必为黑色
                    </div>
                    <div id="prop5" class="prop-item p-1.5 rounded border ok">
                        5. 任一节点到叶子的路径黑高相等
                    </div>
                </div>
                <div id="bh-info" class="text-xs text-gray-500 mt-2 font-mono"></div>
            </div>

            <!-- 日志 -->
            <div class="p-3 border-b bg-gray-50 font-bold text-sm flex justify-between items-center">
                <span>操作日志</span>
                <span id="current-op-desc" class="text-xs text-red-500 font-normal"></span>
            </div>
            <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-2 log-panel" id="log-container">
                <div class="text-center text-gray-400 text-sm py-8">点击"准备插入"开始演示</div>
            </div>
        </div>
    </div>

    <script>
    // ==================== 红黑树数据结构 ====================
    const RED = true;
    const BLACK = false;

    class RBNode {
        constructor(key, color = RED) {
            this.key = key;
            this.color = color;
            this.left = null;   // NIL
            this.right = null;  // NIL
            this.parent = null;
        }
    }

    const NIL = new RBNode(null, BLACK); // 哨兵NIL节点

    class RedBlackTree {
        constructor() {
            this.root = NIL;
        }

        // 左旋：以x为支点
        leftRotate(x) {
            if (x === NIL || x.right === NIL) return;
            const y = x.right;
            x.right = y.left;
            if (y.left !== NIL) y.left.parent = x;
            y.parent = x.parent;
            if (x.parent === NIL) this.root = y;
            else if (x === x.parent.left) x.parent.left = y;
            else x.parent.right = y;
            y.left = x;
            x.parent = y;
        }

        // 右旋：以x为支点
        rightRotate(x) {
            if (x === NIL || x.left === NIL) return;
            const y = x.left;
            x.left = y.right;
            if (y.right !== NIL) y.right.parent = x;
            y.parent = x.parent;
            if (x.parent === NIL) this.root = y;
            else if (x === x.parent.right) x.parent.right = y;
            else x.parent.left = y;
            y.right = x;
            x.parent = y;
        }

        // BST插入（返回新节点，颜色暂不设置）
        bstInsert(key) {
            let node = new RBNode(key, RED);
            node.left = NIL;
            node.right = NIL;

            let y = NIL;
            let x = this.root;
            while (x !== NIL) {
                y = x;
                if (node.key < x.key) x = x.left;
                else x = x.right;
            }
            node.parent = y;
            if (y === NIL) this.root = node;
            else if (node.key < y.key) y.left = node;
            else y.right = node;

            return node;
        }

        // 按key查找节点
        find(key) {
            let x = this.root;
            while (x !== NIL && x.key !== key) {
                if (key < x.key) x = x.left;
                else x = x.right;
            }
            return x === NIL ? null : x;
        }

        // 获取祖父节点
        grandparent(node) {
            if (node !== NIL && node.parent !== NIL) return node.parent.parent;
            return NIL;
        }

        // 获取叔节点
        uncle(node) {
            const g = this.grandparent(node);
            if (g === NIL) return NIL;
            if (node.parent === g.left) return g.right;
            return g.left;
        }

        // 获取兄弟节点
        sibling(node) {
            if (node === NIL || node.parent === NIL) return NIL;
            if (node === node.parent.left) return node.parent.right;
            return node.parent.left;
        }

        // 深度克隆整个树
        clone() {
            const newTree = new RedBlackTree();
            newTree.root = this._cloneNode(this.root, NIL);
            return newTree;
        }

        _cloneNode(node, newParent) {
            if (node === NIL) return NIL;
            const newNode = new RBNode(node.key, node.color);
            newNode.parent = newParent;
            newNode.left = this._cloneNode(node.left, newNode);
            newNode.right = this._cloneNode(node.right, newNode);
            return newNode;
        }

        // 获取所有节点（中序遍历）
        getAllNodes() {
            const nodes = [];
            this._inorder(this.root, nodes);
            return nodes;
        }

        _inorder(node, arr) {
            if (node === NIL) return;
            this._inorder(node.left, arr);
            arr.push(node);
            this._inorder(node.right, arr);
        }

        // 计算黑高（从根到最深NIL）
        getBlackHeight() {
            return this._calcBH(this.root);
        }

        _calcBH(node) {
            if (node === NIL) return 0;
            let leftBH = this._calcBH(node.left);
            let rightBH = this._calcBH(node.right);
            // 对于检查性质5，返回子树的黑高
            if (leftBH !== rightBH) return -1; // 黑高不一致
            return leftBH + (node.color === BLACK ? 1 : 0);
        }

        // 检查性质4：无连续红节点
        checkNoDoubleRed() {
            return this._checkDR(this.root);
        }

        _checkDR(node) {
            if (node === NIL) return true;
            if (node.color === RED) {
                if (node.left !== NIL && node.left.color === RED) return false;
                if (node.right !== NIL && node.right.color === RED) return false;
            }
            return this._checkDR(node.left) && this._checkDR(node.right);
        }

        // 验证五条性质
        verifyProperties() {
            if (this.root === NIL) return { p1: true, p2: true, p3: true, p4: true, p5: true, bh: 0 };

            const p1 = true; // 数据结构保证
            const p2 = this.root.color === BLACK;
            const p3 = true; // NIL始终为黑
            const bh = this._calcBH(this.root);
            const p4 = this.checkNoDoubleRed();
            const p5 = bh !== -1;

            return { p1, p2, p3, p4, p5, bh: p5 ? bh : '不一致' };
        }
    }

    // ==================== 步骤生成 ====================
    /**
     * 在给定树上模拟插入一个键，直接修改该树，并返回操作步骤序列。
     * 注意：此函数会直接修改传入的 tree（用于模拟），调用者应先克隆。
     */
    function generateSteps(tree, key) {
        const steps = [];

        // 1. BST插入
        const z = tree.bstInsert(key);
        z.color = RED;
        steps.push({
            type: 'insert-bst',
            key: key,
            desc: '按BST规则插入节点 ' + key + '，颜色为<strong>红色</strong>（新插入节点必须为红）',
            affected: [key]
        });

        // 2. 检查是否需要修复
        if (z.parent === NIL || z.parent.color === BLACK) {
            // 父节点为黑色（或为根），无需修复
            if (z.parent === NIL) {
                // 新节点是根
                steps.push({
                    type: 'root-black',
                    key: key,
                    desc: '插入后节点 ' + key + ' 为根节点，根据性质2，<strong>染为黑色</strong>',
                    affected: [key]
                });
            } else {
                steps.push({
                    type: 'parent-black',
                    key: key,
                    desc: '父节点为<strong>黑色</strong>，直接插入红色节点 ' + key + ' 不违反红黑树性质，无需调整',
                    affected: [key]
                });
            }
        } else {
            // 需要修复：父节点为红色
            let zSim = z;
            while (zSim !== tree.root && zSim.parent.color === RED) {
                const p = zSim.parent;
                const g = tree.grandparent(zSim);
                const u = tree.uncle(zSim);

                if (u.color === RED) {
                    // === 情况1：叔节点为红色 ===
                    steps.push({
                        type: 'case1',
                        zKey: zSim.key,
                        pKey: p.key,
                        uKey: u.key,
                        gKey: g.key,
                        desc: '<strong>【情况1】</strong>叔节点 ' + u.key + ' 为红色：将父节点 ' + p.key + ' 和叔节点 ' + u.key + ' 染<strong>黑</strong>，祖父节点 ' + g.key + ' 染<strong>红</strong>，将当前节点上移至祖父',
                        affected: [zSim.key, p.key, u.key, g.key]
                    });
                    p.color = BLACK;
                    u.color = BLACK;
                    g.color = RED;
                    zSim = g;
                } else {
                    // 叔节点为黑色 → 情况2或3
                    if (zSim === p.right && p === g.left) {
                        // LR: 情况2
                        steps.push({
                            type: 'case2',
                            zKey: zSim.key,
                            pKey: p.key,
                            gKey: g.key,
                            dir: 'LR',
                            desc: '<strong>【情况2 - LR型】</strong>当前节点 ' + zSim.key + ' 是父节点 ' + p.key + ' 的右孩子，父节点是祖父 ' + g.key + ' 的左孩子。对父节点 ' + p.key + ' <strong>左旋</strong>，转化为LL型（情况3）',
                            affected: [zSim.key, p.key, g.key]
                        });
                        tree.leftRotate(p);
                        zSim = p; // 现在zSim是旧父节点（变成左孩子）
                    } else if (zSim === p.left && p === g.right) {
                        // RL: 情况2
                        steps.push({
                            type: 'case2',
                            zKey: zSim.key,
                            pKey: p.key,
                            gKey: g.key,
                            dir: 'RL',
                            desc: '<strong>【情况2 - RL型】</strong>当前节点 ' + zSim.key + ' 是父节点 ' + p.key + ' 的左孩子，父节点是祖父 ' + g.key + ' 的右孩子。对父节点 ' + p.key + ' <strong>右旋</strong>，转化为RR型（情况3）',
                            affected: [zSim.key, p.key, g.key]
                        });
                        tree.rightRotate(p);
                        zSim = p;
                    }

                    // === 情况3：叔节点为黑色，且为LL或RR ===
                    const p2 = zSim.parent;
                    const g2 = tree.grandparent(zSim);
                    if (p2 !== NIL && g2 !== NIL) {
                        let dir3;
                        if (zSim === p2.left && p2 === g2.left) dir3 = 'LL';
                        else dir3 = 'RR';

                        steps.push({
                            type: 'case3',
                            zKey: zSim.key,
                            pKey: p2.key,
                            gKey: g2.key,
                            dir: dir3,
                            desc: '<strong>【情况3 - ' + dir3 + '型】</strong>叔节点为黑色，当前为' + dir3 + '型：父节点 ' + p2.key + ' 染<strong>黑</strong>，祖父 ' + g2.key + ' 染<strong>红</strong>，对祖父 ' + g2.key + ' 进行<strong>' + (dir3 === 'LL' ? '右' : '左') + '旋</strong>',
                            affected: [zSim.key, p2.key, g2.key]
                        });

                        p2.color = BLACK;
                        g2.color = RED;
                        if (dir3 === 'LL') tree.rightRotate(g2);
                        else tree.leftRotate(g2);
                    }
                    break; // 情况3后循环终止
                }
            }
        }

        // 确保根为黑色
        if (tree.root.color === RED) {
            steps.push({
                type: 'root-black',
                key: tree.root.key,
                desc: '根据性质2，将根节点 ' + tree.root.key + ' <strong>染为黑色</strong>',
                affected: [tree.root.key]
            });
            tree.root.color = BLACK;
        }

        // 验证模拟结果
        const verify = tree.verifyProperties();
        if (!verify.p2 || !verify.p4 || !verify.p5) {
            steps.push({
                type: 'error',
                desc: '模拟验证失败！性质检查：p2=' + verify.p2 + ' p4=' + verify.p4 + ' p5=' + verify.p5,
                affected: []
            });
        }

        return steps;
    }

    // ==================== 全局状态 ====================
    let mainTree = new RedBlackTree();
    let pendingSteps = [];       // 待执行的步骤队列
    let executedSteps = [];     // 已执行的步骤
    let autoPlayTimer = null;
    let isAutoPlaying = false;
    let highlightKeys = [];     // 当前高亮的节点key列表
    let highlightType = {};     // { key: 'parent'|'uncle'|'grand'|'new' }

    // ==================== 步骤执行 ====================
    function applyStep(step) {
        // 将步骤应用到主树
        highlightKeys = [];
        highlightType = {};

        switch (step.type) {
            case 'insert-bst': {
                const node = mainTree.bstInsert(step.key);
                node.color = RED;
                highlightKeys = [step.key];
                highlightType[step.key] = 'new';
                break;
            }
            case 'parent-black': {
                highlightKeys = step.affected;
                highlightType[step.key] = 'new';
                break;
            }
            case 'root-black': {
                const node = mainTree.find(step.key);
                if (node) node.color = BLACK;
                highlightKeys = [step.key];
                break;
            }
            case 'case1': {
                const p = mainTree.find(step.pKey);
                const u = mainTree.find(step.uKey);
                const g = mainTree.find(step.gKey);
                if (p) p.color = BLACK;
                if (u) u.color = BLACK;
                if (g) g.color = RED;
                highlightKeys = step.affected;
                highlightType[step.pKey] = 'parent';
                highlightType[step.uKey] = 'uncle';
                highlightType[step.gKey] = 'grand';
                break;
            }
            case 'case2': {
                const p = mainTree.find(step.pKey);
                const g = mainTree.find(step.gKey);
                if (!p) break;
                if (step.dir === 'LR') mainTree.leftRotate(p);
                else mainTree.rightRotate(p);
                highlightKeys = step.affected;
                if (p) highlightType[step.pKey] = 'parent';
                if (g) highlightType[step.gKey] = 'grand';
                break;
            }
            case 'case3': {
                const p2 = mainTree.find(step.pKey);
                const g2 = mainTree.find(step.gKey);
                if (p2) p2.color = BLACK;
                if (g2 && g2 !== NIL) {
                    g2.color = RED;
                    if (step.dir === 'LL') mainTree.rightRotate(g2);
                    else mainTree.leftRotate(g2);
                }
                highlightKeys = step.affected;
                highlightType[step.pKey] = 'parent';
                highlightType[step.gKey] = 'grand';
                break;
            }
            case 'error': {
                break;
            }
        }

        executedSteps.push(step);
        return step;
    }

    // ==================== 树可视化 ====================
    function getTreeLayout() {
        // 中序遍历分配x坐标，深度分配y坐标
        const nodes = mainTree.getAllNodes();
        if (nodes.length === 0) return { positions: {}, edges: [], treeWidth: 0, treeHeight: 0 };

        // x坐标：按中序位置
        const xMap = {};
        nodes.forEach((node, i) => {
            xMap[node.key] = i;
        });

        const positions = {};
        const edges = [];
        const nodeSize = 44;
        const hGap = 60;
        const vGap = 80;
        const marginX = 50;

        // 递归遍历，同时传递深度，避免O(n²)的getDepth调用
        function traverse(node, depth) {
            if (node === NIL || node === null) return;
            const xIndex = xMap[node.key];
            positions[node.key] = {
                x: marginX + xIndex * hGap,
                y: 40 + depth * vGap,
                color: node.color
            };

            // 添加边
            if (node.left !== NIL && node.left !== null) {
                edges.push({ from: node.key, to: node.left.key });
                traverse(node.left, depth + 1);
            }
            if (node.right !== NIL && node.right !== null) {
                edges.push({ from: node.key, to: node.right.key });
                traverse(node.right, depth + 1);
            }
        }

        traverse(mainTree.root, 0);

        // 计算总尺寸
        let maxX = 0, maxY = 0;
        for (const pos of Object.values(positions)) {
            if (pos.x + nodeSize > maxX) maxX = pos.x + nodeSize;
            if (pos.y + nodeSize > maxY) maxY = pos.y + nodeSize;
        }

        return {
            positions,
            edges,
            treeWidth: Math.max(maxX + marginX, 300),
            treeHeight: Math.max(maxY + 60, 400)
        };
    }

    function renderTree() {
        const container = document.getElementById('tree-container');
        const svg = document.getElementById('tree-svg');
        const layout = getTreeLayout();

        // 调整容器和SVG大小
        container.style.minWidth = layout.treeWidth + 'px';
        container.style.minHeight = layout.treeHeight + 'px';
        svg.setAttribute('viewBox', '0 0 ' + layout.treeWidth + ' ' + layout.treeHeight);
        svg.style.width = layout.treeWidth + 'px';
        svg.style.height = layout.treeHeight + 'px';

        // 绘制边
        let edgeSvg = '';
        for (const edge of layout.edges) {
            const from = layout.positions[edge.from];
            const to = layout.positions[edge.to];
            if (!from || !to) continue;
            const nodeSize = 44;
            const r = nodeSize / 2;
            const x1 = from.x + r, y1 = from.y + r;
            const x2 = to.x + r, y2 = to.y + r;
            edgeSvg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
                stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />`;
        }
        svg.innerHTML = edgeSvg;

        // 清除旧节点DOM元素
        container.querySelectorAll('.rnode').forEach(el => el.remove());

        // 创建新节点DOM元素
        for (const [key, pos] of Object.entries(layout.positions)) {
            const nodeDiv = document.createElement('div');
            const colorClass = pos.color === RED ? 'red' : 'black';
            nodeDiv.className = 'rnode ' + colorClass;

            // 高亮class
            if (highlightKeys.includes(Number(key))) {
                if (highlightType[key] === 'new') nodeDiv.classList.add('new-insert');
                else if (highlightType[key] === 'parent') nodeDiv.classList.add('hl-parent');
                else if (highlightType[key] === 'uncle') nodeDiv.classList.add('hl-uncle');
                else if (highlightType[key] === 'grand') nodeDiv.classList.add('hl-grand');
                else nodeDiv.classList.add('highlight');
            }

            nodeDiv.style.left = pos.x + 'px';
            nodeDiv.style.top = pos.y + 'px';
            nodeDiv.textContent = key;
            nodeDiv.title = '节点 ' + key + ' (' + (pos.color === RED ? '红' : '黑') + ')';

            container.appendChild(nodeDiv);
        }

        // 更新性质面板
        updatePropertiesPanel();

        // 更新步骤计数
        document.getElementById('step-counter').textContent =
            '步骤 ' + executedSteps.length + '/' + (executedSteps.length + pendingSteps.length);
    }

    function updatePropertiesPanel() {
        const v = mainTree.verifyProperties();
        const setProp = (id, ok) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('ok', 'fail');
            el.classList.add(ok ? 'ok' : 'fail');
        };
        setProp('prop1', v.p1);
        setProp('prop2', v.p2);
        setProp('prop3', v.p3);
        setProp('prop4', v.p4);
        setProp('prop5', v.p5);

        const bhEl = document.getElementById('bh-info');
        if (bhEl) {
            bhEl.textContent = '黑高(BH): ' + v.bh + ' | 节点数: ' + mainTree.getAllNodes().length;
        }

        // 更新状态
        const status = document.getElementById('status-badge');
        const allOk = v.p1 && v.p2 && v.p3 && v.p4 && v.p5;
        if (mainTree.root === NIL) {
            status.textContent = '空树';
            status.className = 'px-2 py-1 rounded text-xs font-bold bg-gray-200 text-gray-700';
        } else if (allOk) {
            status.textContent = '性质满足';
            status.className = 'px-2 py-1 rounded text-xs font-bold bg-green-100 text-green-700';
        } else {
            status.textContent = '性质违反!';
            status.className = 'px-2 py-1 rounded text-xs font-bold bg-red-100 text-red-700';
        }
    }

    // ==================== 日志面板 ====================
    function addLog(type, message, colorClass = 'text-gray-800') {
        const container = document.getElementById('log-container');
        // 如果日志面板中只有占位提示文字，清除它
        const placeholder = container.querySelector('.text-center');
        if (placeholder) {
            container.innerHTML = '';
        }

        const div = document.createElement('div');
        div.className = `log-entry p-2.5 bg-white rounded border border-gray-100 shadow-sm ${colorClass} text-xs leading-relaxed`;
        const typeColors = {
            'BST插入': 'bg-blue-100 text-blue-700',
            '直接完成': 'bg-green-100 text-green-700',
            '情况1': 'bg-yellow-100 text-yellow-700',
            '情况2': 'bg-orange-100 text-orange-700',
            '情况3': 'bg-purple-100 text-purple-700',
            '根修正': 'bg-gray-200 text-gray-700',
            '错误': 'bg-red-100 text-red-700',
            '系统': 'bg-gray-100 text-gray-600'
        };
        const badgeClass = typeColors[type] || 'bg-gray-100 text-gray-600';
        div.innerHTML = `<span class="inline-block px-1.5 py-0.5 rounded text-xs font-bold ${badgeClass} mr-1.5">${type}</span> ${message}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;

        // 更新当前操作描述
        document.getElementById('current-op-desc').textContent = type + ': ' + message.replace(/<[^>]*>/g, '').substring(0, 40);
        setTimeout(() => { document.getElementById('current-op-desc').textContent = ''; }, 3000);
    }

    function getStepTypeLabel(step) {
        const map = {
            'insert-bst': 'BST插入',
            'parent-black': '直接完成',
            'root-black': '根修正',
            'case1': '情况1',
            'case2': '情况2',
            'case3': '情况3',
            'error': '错误'
        };
        return map[step.type] || step.type;
    }

    // ==================== UI操作 ====================
    function prepareInsertion() {
        stopAutoPlay();
        const input = document.getElementById('input-keys').value.trim();
        if (!input) {
            addLog('系统', '请输入要插入的键值（逗号分隔）', 'text-red-600');
            return;
        }

        const keys = input.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        if (keys.length === 0) {
            addLog('系统', '未识别到有效的键值', 'text-red-600');
            return;
        }

        // 如果有未执行的旧步骤，在日志中说明
        if (pendingSteps.length > 0) {
            addLog('系统', '放弃之前的 ' + pendingSteps.length + ' 个未执行步骤，重新生成', 'text-orange-500');
        }

        // 清空步骤队列
        pendingSteps = [];
        executedSteps = [];

        // 使用模拟树串联生成所有步骤（避免每个键独立克隆导致状态不连贯）
        const simTree = mainTree.clone();
        const actualKeysInserted = [];

        for (const key of keys) {
            // 检查是否重复（在主树上查，因为步骤将应用于主树）
            if (mainTree.find(key)) {
                addLog('系统', '键值 ' + key + ' 已存在，跳过', 'text-gray-500');
                continue;
            }
            const steps = generateSteps(simTree, key);
            pendingSteps.push(...steps);
            actualKeysInserted.push(key);
        }

        addLog('系统', '已生成 <strong>' + pendingSteps.length + '</strong> 个步骤，准备插入 ' + actualKeysInserted.length + ' 个节点：[' + actualKeysInserted.join(', ') + ']', 'text-blue-600 font-bold');

        // 启用按钮
        updateButtons();
        renderTree();
    }

    function doStep() {
        if (pendingSteps.length === 0) {
            addLog('系统', '所有步骤已执行完毕', 'text-gray-500');
            updateButtons();
            return;
        }

        const step = pendingSteps.shift();
        applyStep(step);
        addLog(getStepTypeLabel(step), step.desc);
        renderTree();

        updateButtons();
    }

    function toggleAutoPlay() {
        if (isAutoPlaying) {
            stopAutoPlay();
        } else {
            startAutoPlay();
        }
    }

    function startAutoPlay() {
        if (pendingSteps.length === 0) {
            addLog('系统', '没有待执行的步骤', 'text-gray-500');
            return;
        }
        isAutoPlaying = true;
        document.getElementById('play-label').textContent = '暂停';
        document.getElementById('btn-step').disabled = true;
        document.getElementById('btn-prepare').disabled = true;

        function next() {
            if (!isAutoPlaying || pendingSteps.length === 0) {
                stopAutoPlay();
                return;
            }
            doStep();
            autoPlayTimer = setTimeout(next, 1200);
        }
        autoPlayTimer = setTimeout(next, 300);
    }

    function stopAutoPlay() {
        isAutoPlaying = false;
        document.getElementById('play-label').textContent = '自动';
        document.getElementById('btn-step').disabled = false;
        document.getElementById('btn-prepare').disabled = false;
        if (autoPlayTimer) {
            clearTimeout(autoPlayTimer);
            autoPlayTimer = null;
        }
    }

    function updateButtons() {
        document.getElementById('btn-step').disabled = pendingSteps.length === 0;
        if (pendingSteps.length === 0 && isAutoPlaying) stopAutoPlay();
        document.getElementById('step-counter').textContent =
            '步骤 ' + executedSteps.length + '/' + (executedSteps.length + pendingSteps.length);
    }

    function resetTree() {
        stopAutoPlay();
        mainTree = new RedBlackTree();
        pendingSteps = [];
        executedSteps = [];
        highlightKeys = [];
        highlightType = {};
        document.getElementById('log-container').innerHTML =
            '<div class="text-center text-gray-400 text-sm py-8">树已重置，点击"准备插入"开始</div>';
        document.getElementById('current-op-desc').textContent = '';
        document.getElementById('status-badge').textContent = '空树';
        document.getElementById('status-badge').className = 'px-2 py-1 rounded text-xs font-bold bg-gray-200 text-gray-700';
        document.getElementById('step-counter').textContent = '步骤 0/0';
        document.getElementById('btn-step').disabled = false;
        document.getElementById('btn-prepare').disabled = false;
        updatePropertiesPanel();
        renderTree();
    }

    function autoInit() {
        // 自动初始化：加载默认序列
        resetTree();
        const defaultKeys = '12,1,9,2,0,11,7';
        document.getElementById('input-keys').value = defaultKeys;
        prepareInsertion();
        addLog('系统', '已自动加载默认序列：[' + defaultKeys + ']，共 ' + pendingSteps.length + ' 步，点击"单步"或"自动"开始', 'text-blue-600');
    }

    // ==================== 键盘快捷键 ====================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            doStep();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (pendingSteps.length === 0) prepareInsertion();
        } else if (e.key === 'a' || e.key === 'A') {
            e.preventDefault();
            toggleAutoPlay();
        } else if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            resetTree();
        } else if (e.key === 'i' || e.key === 'I') {
            e.preventDefault();
            autoInit();
        }
    });

    // ==================== 初始化 ====================
    window.onload = function() {
        autoInit();

        // 设置默认序列按钮提示
        document.getElementById('input-keys').title = '输入逗号分隔的键值序列，例如：12,1,9,2,0,11,7';
    };

    // 窗口大小变化时重绘
    window.addEventListener('resize', function() {
        renderTree();
    });
    </script>
</body>
</html>
