<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFS 广度优先搜索 演示 (408标准)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .node{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1rem;border:2px solid #d1d5db;background:#fff;transition:all .4s;position:absolute;z-index:2}
        .node.visited{background:#bbf7d0;border-color:#22c55e}
        .node.current{background:#bfdbfe;border-color:#3b82f6;box-shadow:0 0 0 6px rgba(59,130,246,.25);transform:scale(1.15);z-index:5}
        .node.in-queue{background:#fef08a;border-color:#eab308}
        .graph-area{position:relative;width:600px;height:420px;margin:0 auto}
        @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
        .animate-fade-in{animation:fadeIn .3s ease-out forwards}
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col">
    <div class="bg-white shadow-sm border-b p-4 flex flex-wrap gap-4 items-center justify-between z-10">
        <div class="flex gap-4 items-center">
            <h1 class="text-xl font-bold text-green-600 mr-2">BFS 广度优先搜索 演示</h1>
            <button onclick="initApp()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">初始化 / 重置</button>
        </div>
        <div class="flex gap-2">
            <button id="btn-step" onclick="step()" class="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-700 transition disabled:opacity-50">单步执行</button>
            <button id="btn-play" onclick="togglePlay()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition disabled:opacity-50"><span id="play-text">自动播放</span></button>
        </div>
    </div>
    <div class="flex-1 flex overflow-hidden">
        <div class="flex-1 p-6 overflow-auto bg-gray-50 flex flex-col gap-4">
            <div class="bg-white p-4 rounded-lg shadow-sm border">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold">图 (邻接表表示)</h2>
                    <div class="flex gap-3 text-xs">
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-green-100 border border-green-400 rounded-full"></span>已访问</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-100 border border-blue-400 rounded-full"></span>当前</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-yellow-100 border border-yellow-400 rounded-full"></span>队列中</span>
                    </div>
                </div>
                <div class="graph-area" id="graph-area"></div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-sm border">
                <h2 class="text-lg font-bold mb-2">遍历顺序 & BFS 生成树 (无权图最短路径)</h2>
                <div id="traversal-seq" class="font-mono text-lg font-bold text-green-600"></div>
                <div id="tree-edges" class="font-mono text-sm text-gray-600 mt-1"></div>
                <div id="dist-info" class="font-mono text-sm text-gray-500 mt-1"></div>
            </div>
        </div>
        <div class="w-80 bg-white border-l flex flex-col">
            <div class="p-4 border-b bg-gray-50 font-bold flex justify-between items-center">
                <span>执行日志</span>
                <span id="status-badge" class="px-2 py-1 rounded text-xs bg-gray-200 text-gray-700">未开始</span>
            </div>
            <div class="p-3 border-b text-sm"><span class="font-bold">队列:</span> <span id="queue-display" class="font-mono text-green-600"></span></div>
            <div class="p-3 border-b text-sm"><span class="font-bold">visited[]:</span> <span id="visited-arr" class="font-mono"></span></div>
            <div class="p-3 border-b text-sm"><span class="font-bold">dist[]:</span> <span id="dist-arr" class="font-mono text-blue-600"></span></div>
            <div id="log-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 font-mono text-sm"></div>
        </div>
    </div>
    <script>
        var adj=[[1,2],[0,3,4],[0,5,6],[1],[1],[2],[2]];
        var n=7;
        var positions=[{x:300,y:30},{x:180,y:140},{x:420,y:140},{x:80,y:280},{x:240,y:280},{x:360,y:280},{x:500,y:280}];
        var visited=[],dist=[],queue=[],seq=[],treeEdges=[];
        var status=0,isPlaying=false,playInterval=null;
        var currentV=-1;

        function initApp(){
            visited=new Array(n).fill(false);dist=new Array(n).fill(-1);
            queue=[];seq=[];treeEdges=[];
            status=1;currentV=-1;
            visited[0]=true;dist[0]=0;queue.push(0);seq.push(0);
            document.getElementById('log-container').innerHTML='';
            document.getElementById('traversal-seq').textContent='';
            document.getElementById('tree-edges').textContent='';
            document.getElementById('dist-info').textContent='';
            updateUI();
            updateStatusBadge("运行中","bg-green-100 text-green-700");
            addLog("系统","BFS 从顶点 0 开始。入队: [0], dist[0]=0。邻接表: 0→[1,2] 1→[0,3,4] 2→[0,5,6]","text-gray-700");
            renderGraph();
        }

        function step(){
            if(status!==1)return;
            if(queue.length===0){
                // check for disconnected components
                for(var j=0;j<n;j++){
                    if(!visited[j]){
                        visited[j]=true;dist[j]=0;queue.push(j);seq.push(j);
                        addLog("新分量","发现新的连通分量，从顶点 "+j+" 开始","text-purple-600");
                        updateUI();renderGraph();return;
                    }
                }
                finish();return;
            }
            var v=queue.shift();
            currentV=v;
            addLog("出队","顶点 "+v+" 出队 (dist="+dist[v]+")，检查邻接点","text-blue-600 font-bold");
            var foundAny=false;
            for(var k=0;k<adj[v].length;k++){
                var w=adj[v][k];
                if(!visited[w]){
                    visited[w]=true;dist[w]=dist[v]+1;queue.push(w);seq.push(w);
                    treeEdges.push(v+"→"+w);
                    addLog("发现","从 "+v+" 发现 "+w+"（树边），入队，dist["+w+"]="+dist[w],"text-green-600");
                    foundAny=true;
                }else{
                    addLog("横跨边","("+v+","+w+") 为横跨边，"+w+" 已访问","text-gray-400");
                }
            }
            if(!foundAny)addLog("无发现","顶点 "+v+" 的所有邻接点均已访问","text-gray-500");
            updateUI();renderGraph();
        }

        function finish(){
            status=2;
            updateStatusBadge("遍历完成","bg-green-100 text-green-700");
            document.getElementById('traversal-seq').textContent="遍历顺序: "+seq.join(" → ");
            document.getElementById('tree-edges').textContent="生成树边: "+treeEdges.join(", ");
            document.getElementById('dist-info').textContent="最短距离(BFS树): "+dist.map(function(d,i){return i+":"+d}).join(", ");
            addLog("完成","BFS 遍历结束。共 "+seq.length+" 个顶点，"+treeEdges.length+" 条树边。dist[] 给出无权图最短路径","text-green-600 font-bold text-base");
            stopAutoPlay();renderGraph();
        }

        function updateUI(){
            document.getElementById('visited-arr').textContent='['+visited.map(function(b){return b?'1':'0'}).join(' ')+']';
            document.getElementById('queue-display').textContent='['+queue.join(', ')+']';
            document.getElementById('dist-arr').textContent='['+dist.map(function(d){return d>=0?d:'∞'}).join(', ')+']';
            document.getElementById('traversal-seq').textContent=seq.length>0?"遍历顺序: "+seq.join(" → "):"";
            document.getElementById('tree-edges').textContent=treeEdges.length>0?"生成树边: "+treeEdges.join(", "):"";
        }

        function renderGraph(){
            var area=document.getElementById('graph-area');area.innerHTML='';
            var drawn=new Set();
            for(var u=0;u<n;u++){
                for(var k=0;k<adj[u].length;k++){
                    var v=adj[u][k];
                    var key=Math.min(u,v)+'-'+Math.max(u,v);
                    if(drawn.has(key))continue;drawn.add(key);
                    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
                    svg.setAttribute('style','position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1');
                    var line=document.createElementNS('http://www.w3.org/2000/svg','line');
                    line.setAttribute('x1',positions[u].x);line.setAttribute('y1',positions[u].y);
                    line.setAttribute('x2',positions[v].x);line.setAttribute('y2',positions[v].y);
                    var isTree=treeEdges.some(function(e){return e===u+'→'+v||e===v+'→'+u});
                    line.setAttribute('stroke',isTree?'#22c55e':'#d1d5db');
                    line.setAttribute('stroke-width',isTree?'3':'1.5');
                    svg.appendChild(line);area.appendChild(svg);
                }
            }
            for(var i=0;i<n;i++){
                var div=document.createElement('div');div.className='node';
                div.textContent=i;div.style.left=(positions[i].x-22)+'px';div.style.top=(positions[i].y-22)+'px';
                if(i===currentV)div.classList.add('current');
                else if(queue.indexOf(i)>=0)div.classList.add('in-queue');
                else if(visited[i])div.classList.add('visited');
                area.appendChild(div);
            }
        }

        function addLog(type,message,colorClass){
            colorClass=colorClass||"text-gray-800";
            var c=document.getElementById('log-container');
            var e=document.createElement('div');
            e.className='p-3 bg-white rounded border border-gray-100 shadow-sm '+colorClass+' leading-relaxed animate-fade-in';
            e.innerHTML='<span class="inline-block px-1.5 py-0.5 bg-gray-100 rounded text-xs text-gray-500 mb-1 mr-2 border">'+type+'</span><br>'+message;
            c.appendChild(e);c.scrollTop=c.scrollHeight;
        }

        function updateStatusBadge(text,classes){
            var b=document.getElementById('status-badge');b.innerText=text;b.className='px-2 py-1 rounded text-xs font-bold '+classes;
        }

        function togglePlay(){
            if(isPlaying){stopAutoPlay();return;}
            if(status===0||status===2)initApp();
            isPlaying=true;document.getElementById('play-text').innerText="暂停播放";
            document.getElementById('btn-step').disabled=true;
            playInterval=setInterval(function(){if(status===1)step();else stopAutoPlay();},900);
        }

        function stopAutoPlay(){
            isPlaying=false;document.getElementById('play-text').innerText="自动播放";
            document.getElementById('btn-step').disabled=false;
            if(playInterval)clearInterval(playInterval);
        }

        window.onload=initApp;
    </script>
</body>
</html>
