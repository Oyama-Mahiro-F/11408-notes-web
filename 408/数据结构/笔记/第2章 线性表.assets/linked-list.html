<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单链表操作演示 - 408数据结构</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --node-default: #6366f1;
  --node-new: #22c55e;
  --node-delete: #ef4444;
  --node-modified: #f59e0b;
  --node-visited: #eab308;
  --node-found: #22c55e;
}

body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
}

.node-box {
  min-width: 90px;
  height: 60px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  position: relative;
  transition: all 0.35s ease;
  cursor: default;
  user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  background: var(--node-default);
}

.node-box .node-data {
  font-size: 1.25rem;
  line-height: 1.2;
}

.node-box .node-label {
  font-size: 0.6rem;
  opacity: 0.55;
  margin-top: 1px;
}

/* States */
.node-box.state-new {
  background: var(--node-new) !important;
  box-shadow: 0 0 20px rgba(34,197,94,0.7), 0 0 40px rgba(34,197,94,0.3);
  animation: glowPulse 0.8s ease-in-out infinite alternate;
}

.node-box.state-deleting {
  background: var(--node-delete) !important;
  box-shadow: 0 0 18px rgba(239,68,68,0.6);
}

.node-box.state-modified {
  background: var(--node-modified) !important;
  box-shadow: 0 0 16px rgba(245,158,11,0.6);
}

.node-box.state-visited {
  background: var(--node-visited) !important;
  box-shadow: 0 0 14px rgba(234,179,8,0.5);
  color: #1a1a2e;
}

.node-box.state-found {
  background: var(--node-found) !important;
  box-shadow: 0 0 22px rgba(34,197,94,0.8);
  animation: foundBounce 0.5s ease;
}

@keyframes glowPulse {
  from { box-shadow: 0 0 14px rgba(34,197,94,0.6), 0 0 28px rgba(34,197,94,0.2); }
  to   { box-shadow: 0 0 22px rgba(34,197,94,0.9), 0 0 44px rgba(34,197,94,0.4); }
}

@keyframes foundBounce {
  0% { transform: scale(1.0); }
  40% { transform: scale(1.18); }
  100% { transform: scale(1.0); }
}

.arrow-line {
  transition: all 0.35s ease;
}

.arrow-modified {
  stroke: #f59e0b !important;
  stroke-width: 3 !important;
  filter: drop-shadow(0 0 4px rgba(245,158,11,0.7));
}

.head-label {
  position: absolute;
  font-size: 0.75rem;
  font-weight: 700;
  color: #f472b6;
  pointer-events: none;
  transition: all 0.35s ease;
}

.null-marker {
  font-size: 1.1rem;
  font-weight: 700;
  color: #94a3b8;
  margin-left: 8px;
}

#log-panel::-webkit-scrollbar { width: 6px; }
#log-panel::-webkit-scrollbar-track { background: #1e293b; border-radius: 3px; }
#log-panel::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

#nodes-scroll::-webkit-scrollbar { height: 6px; }
#nodes-scroll::-webkit-scrollbar-track { background: #0f172a; border-radius: 3px; }
#nodes-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

.ctrl-btn {
  transition: all 0.15s ease;
}
.ctrl-btn:active {
  transform: scale(0.95);
}
.ctrl-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

#viz-area {
  min-height: 240px;
  position: relative;
}

#arrow-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
}

#nodes-container {
  position: relative;
  z-index: 10;
}

.empty-state {
  color: #64748b;
  font-size: 1.1rem;
  font-style: italic;
}

.log-entry {
  font-size: 0.8rem;
  padding: 4px 6px;
  border-left: 3px solid transparent;
  margin-bottom: 3px;
  border-radius: 2px;
  animation: fadeIn 0.3s ease;
}
.log-entry.info  { border-left-color: #6366f1; color: #c7d2fe; }
.log-entry.step  { border-left-color: #f59e0b; color: #fcd34d; }
.log-entry.ok    { border-left-color: #22c55e; color: #86efac; }
.log-entry.error { border-left-color: #ef4444; color: #fca5a5; }
.log-entry.visit { border-left-color: #eab308; color: #fde047; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

<!-- ====== Top Control Bar ====== -->
<header class="bg-gray-800 border-b border-gray-700 px-5 py-3 flex flex-wrap items-center gap-3 shrink-0 shadow-lg">
  <h1 class="text-lg font-bold text-indigo-400 tracking-wide mr-3 whitespace-nowrap">
    第2章 线性表 · 单链表操作演示
  </h1>

  <div class="flex flex-wrap items-center gap-2">
    <!-- Value input -->
    <input id="input-value" type="number" value="99" placeholder="值"
      class="w-20 px-2 py-1.5 bg-gray-700 border border-gray-600 rounded text-sm text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500">

    <!-- Position input -->
    <input id="input-pos" type="number" value="3" min="1" placeholder="位置"
      class="w-16 px-2 py-1.5 bg-gray-700 border border-gray-600 rounded text-sm text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500">

    <!-- Operation buttons -->
    <button onclick="doHeadInsert()" class="ctrl-btn px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded text-sm font-semibold" id="btn-headIns">头插法</button>
    <button onclick="doTailInsert()" class="ctrl-btn px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded text-sm font-semibold" id="btn-tailIns">尾插法</button>
    <button onclick="doPosInsert()" class="ctrl-btn px-3 py-1.5 bg-sky-600 hover:bg-sky-500 rounded text-sm font-semibold" id="btn-posIns">按位置插入</button>
    <button onclick="doHeadDelete()" class="ctrl-btn px-3 py-1.5 bg-rose-700 hover:bg-rose-600 rounded text-sm font-semibold" id="btn-headDel">头删</button>
    <button onclick="doTailDelete()" class="ctrl-btn px-3 py-1.5 bg-rose-700 hover:bg-rose-600 rounded text-sm font-semibold" id="btn-tailDel">尾删</button>
    <button onclick="doPosDelete()" class="ctrl-btn px-3 py-1.5 bg-rose-700 hover:bg-rose-600 rounded text-sm font-semibold" id="btn-posDel">按位置删除</button>
    <button onclick="doSearch()" class="ctrl-btn px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 rounded text-sm font-semibold" id="btn-search">查找</button>
  </div>

  <div class="flex items-center gap-3 ml-auto">
    <label class="text-xs text-gray-400 flex items-center gap-1">
      速度:
      <input id="speed-slider" type="range" min="1" max="5" value="3" step="1"
        class="w-20 h-1.5 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-indigo-500">
      <span id="speed-label" class="text-gray-300 w-8">中速</span>
    </label>
    <button onclick="doAutoDemo()" class="ctrl-btn px-3 py-1.5 bg-violet-700 hover:bg-violet-600 rounded text-sm font-semibold" id="btn-auto">自动演示</button>
    <button onclick="doReset()" class="ctrl-btn px-3 py-1.5 bg-gray-600 hover:bg-gray-500 rounded text-sm font-semibold" id="btn-reset">重置</button>
    <button onclick="doClear()" class="ctrl-btn px-3 py-1.5 bg-gray-600 hover:bg-gray-500 rounded text-sm font-semibold" id="btn-clear">清空</button>
  </div>
</header>

<!-- ====== Main Content ====== -->
<main class="flex-1 flex overflow-hidden">

  <!-- Visualization Area (left ~70%) -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Visual canvas -->
    <div id="viz-area" class="flex-1 relative overflow-auto bg-gray-950 px-6 py-8 flex items-center justify-center">
      <svg id="arrow-svg"></svg>

      <!-- Scroll wrapper for nodes -->
      <div id="nodes-scroll" class="overflow-x-auto w-full flex justify-center">
        <div id="nodes-container" class="flex items-center gap-16 py-6 px-4 relative min-h-[120px]">
          <!-- Nodes and head pointer rendered by JS -->
        </div>
        <!-- Null / empty state -->
        <div id="null-area" class="flex items-center ml-2">
          <span class="null-marker">∧</span>
          <span class="text-xs text-gray-500 ml-1">NULL</span>
        </div>
      </div>

      <!-- Head pointer label overlay (positioned by JS) -->
      <div id="head-label" class="head-label" style="display:none;">head</div>
    </div>

    <!-- Stats bar -->
    <div class="bg-gray-800 border-t border-gray-700 px-5 py-2.5 flex items-center gap-6 text-sm shrink-0">
      <span class="text-gray-400">链表长度: <strong id="stat-length" class="text-white">4</strong></span>
      <span class="text-gray-400">链表: <strong id="stat-text" class="text-indigo-300 font-mono text-xs"></strong></span>
    </div>
  </div>

  <!-- Right Sidebar Log Panel (fixed width) -->
  <aside class="w-[280px] bg-gray-850 border-l border-gray-700 flex flex-col shrink-0" style="background:#111827;">
    <div class="px-4 py-3 border-b border-gray-700 font-semibold text-sm text-gray-300 flex items-center gap-2">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" fill="#6366f1"/><line x1="5" y1="6" x2="11" y2="6" stroke="#fff" stroke-width="1.2"/><line x1="5" y1="8.5" x2="9" y2="8.5" stroke="#fff" stroke-width="1.2"/><line x1="5" y1="11" x2="7" y2="11" stroke="#fff" stroke-width="1.2"/></svg>
      操作日志
      <button onclick="clearLog()" class="ml-auto text-xs text-gray-500 hover:text-gray-300 transition">清除</button>
    </div>
    <div id="log-panel" class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5">
      <div class="log-entry info">系统初始化完成。</div>
      <div class="log-entry info">链表已创建: [10, 20, 30, 40]</div>
    </div>
  </aside>

</main>

<!-- ====== JavaScript ====== -->
<script>
// ==================== Data Model ====================
let nodesMap = new Map();    // id -> { id, value, nextId }
let headId = null;
let nextId = 0;
let isAnimating = false;

// ==================== Init ====================
function initList(values) {
  nodesMap.clear();
  headId = null;
  nextId = 0;
  for (const v of values) {
    const id = nextId++;
    const newNode = { id, value: v, nextId: null };
    nodesMap.set(id, newNode);
    if (headId === null) {
      headId = id;
    } else {
      let cur = headId;
      while (nodesMap.get(cur).nextId !== null) {
        cur = nodesMap.get(cur).nextId;
      }
      nodesMap.get(cur).nextId = id;
    }
  }
}

function getOrderedIds() {
  const order = [];
  let cur = headId;
  while (cur !== null) {
    order.push(cur);
    cur = nodesMap.get(cur).nextId;
  }
  return order;
}

function getListLength() {
  return getOrderedIds().length;
}

function getNodeAtPosition(pos) {
  // pos is 1-indexed. Returns node id or null.
  const order = getOrderedIds();
  if (pos < 1 || pos > order.length) return null;
  return order[pos - 1];
}

// ==================== Rendering ====================
let currentHighlights = {};  // { newId, deleteId, modifiedIds:[], visitedId, foundId, headChanged, detachedId, highlightArrow:[fromId,toId] }

function render(highlights) {
  currentHighlights = highlights || {};
  const container = document.getElementById('nodes-container');
  const order = getOrderedIds();

  // Determine which nodes to show (include detached if present)
  let displayOrder = [...order];
  let detachedId = currentHighlights.detachedId || null;

  container.innerHTML = '';

  // Render detached node first (for head insert intermediate step)
  if (detachedId !== null && nodesMap.has(detachedId)) {
    const node = nodesMap.get(detachedId);
    const el = createNodeElement(node, 'detached-first');
    container.appendChild(el);
  }

  for (const id of order) {
    const node = nodesMap.get(id);
    if (!node) continue;
    const el = createNodeElement(node, 'in-list');
    container.appendChild(el);
  }

  // Show/hide null marker
  const nullArea = document.getElementById('null-area');
  nullArea.style.display = (order.length === 0 && !detachedId) ? 'none' : 'flex';

  // Show/hide empty state
  if (order.length === 0 && !detachedId) {
    container.innerHTML = '<div class="empty-state flex items-center justify-center w-full">空链表 — 请插入节点</div>';
    nullArea.style.display = 'none';
  }

  // Update head label
  updateHeadLabel();

  // Update stats
  updateStats();

  // Draw arrows (deferred to next frame for DOM layout)
  requestAnimationFrame(() => {
    requestAnimationFrame(() => drawArrows());
  });
}

function createNodeElement(node, placement) {
  const div = document.createElement('div');
  div.className = 'node-box';
  div.dataset.nodeId = node.id;
  div.dataset.placement = placement;

  // Apply state classes
  if (currentHighlights.newId === node.id) div.classList.add('state-new');
  if (currentHighlights.deleteId === node.id) div.classList.add('state-deleting');
  if (currentHighlights.modifiedIds && currentHighlights.modifiedIds.includes(node.id)) div.classList.add('state-modified');
  if (currentHighlights.visitedId === node.id) div.classList.add('state-visited');
  if (currentHighlights.foundId === node.id) div.classList.add('state-found');

  div.innerHTML = `
    <span class="node-data">${node.value}</span>
    <span class="node-label">next</span>
  `;
  return div;
}

function updateHeadLabel() {
  const label = document.getElementById('head-label');
  const order = getOrderedIds();

  if (order.length === 0 && !currentHighlights.detachedId) {
    label.style.display = 'none';
    return;
  }

  // Find the first node element
  const container = document.getElementById('nodes-container');
  let firstEl = null;

  // Check detached node first
  const detachedEl = container.querySelector('[data-placement="detached-first"]');
  if (detachedEl && currentHighlights.headChanged !== false) {
    firstEl = detachedEl;
  } else {
    firstEl = container.querySelector('[data-placement="in-list"]');
  }

  if (!firstEl) {
    label.style.display = 'none';
    return;
  }

  const vizArea = document.getElementById('viz-area');
  const vizRect = vizArea.getBoundingClientRect();
  const elRect = firstEl.getBoundingClientRect();

  label.style.display = 'block';
  label.style.left = (elRect.left - vizRect.left + elRect.width / 2 - 18) + 'px';
  label.style.top  = (elRect.top - vizRect.top - 28) + 'px';
}

function updateStats() {
  const len = getListLength();
  document.getElementById('stat-length').textContent = len;

  const order = getOrderedIds();
  let text = '';
  if (order.length === 0) {
    text = '∧ (空)';
  } else {
    const parts = order.map(id => '[' + nodesMap.get(id).value + ']');
    text = parts.join(' → ') + ' → ∧';
  }
  document.getElementById('stat-text').textContent = text;
}

// ==================== SVG Arrow Drawing ====================
function drawArrows() {
  const svg = document.getElementById('arrow-svg');
  const vizArea = document.getElementById('viz-area');
  const vizRect = vizArea.getBoundingClientRect();

  svg.innerHTML = '';

  // Defs with arrowhead markers
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
    <marker id="arrowhead-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f472b6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
    </marker>
  `;
  svg.appendChild(defs);

  const container = document.getElementById('nodes-container');
  const allNodes = container.querySelectorAll('.node-box');

  if (allNodes.length === 0) return;

  const highlightArrow = currentHighlights.highlightArrow || null; // [fromId, toId]

  // Draw arrows between consecutive nodes
  for (let i = 0; i < allNodes.length - 1; i++) {
    const fromEl = allNodes[i];
    const toEl = allNodes[i + 1];
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();

    const x1 = fromRect.right - vizRect.left;
    const y1 = fromRect.top + fromRect.height * 0.65 - vizRect.top;
    const x2 = toRect.left - vizRect.left;
    const y2 = toRect.top + toRect.height * 0.5 - vizRect.top;

    // Check if this arrow should be highlighted
    const fromId = parseInt(fromEl.dataset.nodeId);
    const toId = parseInt(toEl.dataset.nodeId);
    let isHighlighted = false;
    if (highlightArrow && highlightArrow[0] === fromId && highlightArrow[1] === toId) {
      isHighlighted = true;
    }

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2 - 4);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', isHighlighted ? '#f59e0b' : '#64748b');
    line.setAttribute('stroke-width', isHighlighted ? '2.5' : '2');
    line.setAttribute('marker-end', isHighlighted ? 'url(#arrowhead-orange)' : 'url(#arrowhead)');
    if (isHighlighted) {
      line.style.filter = 'drop-shadow(0 0 4px rgba(245,158,11,0.7))';
    }
    line.classList.add('arrow-line');
    svg.appendChild(line);
  }

  // Last node -> NULL
  const lastEl = allNodes[allNodes.length - 1];
  const lastRect = lastEl.getBoundingClientRect();
  const lx1 = lastRect.right - vizRect.left;
  const ly1 = lastRect.top + lastRect.height * 0.65 - vizRect.top;
  const lx2 = lx1 + 50;

  const lastLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  lastLine.setAttribute('x1', lx1);
  lastLine.setAttribute('y1', ly1);
  lastLine.setAttribute('x2', lx2);
  lastLine.setAttribute('y2', ly1);
  lastLine.setAttribute('stroke', '#475569');
  lastLine.setAttribute('stroke-width', '2');
  lastLine.setAttribute('marker-end', 'url(#arrowhead)');
  lastLine.classList.add('arrow-line');
  svg.appendChild(lastLine);

  // NULL text (∧)
  const nullText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  nullText.setAttribute('x', lx2 + 6);
  nullText.setAttribute('y', ly1 + 5);
  nullText.setAttribute('fill', '#94a3b8');
  nullText.setAttribute('font-size', '16');
  nullText.setAttribute('font-weight', '700');
  nullText.textContent = '∧';
  svg.appendChild(nullText);

  // Head label arrow
  const headLabel = document.getElementById('head-label');
  if (headLabel.style.display !== 'none' && allNodes.length > 0) {
    const firstEl = allNodes[0];
    const fRect = firstEl.getBoundingClientRect();
    const hRect = headLabel.getBoundingClientRect();

    const hx1 = hRect.left + hRect.width / 2 - vizRect.left;
    const hy1 = hRect.bottom - vizRect.top;
    const hx2 = fRect.left + fRect.width / 2 - vizRect.left;
    const hy2 = fRect.top - vizRect.top + 4;

    const headLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    headLine.setAttribute('x1', hx1);
    headLine.setAttribute('y1', hy1);
    headLine.setAttribute('x2', hx2);
    headLine.setAttribute('y2', hy2);
    headLine.setAttribute('stroke', '#f472b6');
    headLine.setAttribute('stroke-width', '2');
    headLine.setAttribute('stroke-dasharray', '5,3');
    headLine.setAttribute('marker-end', 'url(#arrowhead-pink)');
    headLine.classList.add('arrow-line');
    svg.appendChild(headLine);
  }
}

// ==================== Logger ====================
function addLog(msg, type) {
  type = type || 'info';
  const panel = document.getElementById('log-panel');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + type;
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' +
               now.getMinutes().toString().padStart(2,'0') + ':' +
               now.getSeconds().toString().padStart(2,'0');
  entry.textContent = '[' + time + '] ' + msg;
  panel.appendChild(entry);
  panel.scrollTop = panel.scrollHeight;
}

function clearLog() {
  const panel = document.getElementById('log-panel');
  panel.innerHTML = '';
  addLog('日志已清除。', 'info');
}

// ==================== Animation Utilities ====================
function getDelay() {
  const slider = document.getElementById('speed-slider');
  const val = parseInt(slider.value);
  // Map 1-5 to delays: 1200, 900, 650, 400, 200
  const delays = [1200, 900, 650, 400, 200];
  return delays[val - 1] || 650;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function setButtonsEnabled(enabled) {
  const btns = document.querySelectorAll('.ctrl-btn');
  btns.forEach(b => { b.disabled = !enabled; });
}

function updateSpeedLabel() {
  const slider = document.getElementById('speed-slider');
  const label = document.getElementById('speed-label');
  const labels = ['很慢', '慢', '中速', '快', '极快'];
  label.textContent = labels[parseInt(slider.value) - 1] || '中速';
}

// ==================== Operations ====================

// --- Head Insert (头插法) ---
async function doHeadInsert() {
  if (isAnimating) return;
  isAnimating = true;
  setButtonsEnabled(false);

  const inputVal = document.getElementById('input-value');
  const value = parseInt(inputVal.value) || 99;

  addLog(`头插法: 准备插入值 ${value}`, 'step');
  const oldHeadId = headId;
  const newNodeId = nextId++;
  const newNode = { id: newNodeId, value: value, nextId: oldHeadId };
  nodesMap.set(newNodeId, newNode);

  // Step 1: 创建新节点 (detached, green)
  addLog('步骤1/3: 创建新节点 [' + value + ']', 'step');
  render({ detachedId: newNodeId, newId: newNodeId, headChanged: false });
  await sleep(getDelay());

  // Step 2: 设置新节点.next = 原head节点
  addLog(`步骤2/3: 设置新节点.next 指向原首节点 [${nodesMap.get(oldHeadId) ? nodesMap.get(oldHeadId).value : '∧'}]`, 'step');
  headId = newNodeId;
  render({ newId: newNodeId, highlightArrow: [newNodeId, oldHeadId], modifiedIds: [newNodeId] });
  await sleep(getDelay());

  // Step 3: head指向新节点
  addLog('步骤3/3: 更新head指针，指向新节点 [' + value + ']', 'step');
  render({});
  await sleep(getDelay() * 0.6);

  addLog(`头插法完成！新节点 [${value}] 已插入链表头部。`, 'ok');

  // Randomize input for next operation
  inputVal.value = Math.floor(Math.random() * 90) + 10;

  isAnimating = false;
  setButtonsEnabled(true);
}

// --- Tail Insert (尾插法) ---
async function doTailInsert() {
  if (isAnimating) return;
  isAnimating = true;
  setButtonsEnabled(false);

  const inputVal = document.getElementById('input-value');
  const value = parseInt(inputVal.value) || 99;
  addLog(`尾插法: 准备插入值 ${value}`, 'step');

  // Step 1: 遍历找到最后一个节点
  addLog('步骤1/4: 遍历链表，寻找尾节点...', 'step');
  const order = getOrderedIds();

  if (order.length === 0) {
    // Empty list: insert as head
    addLog('链表为空，直接作为首节点插入。', 'info');
    const newNodeId = nextId++;
    nodesMap.set(newNodeId, { id: newNodeId, value: value, nextId: null });
    headId = newNodeId;
    render({ newId: newNodeId });
    await sleep(getDelay());
    addLog(`尾插法完成！新节点 [${value}] 已成为首节点。`, 'ok');
  } else {
    // Traverse animation
    for (let i = 0; i < order.length; i++) {
      const nodeId = order[i];
      const node = nodesMap.get(nodeId);
      addLog(`  访问节点: [${node.value}]`, 'visit');
      render({ visitedId: nodeId });
      await sleep(getDelay() * 0.6);
    }

    const tailId = order[order.length - 1];
    const tailNode = nodesMap.get(tailId);

    // Step 2: 创建新节点
    const newNodeId = nextId++;
    const newNode = { id: newNodeId, value: value, nextId: null };
    nodesMap.set(newNodeId, newNode);
    addLog(`步骤2/4: 创建新节点 [${value}]`, 'step');
    render({ newId: newNodeId, visitedId: tailId });
    await sleep(getDelay());

    // Step 3: 设置尾节点.next = 新节点
    addLog(`步骤3/4: 设置尾节点 [${tailNode.value}].next = 新节点 [${value}]`, 'step');
    tailNode.nextId = newNodeId;
    render({ newId: newNodeId, modifiedIds: [tailId], highlightArrow: [tailId, newNodeId] });
    await sleep(getDelay());

    // Step 4: 完成
    addLog(`步骤4/4: 尾插法完成！新节点 [${value}] 已追加到链表尾部。`, 'step');
    render({});
    await sleep(getDelay() * 0.5);
    addLog(`尾插法完成！`, 'ok');
  }

  inputVal.value = Math.floor(Math.random() * 90) + 10;
  isAnimating = false;
  setButtonsEnabled(true);
}

// --- Insert at Position (按位置插入) ---
async function doPosInsert() {
  if (isAnimating) return;
  isAnimating = true;
  setButtonsEnabled(false);

  const inputVal = document.getElementById('input-value');
  const inputPos = document.getElementById('input-pos');
  const value = parseInt(inputVal.value) || 99;
  const pos = parseInt(inputPos.value) || 1;

  addLog(`按位置插入: 在位置 ${pos} 插入值 ${value}`, 'step');

  const order = getOrderedIds();
  if (pos < 1 || pos > order.length + 1) {
    addLog(`错误: 位置 ${pos} 无效！有效范围: 1~${order.length + 1}`, 'error');
    isAnimating = false;
    setButtonsEnabled(true);
    return;
  }

  if (pos === 1) {
    // Delegate to head insert
    isAnimating = false;
    setButtonsEnabled(true);
    await doHeadInsert();
    return;
  }

  // Traverse to position-1
  addLog(`步骤1/4: 遍历到位置 ${pos - 1}...`, 'step');
  for (let i = 0; i < pos - 2; i++) {
    const nodeId = order[i];
    const node = nodesMap.get(nodeId);
    addLog(`  访问节点: [${node.value}]`, 'visit');
    render({ visitedId: nodeId });
    await sleep(getDelay() * 0.5);
  }

  const prevId = order[pos - 2];
  const prevNode = nodesMap.get(prevId);
  const oldNextId = prevNode.nextId;
  addLog(`  定位到前驱节点: [${prevNode.value}]`, 'visit');
  render({ visitedId: prevId });
  await sleep(getDelay() * 0.6);

  // Create new node
  const newNodeId = nextId++;
  const newNode = { id: newNodeId, value: value, nextId: oldNextId };
  nodesMap.set(newNodeId, newNode);
  addLog(`步骤2/4: 创建新节点 [${value}]`, 'step');
  render({ newId: newNodeId, visitedId: prevId });
  await sleep(getDelay());

  // Set new node's next = old next
  addLog(`步骤3/4: 设置新节点.next 指向原后继节点`, 'step');
  render({ newId: newNodeId, highlightArrow: [newNodeId, oldNextId], modifiedIds: [newNodeId] });
  await sleep(getDelay());

  // Update prev.next = new node
  prevNode.nextId = newNodeId;
  addLog(`步骤4/4: 设置前驱 [${prevNode.value}].next = 新节点 [${value}]`, 'step');
  render({ modifiedIds: [prevId], highlightArrow: [prevId, newNodeId] });
  await sleep(getDelay());

  render({});
  await sleep(getDelay() * 0.4);
  addLog(`按位置插入完成！新节点 [${value}] 已插入到位置 ${pos}。`, 'ok');

  inputVal.value = Math.floor(Math.random() * 90) + 10;
  inputPos.value = Math.min(pos + 1, order.length + 2);
  isAnimating = false;
  setButtonsEnabled(true);
}

// --- Delete Head (头删) ---
async function doHeadDelete() {
  if (isAnimating) return;
  isAnimating = true;
  setButtonsEnabled(false);

  if (headId === null) {
    addLog('错误: 链表为空，无法删除！', 'error');
    isAnimating = false;
    setButtonsEnabled(true);
    return;
  }

  const targetNode = nodesMap.get(headId);
  addLog(`头删: 准备删除首节点 [${targetNode.value}]`, 'step');

  // Step 1: 定位目标节点
  addLog('步骤1/3: 定位要删除的首节点', 'step');
  render({ deleteId: headId });
  await sleep(getDelay());

  // Step 2: 保存目标节点，更新head
  const newHeadId = targetNode.nextId;
  addLog(`步骤2/3: 保存目标节点，更新head = head.next`, 'step');
  render({ deleteId: headId, modifiedIds: [] });
  await sleep(getDelay() * 0.6);

  // Step 3: 释放节点
  addLog(`步骤3/3: 释放节点 [${targetNode.value}]`, 'step');
  nodesMap.delete(headId);
  headId = newHeadId;
  render({});
  await sleep(getDelay() * 0.5);

  addLog(`头删完成！节点 [${targetNode.value}] 已删除。`, 'ok');
  isAnimating = false;
  setButtonsEnabled(true);
}

// --- Delete Tail (尾删) ---
async function doTailDelete() {
  if (isAnimating) return;
  isAnimating = true;
  setButtonsEnabled(false);

  if (headId === null) {
    addLog('错误: 链表为空，无法删除！', 'error');
    isAnimating = false;
    setButtonsEnabled(true);
    return;
  }

  const order = getOrderedIds();
  if (order.length === 1) {
    // Only one node: equivalent to head delete
    isAnimating = false;
    setButtonsEnabled(true);
    await doHeadDelete();
    return;
  }

  addLog('尾删: 准备删除尾节点', 'step');

  // Step 1: 遍历到倒数第二个节点
  addLog('步骤1/3: 遍历链表，寻找倒数第二个节点...', 'step');
  for (let i = 0; i < order.length - 2; i++) {
    const nodeId = order[i];
    const node = nodesMap.get(nodeId);
    addLog(`  访问节点: [${node.value}]`, 'visit');
    render({ visitedId: nodeId });
    await sleep(getDelay() * 0.5);
  }

  const secondLastId = order[order.length - 2];
  const secondLastNode = nodesMap.get(secondLastId);
  const tailId = order[order.length - 1];
  const tailNode = nodesMap.get(tailId);
  addLog(`  定位到倒数第二个节点: [${secondLastNode.value}]`, 'visit');
  render({ visitedId: secondLastId, deleteId: tailId });
  await sleep(getDelay() * 0.5);

  // Step 2: 设置secondLast.next = null
  addLog(`步骤2/3: 设置倒数第二个节点 [${secondLastNode.value}].next = null`, 'step');
  secondLastNode.nextId = null;
  render({ deleteId: tailId, modifiedIds: [secondLastId] });
  await sleep(getDelay());

  // Step 3: 释放尾节点
  addLog(`步骤3/3: 释放尾节点 [${tailNode.value}]`, 'step');
  nodesMap.delete(tailId);
  render({});
  await sleep(getDelay() * 0.5);

  addLog(`尾删完成！节点 [${tailNode.value}] 已删除。`, 'ok');
  isAnimating = false;
  setButtonsEnabled(true);
}

// --- Delete at Position (按位置删除) ---
async function doPosDelete() {
  if (isAnimating) return;
  isAnimating = true;
  setButtonsEnabled(false);

  const inputPos = document.getElementById('input-pos');
  const pos = parseInt(inputPos.value) || 1;

  addLog(`按位置删除: 删除位置 ${pos}`, 'step');

  const order = getOrderedIds();
  if (order.length === 0) {
    addLog('错误: 链表为空，无法删除！', 'error');
    isAnimating = false;
    setButtonsEnabled(true);
    return;
  }
  if (pos < 1 || pos > order.length) {
    addLog(`错误: 位置 ${pos} 无效！有效范围: 1~${order.length}`, 'error');
    isAnimating = false;
    setButtonsEnabled(true);
    return;
  }

  if (pos === 1) {
    isAnimating = false;
    setButtonsEnabled(true);
    await doHeadDelete();
    return;
  }

  // Traverse to position-1
  addLog(`步骤1/4: 遍历到位置 ${pos - 1}...`, 'step');
  for (let i = 0; i < pos - 2; i++) {
    const nodeId = order[i];
    const node = nodesMap.get(nodeId);
    addLog(`  访问节点: [${node.value}]`, 'visit');
    render({ visitedId: nodeId });
    await sleep(getDelay() * 0.5);
  }

  const prevId = order[pos - 2];
  const targetId = order[pos - 1];
  const prevNode = nodesMap.get(prevId);
  const targetNode = nodesMap.get(targetId);
  const skipToId = targetNode.nextId;

  addLog(`  定位到前驱节点: [${prevNode.value}]`, 'visit');
  render({ visitedId: prevId, deleteId: targetId });
  await sleep(getDelay() * 0.6);

  // Step 2: 保存目标节点信息
  addLog(`步骤2/4: 定位目标节点 [${targetNode.value}]，准备删除`, 'step');
  render({ deleteId: targetId, modifiedIds: [prevId] });
  await sleep(getDelay());

  // Step 3: 更新前驱.next 跳过目标
  addLog(`步骤3/4: 设置前驱 [${prevNode.value}].next 跳过目标节点`, 'step');
  prevNode.nextId = skipToId;
  render({ deleteId: targetId, modifiedIds: [prevId] });
  await sleep(getDelay());

  // Step 4: 释放
  addLog(`步骤4/4: 释放节点 [${targetNode.value}]`, 'step');
  nodesMap.delete(targetId);
  render({});
  await sleep(getDelay() * 0.4);

  addLog(`按位置删除完成！节点 [${targetNode.value}] 已从位置 ${pos} 删除。`, 'ok');
  isAnimating = false;
  setButtonsEnabled(true);
}

// --- Search (查找) ---
async function doSearch() {
  if (isAnimating) return;
  isAnimating = true;
  setButtonsEnabled(false);

  const inputVal = document.getElementById('input-value');
  const target = parseInt(inputVal.value) || 99;

  addLog(`查找: 搜索值 ${target}`, 'step');

  const order = getOrderedIds();
  if (order.length === 0) {
    addLog('链表为空，查找失败！', 'error');
    isAnimating = false;
    setButtonsEnabled(true);
    return;
  }

  addLog('步骤1: 从头节点开始遍历...', 'step');
  let found = false;
  let foundId = null;

  for (let i = 0; i < order.length; i++) {
    const nodeId = order[i];
    const node = nodesMap.get(nodeId);
    addLog(`  访问节点 [${node.value}] (位置 ${i + 1})`, 'visit');
    render({ visitedId: nodeId });
    await sleep(getDelay() * 0.7);

    if (node.value === target) {
      found = true;
      foundId = nodeId;
      break;
    }
  }

  if (found) {
    const foundNode = nodesMap.get(foundId);
    const pos = order.indexOf(foundId) + 1;
    addLog(`查找成功！值 ${target} 位于位置 ${pos}，节点 [${foundNode.value}]`, 'ok');
    render({ foundId: foundId });
    await sleep(getDelay() * 1.2);
    render({});
    await sleep(getDelay() * 0.4);
  } else {
    addLog(`查找失败！值 ${target} 不在链表中。`, 'error');
    await sleep(getDelay() * 0.8);
    render({});
    await sleep(getDelay() * 0.3);
  }

  isAnimating = false;
  setButtonsEnabled(true);
}
