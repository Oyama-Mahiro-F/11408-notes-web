<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冒泡排序演示</title>
<!-- Tailwind CSS CDN，唯一外部依赖 -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- ==================== 自定义 CSS 样式与动画 ==================== -->
<style>
/* ---------- 页面基础 ---------- */
body { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }

/* ---------- 数组盒子基础样式 ---------- */
.array-box {
  width: 3.5rem;
  height: 3.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0.5rem;
  font-weight: 700;
  font-size: 1.05rem;
  border: 2px solid #d1d5db;
  background: #ffffff;
  color: #1f2937;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
              background-color 0.3s ease,
              border-color 0.3s ease,
              box-shadow 0.3s ease;
  position: relative;
  user-select: none;
  flex-shrink: 0;
}

/* 已排序元素 */
.array-box.sorted {
  background: #dcfce7;
  border-color: #86efac;
  color: #166534;
}

/* 正在比较的元素 (蓝色高亮) */
.array-box.comparing {
  background: #dbeafe;
  border-color: #60a5fa;
  color: #1e40af;
  box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.4);
  transform: scale(1.08);
  z-index: 10;
}

/* 不需交换时的绿色闪烁 */
.array-box.no-swap-flash {
  background: #dcfce7 !important;
  border-color: #22c55e !important;
  color: #166534 !important;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.4);
}

/* ---------- 交换动画：向右滑动 ---------- */
/* 交换中高亮（黄色背景，不带动画） */
.array-box.swapping {
  background: #fef9c3 !important;
  border-color: #facc15 !important;
  color: #854d0e !important;
  box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.5);
  z-index: 20;
}

/* ---------- 交换动画：向右滑动 ---------- */
.array-box.swap-right {
  animation: swapSlideRight 0.42s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  background: #fef9c3 !important;
  border-color: #facc15 !important;
  color: #854d0e !important;
  box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.5);
  z-index: 20;
}

/* ---------- 交换动画：向左滑动 ---------- */
.array-box.swap-left {
  animation: swapSlideLeft 0.42s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  background: #fef9c3 !important;
  border-color: #facc15 !important;
  color: #854d0e !important;
  box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.5);
  z-index: 20;
}

@keyframes swapSlideRight {
  0%   { transform: translateX(0) scale(1); }
  40%  { transform: translateX(calc(50% + 0.125rem)) scale(1.06); }
  100% { transform: translateX(calc(100% + 0.5rem)) scale(1); }
}

@keyframes swapSlideLeft {
  0%   { transform: translateX(0) scale(1); }
  40%  { transform: translateX(calc(-50% - 0.125rem)) scale(1.06); }
  100% { transform: translateX(calc(-100% - 0.5rem)) scale(1); }
}

/* ---------- 淡入动画 ---------- */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in {
  animation: fadeIn 0.35s ease forwards;
}

/* ---------- 脉冲动画 (新排序元素就位时) ---------- */
@keyframes pulseGreen {
  0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
  70%  { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.pulse-sorted {
  animation: pulseGreen 0.7s ease;
}

/* ---------- 已排序边界分隔线 ---------- */
.boundary-line {
  width: 0;
  border-left: 3px dashed #f97316;
  margin: 0 0.375rem;
  align-self: stretch;
  opacity: 0.85;
  transition: opacity 0.3s ease;
}

/* ---------- 日志条目 ---------- */
.log-entry {
  padding: 0.35rem 0.5rem;
  border-bottom: 1px solid #f3f4f6;
  font-size: 0.8rem;
  line-height: 1.4;
  animation: fadeIn 0.3s ease;
}
.log-entry:last-child { border-bottom: none; }

/* 滚动条美化 */
.log-sidebar::-webkit-scrollbar { width: 5px; }
.log-sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
.log-sidebar::-webkit-scrollbar-track { background: #f9fafb; }

/* ---------- 状态徽章 ---------- */
.state-badge {
  transition: all 0.3s ease;
}

/* 交换标志变量高亮 */
.flag-yes { color: #dc2626; font-weight: 700; }
.flag-no  { color: #16a34a; font-weight: 700; }

/* ---------- 按钮禁用态 ---------- */
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

<!-- ==================== 顶部控制栏 ==================== -->
<header class="bg-white shadow-md sticky top-0 z-30 px-5 py-3">
  <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-3">

    <!-- 标题 -->
    <h1 class="text-xl font-extrabold text-gray-800 tracking-wide whitespace-nowrap mr-3">
      <span class="text-blue-600">&#9608;</span> 冒泡排序演示
    </h1>

    <!-- 逗号分隔输入框 -->
    <input
      id="input-data"
      type="text"
      value="49,38,65,97,76,13,27,49"
      class="flex-1 min-w-[200px] max-w-md px-3 py-2 border border-gray-300 rounded-lg text-sm
             focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400
             transition-shadow font-mono"
      placeholder="输入逗号分隔的数字，例如：49,38,65,97,76,13,27,49"
    />

    <!-- 初始化 / 重置 -->
    <button id="btn-reset"
      class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white text-sm font-semibold
             rounded-lg transition-colors shadow-sm whitespace-nowrap">
      &#x21BB; 初始化/重置
    </button>

    <!-- 单步执行 -->
    <button id="btn-step"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold
             rounded-lg transition-colors shadow-sm whitespace-nowrap">
      &#x25B6; 单步执行
    </button>

    <!-- 自动播放 / 暂停 -->
    <button id="btn-auto"
      class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold
             rounded-lg transition-colors shadow-sm whitespace-nowrap">
      &#x25B6;&#x25B6; 自动播放
    </button>

    <!-- 速度调节 -->
    <label class="flex items-center gap-1 text-sm text-gray-600 whitespace-nowrap ml-1">
      速度:
      <select id="speed-select"
        class="px-2 py-1.5 border border-gray-300 rounded text-sm bg-white
               focus:outline-none focus:ring-2 focus:ring-blue-300">
        <option value="300">快速 (300ms)</option>
        <option value="600" selected>正常 (600ms)</option>
        <option value="1000">慢速 (1000ms)</option>
        <option value="1500">极慢 (1500ms)</option>
      </select>
    </label>
  </div>
</header>

<!-- ==================== 主体区域：可视化 + 日志侧边栏 ==================== -->
<main class="flex flex-1 overflow-hidden">

  <!-- 左侧：可视化区域 -->
  <section class="flex-1 flex flex-col items-center justify-center p-6 min-w-0">

    <!-- 趟数 & 交换标志信息 -->
    <div class="mb-5 text-center space-y-1">
      <div id="pass-label" class="text-2xl font-black text-gray-700 tracking-wide">
        第 <span id="pass-number" class="text-blue-600">-</span> 趟
      </div>
      <div id="swap-flag-display" class="text-base font-semibold">
        本趟是否发生交换: <span id="swap-flag-text" class="flag-no">-</span>
      </div>
      <!-- 提前终止消息 -->
      <div id="early-stop-msg"
        class="text-base font-bold text-red-500 mt-1 hidden opacity-0 transition-opacity duration-500">
        &#9888; 本趟未发生交换，排序提前结束！
      </div>
    </div>

    <!-- 数组盒子容器 -->
    <div id="array-wrapper" class="flex items-center justify-center flex-wrap gap-2 mb-4">
      <!-- 冒泡排序盒子由 JS 动态生成 -->
    </div>

    <!-- 图例 -->
    <div id="legend" class="flex flex-wrap items-center justify-center gap-4 mt-4 text-xs text-gray-600">
      <span class="flex items-center gap-1">
        <span class="inline-block w-4 h-4 rounded bg-blue-100 border border-blue-400"></span> 正在比较
      </span>
      <span class="flex items-center gap-1">
        <span class="inline-block w-4 h-4 rounded bg-yellow-100 border border-yellow-400"></span> 交换中
      </span>
      <span class="flex items-center gap-1">
        <span class="inline-block w-4 h-4 rounded bg-green-200 border border-green-500"></span> 不需交换(✓)
      </span>
      <span class="flex items-center gap-1">
        <span class="inline-block w-4 h-4 rounded bg-green-100 border border-green-400"></span> 已排序
      </span>
      <span class="flex items-center gap-1">
        <span class="inline-block w-0 h-5 border-l-2 border-dashed border-orange-400"></span> 排序边界
      </span>
    </div>

    <!-- 排序完成消息 -->
    <div id="done-msg"
      class="mt-4 text-lg font-extrabold text-green-600 hidden opacity-0 transition-opacity duration-500">
      &#10003; 排序完成！
    </div>
  </section>

  <!-- 右侧：日志侧边栏 (w-80) -->
  <aside class="w-80 flex-shrink-0 border-l border-gray-200 bg-white flex flex-col log-sidebar overflow-hidden">
    <!-- 日志头部 -->
    <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
      <h2 class="text-base font-bold text-gray-700">&#x1F4C4; 执行日志</h2>
      <span id="status-badge"
        class="state-badge px-2.5 py-0.5 rounded-full text-xs font-semibold
               bg-gray-100 text-gray-600 border border-gray-300">
        就绪
      </span>
    </div>
    <!-- 日志内容区（可滚动） -->
    <div id="log-container" class="flex-1 overflow-y-auto px-2 py-2 bg-gray-50">
      <p class="text-xs text-gray-400 text-center py-8">点击"单步执行"或"自动播放"开始排序...</p>
    </div>
  </aside>
</main>

<!-- ==================== JavaScript 排序引擎 ==================== -->
<script>
(function () {
  "use strict";

  // ======================== 状态机定义 ========================
  const STATE = Object.freeze({
    IDLE:          "IDLE",           // 空闲，等待用户操作
    COMPARING:     "COMPARING",      // 正在比较一对相邻元素
    SWAPPING:      "SWAPPING",       // 正在执行交换动画
    PASS_COMPLETE: "PASS_COMPLETE",  // 一趟完成，处理排序边界
    DONE:          "DONE"            // 排序彻底结束
  });

  // ======================== 全局排序状态 ========================
  let data        = [49, 38, 65, 97, 76, 13, 27, 49]; // 数组数据
  let currentState = STATE.IDLE;          // 当前状态机状态
  let currentPass  = 0;                   // 当前趟数 (从 1 开始)
  let j            = 0;                   // 当前比较下标 R[j] 与 R[j+1]
  let swapFlag     = false;               // 本趟是否发生了交换（408 考纲核心标志）
  let sortedFrom   = Infinity;            // 从该下标开始是已排序区 [sortedFrom, n)
  let locked       = false;               // 动画锁：true 时禁止 step() 响应
  let autoTimer    = null;                // 自动播放定时器句柄
  let flashTimer   = null;                // 绿色闪烁清除定时器
  let flashSet     = new Set();           // 当前绿色闪烁的索引集合
  let comparingSet = new Set();           // 当前蓝色比较高亮的索引集合
  let swapSet      = new Set();           // 当前黄色交换的索引集合
  let generation   = 0;                   // 复位代数，用于防止过期动画回调篡改状态

  // ======================== DOM 元素缓存 ========================
  const $ = (id) => document.getElementById(id);
  const arrayWrapper  = $("array-wrapper");
  const passNumber    = $("pass-number");
  const swapFlagText  = $("swap-flag-text");
  const earlyStopMsg  = $("early-stop-msg");
  const doneMsg       = $("done-msg");
  const statusBadge   = $("status-badge");
  const logContainer  = $("log-container");
  const btnReset      = $("btn-reset");
  const btnStep       = $("btn-step");
  const btnAuto       = $("btn-auto");
  const inputData     = $("input-data");
  const speedSelect   = $("speed-select");
  const passLabel     = $("pass-label");

  // ======================== 工具函数 ========================

  /** 返回当前趟未排序区的右边界（不含），即本趟需要比较到的最后一个下标 + 1 */
  function unsortedEnd() {
    // 第 currentPass 趟时，最后 currentPass 个元素已在正确位置
    // 需要比较 j 从 0 到 data.length - currentPass - 2 (与 j+1 比较)
    return data.length - currentPass;
  }

  /** 更新状态徽章 */
  function updateStatusBadge(state) {
    const map = {
      [STATE.IDLE]:          { text: "就绪",   cls: "bg-gray-100 text-gray-600 border-gray-300" },
      [STATE.COMPARING]:     { text: "比较中", cls: "bg-blue-100  text-blue-700  border-blue-300"  },
      [STATE.SWAPPING]:      { text: "交换中", cls: "bg-yellow-100 text-yellow-700 border-yellow-300" },
      [STATE.PASS_COMPLETE]: { text: "趟完成", cls: "bg-purple-100 text-purple-700 border-purple-300" },
      [STATE.DONE]:          { text: "已完成", cls: "bg-green-100 text-green-700 border-green-300" }
    };
    const m = map[state] || map[STATE.IDLE];
    statusBadge.textContent = m.text;
    statusBadge.className   = "state-badge px-2.5 py-0.5 rounded-full text-xs font-semibold " + m.cls;
  }

  /**
   * 向日志区域追加一条带颜色的条目。
   * @param {string} msg    日志文本
   * @param {string} color  Tailwind 文本颜色类名，如 "text-blue-700"
   * @param {string} weight 字体粗细，如 "font-bold"
   */
  function addLog(msg, color = "text-gray-700", weight = "") {
    // 清空初始提示（如果有）
    const placeholder = logContainer.querySelector(".text-gray-400");
    if (placeholder) placeholder.remove();

    const div = document.createElement("div");
    div.className = `log-entry ${color} ${weight}`;
    div.innerHTML = msg;
    // 新日志总是插到最上面
    logContainer.insertBefore(div, logContainer.firstChild);
  }

  // ======================== 核心渲染函数 ========================

  /**
   * 根据当前 data、sortedFrom、高亮集合，完全重新绘制数组盒子。
   * 这是渲染的唯一入口，保证视图与状态严格一致。
   */
  function render() {
    arrayWrapper.innerHTML = "";

    // 对每个元素创建盒子
    data.forEach((val, idx) => {
      // ---- 基础样式 ----
      let cls = "array-box fade-in";

      // ---- 颜色与状态样式（优先级从低到高） ----
      if (idx >= sortedFrom) {
        // 已排序区（绿色）
        cls += " sorted";
      }
      if (comparingSet.has(idx)) {
        // 正在比较（蓝色，会覆盖 sorted 样式）
        cls += " comparing";
      }
      if (swapSet.has(idx)) {
        // 正在交换（黄色背景），动画类在 handleComparing 中单独添加
        cls += " swapping";
      }
      if (flashSet.has(idx)) {
        // 不需交换的绿色闪烁
        cls += " no-swap-flash";
      }

      // ---- 边界分隔线 ----
      // 在本趟最后一个未排序元素与第一个已排序元素之间插入分隔线
      if (idx === sortedFrom - 1 && sortedFrom < data.length && !comparingSet.has(idx) && !swapSet.has(idx)) {
        // 在盒子后面插入一个边界标记
      }

      // 构建 DOM
      const box = document.createElement("div");
      box.className = cls;
      box.id = `box-${idx}`;
      box.textContent = val;
      arrayWrapper.appendChild(box);

      // 在排序边界处插入分隔线
      if (idx === sortedFrom - 1 && sortedFrom < data.length) {
        const boundary = document.createElement("div");
        boundary.className = "boundary-line";
        boundary.id = "boundary";
        arrayWrapper.appendChild(boundary);
      }
    });

    // 更新趟数显示
    if (currentState === STATE.DONE) {
      passNumber.textContent = currentPass;
      passNumber.className = "text-green-600";
    } else if (currentState === STATE.IDLE) {
      passNumber.textContent = "-";
      passNumber.className = "text-blue-600";
    } else {
      passNumber.textContent = currentPass;
      passNumber.className = "text-blue-600";
    }

    // 更新交换标志显示
    if (currentState === STATE.IDLE) {
      swapFlagText.textContent = "-";
      swapFlagText.className = "flag-no";
    } else {
      swapFlagText.textContent = swapFlag ? "是" : "否";
      swapFlagText.className = swapFlag ? "flag-yes" : "flag-no";
    }

    // 更新提前终止消息
    if (currentState === STATE.DONE && !swapFlag && sortedFrom > 0) {
      earlyStopMsg.classList.remove("hidden");
      earlyStopMsg.classList.add("opacity-100");
    } else if (currentState === STATE.IDLE) {
      earlyStopMsg.classList.add("hidden", "opacity-0");
    }

    // 更新排序完成消息
    if (currentState === STATE.DONE) {
      doneMsg.classList.remove("hidden");
      doneMsg.classList.add("opacity-100");
    } else {
      doneMsg.classList.add("hidden", "opacity-0");
    }

    // 更新按钮状态
    btnReset.disabled = locked;
    btnStep.disabled  = locked || currentState === STATE.DONE;
    btnAuto.disabled  = currentState === STATE.DONE;

    // 更新状态徽章
    updateStatusBadge(currentState);
  }

  // ======================== 高亮集合的辅助函数 ========================

  /** 清除所有高亮 */
  function clearHighlights() {
    comparingSet.clear();
    swapSet.clear();
    // flashSet 由定时器管理，不在此清除
  }

  /** 设置蓝色比较高亮 */
  function setComparing(a, b) {
    clearHighlights();
    comparingSet.add(a);
    comparingSet.add(b);
  }

  /** 设置黄色交换高亮 */
  function setSwapping(a, b) {
    clearHighlights();
    swapSet.add(a);
    swapSet.add(b);
  }

  // ======================== 步骤执行核心 ========================

  /**
   * 处理 COMPARING 状态：对比 R[j] 和 R[j+1]，
   * 决定进入 SWAPPING（需交换）还是继续比较下一个。
   */
  function handleComparing() {
    // 清除上一次可能残留的绿色闪烁
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
    flashSet.clear();

    const end = unsortedEnd(); // 本趟待比较区间的右边界

    // 边界检查：如果 j+1 已经越界，本趟结束
    if (j + 1 >= end) {
      currentState = STATE.PASS_COMPLETE;
      render();
      return;
    }

    // 设置蓝色比较高亮
    setComparing(j, j + 1);
    render();

    // 添加比较日志
    const aVal = data[j];
    const bVal = data[j + 1];
    addLog(
      `比较 R[<b>${j}</b>]=<b>${aVal}</b> 和 R[<b>${j + 1}</b>]=<b>${bVal}</b>`,
      "text-gray-700"
    );

    if (aVal > bVal) {
      // ---- 需要交换 ----
      swapFlag = true;
      currentState = STATE.SWAPPING;
      locked = true;

      addLog(
        `<span class="text-red-600">&#x21C4; ${aVal} &gt; ${bVal}，需要交换</span>`,
        "text-red-600"
      );

      // 清除蓝色高亮，设置黄色交换高亮
      clearHighlights();
      setSwapping(j, j + 1);
      render();

      // 给盒子施加交换动画类（在 render 之后操作现有 DOM）
      const boxA = document.getElementById(`box-${j}`);
      const boxB = document.getElementById(`box-${j + 1}`);
      if (boxA) boxA.classList.add("swap-right");
      if (boxB) boxB.classList.add("swap-left");

      // 动画结束后真正交换数据
      const capturedGen = generation; // 捕获当前代数，防止复位后过期回调执行
      setTimeout(() => {
        // 如果期间调用了 reset()，代数已变，直接丢弃过期回调
        if (capturedGen !== generation || currentState !== STATE.SWAPPING) return;

        // 执行数据交换
        [data[j], data[j + 1]] = [data[j + 1], data[j]];

        // 移除动画类（render 会重建 DOM，但以防万一先清理）
        if (boxA) boxA.classList.remove("swap-right");
        if (boxB) boxB.classList.remove("swap-left");

        // 指针前进
        j++;

        // 判断本趟是否完成
        if (j + 1 >= end) {
          currentState = STATE.PASS_COMPLETE;
          sortedFrom = data.length - currentPass; // 提前显示排序边界
        } else {
          currentState = STATE.COMPARING;
        }

        // 释放锁、清除高亮、重新渲染
        locked = false;
        clearHighlights();
        render();
      }, 420); // 与 CSS 动画时长一致
    } else {
      // ---- 不需要交换：显示绿色闪烁 ----
      clearHighlights();
      flashSet.add(j);
      flashSet.add(j + 1);
      render();

      addLog(
        `<span class="text-green-600">&#x2713; ${aVal} &le; ${bVal}，不交换</span>`,
        "text-green-600"
      );

      // 短暂显示绿色后清除
      if (flashTimer) clearTimeout(flashTimer);
      flashTimer = setTimeout(() => {
        flashSet.clear();
        render();
      }, 450);

      // 指针前进
      j++;

      // 判断本趟是否完成
      if (j + 1 >= end) {
        currentState = STATE.PASS_COMPLETE;
        sortedFrom = data.length - currentPass; // 提前显示排序边界
      }
      // 否则保持 COMPARING 状态

      clearHighlights(); // 清除比较高亮（但保留 flashSet 到定时器触发）
      render();
    }
  }

  /**
   * 处理 PASS_COMPLETE 状态：标记已排序元素，检查是否提前终止。
   */
  function handlePassComplete() {
    // 计算本次排序完成的元素位置：第 currentPass 趟后，末尾第 currentPass 个元素就位
    sortedFrom = data.length - currentPass;

    // 趟结束日志
    if (swapFlag) {
      addLog(
        `<b>--- 第 ${currentPass} 趟结束，</b>` +
        `<span class="text-green-700">元素 <b>${data[sortedFrom]}</b> 已就位 (位置 R[${sortedFrom}])</span>` +
        `<b>，本趟发生了交换 ---</b>`,
        "text-blue-700", "font-semibold"
      );
    } else {
      addLog(
        `<b>--- 第 ${currentPass} 趟结束，本趟未发生任何交换 ---</b>`,
        "text-orange-600", "font-semibold"
      );
    }

    // 判断排序是否结束
    if (!swapFlag) {
      // 本趟无交换 => 提前终止（408 考纲关键考点）
      // 剩余所有元素也都已有序
      sortedFrom = 0;
      currentState = STATE.DONE;

      addLog(
        `<b class="text-red-600">&#9888; 本趟未发生交换，排序提前结束！</b>`,
        "text-red-700", "font-bold"
      );

      stopAutoPlay();
      clearHighlights();
      render();
      return;
    }

    // 检查是否所有趟都已完成
    if (currentPass >= data.length - 1) {
      sortedFrom = 0;
      currentState = STATE.DONE;

      addLog(
        `<b class="text-green-600">&#127881; 所有趟次完成，排序结束！共 ${currentPass} 趟。</b>`,
        "text-green-700", "font-bold"
      );

      stopAutoPlay();
      clearHighlights();
      render();
      return;
    }

    // 否则，进入下一趟
    currentPass++;
    j = 0;
    swapFlag = false;

    addLog(
      `<b>&#9654; 开始第 ${currentPass} 趟排序</b>` +
      `<span class="text-gray-500">（比较范围：R[0] ~ R[${data.length - currentPass - 1}]）</span>`,
      "text-indigo-700", "font-semibold"
    );

    currentState = STATE.COMPARING;
    clearHighlights();
    render();
  }

  /**
   * step() —— 状态机驱动的单步执行入口。
   * 根据当前状态执行一个原子操作（一次比较、一次交换动画、或一趟完成处理）。
   * 如果已加锁（动画进行中）或排序已结束，则忽略调用。
   */
  function step() {
    if (locked) return;                          // 动画进行中，忽略
    if (currentState === STATE.DONE) return;     // 排序已完成
    if (currentState === STATE.IDLE) return;     // 未初始化

    switch (currentState) {
      case STATE.COMPARING:
        handleComparing();
        break;
      case STATE.SWAPPING:
        // SWAPPING 状态的完成由 handleComparing 中的 setTimeout 处理，
        // 正常情况下 step() 不会在 SWAPPING 时被调用（因为有锁）
        // 但如果锁因某种原因未设置，这里做防御性处理
        break;
      case STATE.PASS_COMPLETE:
        handlePassComplete();
        break;
      default:
        break;
    }
  }

  // ======================== 初始化 / 重置 ========================

  /**
   * 重置排序状态到初始值，并重新读取用户输入。
   */
  function reset() {
    // 停止自动播放
    stopAutoPlay();

    // 递增复位代数，使所有在执行中的动画回调失效
    generation++;

    // 清除定时器
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }

    // 读取用户输入
    const raw = inputData.value.trim();
    if (raw) {
      const parsed = raw.split(/[,，\s]+/).map(s => {
        const n = Number(s.trim());
        return isNaN(n) ? null : n;
      }).filter(v => v !== null);
      if (parsed.length >= 2) {
        data = parsed;
      }
      // 如果解析失败，保持现有 data 不变
    }

    // 重置所有状态变量
    currentState = STATE.IDLE;
    currentPass  = 0;
    j            = 0;
    swapFlag     = false;
    sortedFrom   = data.length; // 初始全部未排序
    locked       = false;

    // 清除所有高亮
    clearHighlights();
    flashSet.clear();

    // 清空日志
    logContainer.innerHTML = "";
    const placeholder = document.createElement("p");
    placeholder.className = "text-xs text-gray-400 text-center py-8";
    placeholder.textContent = '点击“单步执行”或“自动播放”开始排序...';
    logContainer.appendChild(placeholder);

    // 重置提前终止 & 完成消息
    earlyStopMsg.classList.add("hidden", "opacity-0");
    doneMsg.classList.add("hidden", "opacity-0");

    // 更新按钮状态
    btnReset.disabled = false;
    btnStep.disabled  = false;
    btnAuto.disabled  = false;

    // 渲染
    render();
  }

  /**
   * 首次启动排序：从 IDLE 进入第 1 趟 COMPARING。
   */
  function startSorting() {
    if (currentState !== STATE.IDLE) return; // 已启动

    // 如果当前数据有误，先重置
    if (data.length < 2) {
      reset();
      return;
    }

    currentState = STATE.COMPARING;
    currentPass  = 1;
    j            = 0;
    swapFlag     = false;
    sortedFrom   = data.length;

    clearHighlights();
    flashSet.clear();

    addLog(
      `<b>&#9654; 开始第 1 趟排序</b>` +
      `<span class="text-gray-500">（比较范围：R[0] ~ R[${data.length - 2}]）</span>`,
      "text-indigo-700", "font-semibold"
    );

    render();
  }

  // ======================== 自动播放 ========================

  /** 获取当前选择的速度 (ms) */
  function getSpeed() {
    return parseInt(speedSelect.value, 10) || 600;
  }

  /**
   * 自动播放：使用递归 setTimeout 链，
   * 每一帧执行一个 step()，然后根据当前速度安排下一帧。
   */
  function autoPlayLoop() {
    // 终止条件
    if (currentState === STATE.DONE) {
      stopAutoPlay();
      return;
    }

    // 如果被锁（动画进行中），等一小段时间再重试
    if (locked) {
      autoTimer = setTimeout(autoPlayLoop, 80);
      return;
    }

    // 根据当前状态执行一个操作（else-if 保证每轮只执行一次）
    if (currentState === STATE.IDLE) {
      startSorting();
    } else if (currentState === STATE.PASS_COMPLETE) {
      step();
    } else if (currentState === STATE.COMPARING) {
      step();
    }

    // 安排下一帧
    if (currentState !== STATE.DONE) {
      autoTimer = setTimeout(autoPlayLoop, getSpeed());
    }
  }

  /** 开始自动播放 */
  function startAutoPlay() {
    if (currentState === STATE.DONE) return;

    stopAutoPlay(); // 确保没有残留定时器

    if (currentState === STATE.IDLE) {
      startSorting();
    }

    btnAuto.textContent = "⏸ 暂停";
    btnAuto.classList.remove("bg-emerald-600", "hover:bg-emerald-700");
    btnAuto.classList.add("bg-amber-500", "hover:bg-amber-600");

    // 开始循环
    autoTimer = setTimeout(autoPlayLoop, getSpeed());
  }

  /** 停止自动播放 */
  function stopAutoPlay() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
    }
    btnAuto.textContent = "▶▶ 自动播放";
    btnAuto.classList.remove("bg-amber-500", "hover:bg-amber-600");
    btnAuto.classList.add("bg-emerald-600", "hover:bg-emerald-700");
    btnAuto.disabled = false;
  }

  /** 切换自动播放 / 暂停 */
  function toggleAutoPlay() {
    if (autoTimer) {
      stopAutoPlay();
    } else {
      startAutoPlay();
    }
  }

  // ======================== 事件绑定 ========================

  // 初始化 / 重置 按钮
  btnReset.addEventListener("click", reset);

  // 单步执行 按钮
  btnStep.addEventListener("click", () => {
    if (locked) return;
    if (currentState === STATE.DONE) return;

    if (currentState === STATE.IDLE) {
      startSorting();
      return;
    }

    if (currentState === STATE.PASS_COMPLETE) {
      step(); // handlePassComplete
      return;
    }

    step(); // handleComparing
  });

  // 自动播放 按钮
  btnAuto.addEventListener("click", toggleAutoPlay);

  // 速度选择器变更时，如果正在自动播放则重启以应用新速度
  speedSelect.addEventListener("change", () => {
    if (autoTimer) {
      stopAutoPlay();
      startAutoPlay();
    }
  });

  // 回车键快速初始化
  inputData.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      reset();
    }
  });

  // 键盘快捷键：空格键单步执行
  document.addEventListener("keydown", (e) => {
    // 防止在输入框中触发
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (autoTimer) {
        toggleAutoPlay();
      } else {
        btnStep.click();
      }
    }
    if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      reset();
    }
  });

  // ======================== 初始渲染 ========================
  // 页面加载后立即显示初始数组（IDLE 状态）
  reset();

})();
</script>

</body>
</html>
