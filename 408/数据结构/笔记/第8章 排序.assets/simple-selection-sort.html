<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单选择排序演示 - 408考研</title>
  <!-- Tailwind CSS CDN：提供原子化 CSS 工具类，无需额外构建步骤 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ==================== 自定义 CSS 动画 ==================== -->
  <style>
    /* --- 数组盒子基础样式 ---
       每个盒子代表数组中的一个元素，采用居中布局，包含平滑的颜色/边框过渡。
       transition 确保状态切换时视觉上不会突兀。 */
    .array-box {
      width: 4rem;
      height: 5rem;
      border: 2px solid #d1d5db;
      border-radius: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      user-select: none;
      flex-shrink: 0;
    }

    /* --- 盒子内标签样式 --- */
    .box-label {
      font-size: 0.65rem;
      line-height: 1;
      padding: 1px 4px;
      border-radius: 3px;
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .box-index {
      font-size: 0.7rem;
      color: #6b7280;
      font-weight: 400;
      margin-top: 2px;
    }
    .box-status {
      font-size: 0.6rem;
      line-height: 1;
      margin-top: 1px;
      white-space: nowrap;
    }

    /* --- 排序状态颜色定义（与 408 考试彩色标注习惯一致） --- */
    .sorted-box    { background-color: #d1fae5; border-color: #34d399; }  /* 已排序：绿色 */
    .unsorted-box  { background-color: #ffffff; border-color: #d1d5db; }  /* 未排序：白色 */
    .current-min   { background-color: #ffedd5; border-color: #f97316; }  /* 当前最小：橙色 */
    .scanning-pos  { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35); } /* 扫描中：蓝色 */
    .target-pos    { border-style: dashed; border-color: #6366f1; }        /* 待填充位置：紫虚线 */
    .swap-flash    { background-color: #fef08a; border-color: #eab308; }   /* 交换闪烁：黄色 */
    .done-box      { background-color: #bbf7d0; border-color: #22c55e; }   /* 全部完成：亮绿 */

    /* --- 更新最小值时的闪烁关键帧 ---
       当扫描发现更小元素时触发，通过短暂的缩放+颜色变化引起注意。 */
    @keyframes minUpdateFlash {
      0%   { transform: scale(1);   background-color: #fef08a; border-color: #eab308; }
      25%  { transform: scale(1.15); background-color: #fde68a; border-color: #f59e0b; }
      50%  { transform: scale(1);   background-color: #fef08a; border-color: #eab308; }
      75%  { transform: scale(1.08); background-color: #ffedd5; border-color: #f97316; }
      100% { transform: scale(1);   background-color: #ffedd5; border-color: #f97316; }
    }
    .min-update-flash {
      animation: minUpdateFlash 0.5s ease-out;
    }

    /* --- 交换闪烁关键帧 ---
       交换两个元素时的视觉强调，黄色闪烁后恢复。 */
    @keyframes swapBounce {
      0%   { transform: scale(1);   background-color: #ffffff; }
      20%  { transform: scale(1.2); background-color: #fef08a; border-color: #eab308; }
      50%  { transform: scale(1);   background-color: #fef08a; border-color: #eab308; }
      80%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .swap-bounce {
      animation: swapBounce 0.6s ease-out;
    }

    /* --- 扫描脉冲动画 ---
       当前扫描位置的柔和脉冲效果，帮助视线跟踪扫描进程。 */
    @keyframes scanPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
      50%      { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.15); }
    }
    .scan-pulse {
      animation: scanPulse 0.9s ease-in-out infinite;
    }

    /* --- 日志条目淡入动画 --- */
    @keyframes fadeInLog {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .log-entry {
      animation: fadeInLog 0.25s ease-out;
    }

    /* --- 分割线呼吸动画 ---
       排序/未排序边界的分割线带轻微呼吸效果，强调当前趟的边界位置。 */
    @keyframes boundaryPulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }
    .boundary-divider {
      animation: boundaryPulse 1.2s ease-in-out infinite;
    }

    /* --- 日志区域滚动条美化 --- */
    #log-list::-webkit-scrollbar { width: 5px; }
    #log-list::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    #log-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #log-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen font-sans">

  <!-- ==================== 页面容器 ==================== -->
  <div class="max-w-7xl mx-auto px-4 py-6">

    <!-- 标题 -->
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-4 tracking-wide">
      简单选择排序演示
      <span class="text-sm font-normal text-gray-400 ml-2">— 408 考研数据结构</span>
    </h1>

    <!-- ==================== 控制栏 ==================== -->
    <div class="bg-white rounded-lg shadow-md p-4 mb-4 flex flex-wrap items-center gap-3">
      <!-- 数据输入标签 -->
      <label class="text-sm font-medium text-gray-600 whitespace-nowrap">输入数据:</label>
      <!-- 逗号分隔数字输入框，默认使用 408 考研中的经典示例数据 -->
      <input
        id="data-input"
        type="text"
        value="49,38,65,97,76,13,27,49"
        class="flex-1 min-w-[200px] px-3 py-2 border border-gray-300 rounded-md text-sm font-mono
               focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
        placeholder="逗号分隔，如: 49,38,65,97"
      />

      <!-- 初始化/重置按钮：解析输入数据，重置所有状态 -->
      <button id="btn-init"
        class="px-4 py-2 bg-indigo-500 text-white text-sm font-medium rounded-md
               hover:bg-indigo-600 active:bg-indigo-700 transition-colors shadow-sm">
        初始化 / 重置
      </button>

      <!-- 单步执行按钮：每次点击推进状态机一步 -->
      <button id="btn-step"
        class="px-4 py-2 bg-blue-500 text-white text-sm font-medium rounded-md
               hover:bg-blue-600 active:bg-blue-700 transition-colors shadow-sm">
        单步执行
      </button>

      <!-- 自动播放按钮：以 500ms 间隔自动推进，可切换为停止 -->
      <button id="btn-auto"
        class="px-4 py-2 bg-emerald-500 text-white text-sm font-medium rounded-md
               hover:bg-emerald-600 active:bg-emerald-700 transition-colors shadow-sm">
        自动播放
      </button>

      <!-- 速度调节：允许用户在自动播放时调整间隔 -->
      <label class="text-xs text-gray-500 ml-2">
        速度:
        <select id="speed-select" class="ml-1 border border-gray-300 rounded px-1 py-0.5 text-xs">
          <option value="200">200ms (快)</option>
          <option value="500" selected>500ms (中)</option>
          <option value="1000">1000ms (慢)</option>
        </select>
      </label>
    </div>

    <!-- ==================== 主区域：可视化 + 日志侧栏 ==================== -->
    <div class="flex gap-4 flex-col lg:flex-row">

      <!-- ===== 左侧：可视化面板 ===== -->
      <div class="flex-1 bg-white rounded-lg shadow-md p-6 flex flex-col gap-4">

        <!-- 排序状态信息行 —— 显示当前趟数、扫描位置、当前最小等元信息 -->
        <div id="status-panel" class="bg-gray-50 rounded-lg p-4 border border-gray-200">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
            <!-- 第 i 趟 -->
            <div>
              <span class="text-gray-500">当前趟数</span>
              <div id="status-pass" class="font-bold text-indigo-600 text-lg">—</div>
            </div>
            <!-- 待排序位置 -->
            <div>
              <span class="text-gray-500">待排序位置</span>
              <div id="status-target" class="font-bold text-gray-700">—</div>
            </div>
            <!-- 当前扫描位置 -->
            <div>
              <span class="text-gray-500">当前扫描位置</span>
              <div id="status-scan" class="font-bold text-blue-600">—</div>
            </div>
            <!-- 当前最小元素 -->
            <div>
              <span class="text-gray-500">当前最小元素及值</span>
              <div id="status-min" class="font-bold text-orange-500">—</div>
            </div>
          </div>
          <!-- 统计信息 -->
          <div class="mt-3 pt-3 border-t border-gray-200 flex gap-4 text-xs text-gray-500">
            <span>比较次数: <b id="stat-cmp" class="text-gray-700">0</b></span>
            <span>交换次数: <b id="stat-swap" class="text-gray-700">0</b></span>
            <span>状态: <b id="stat-state" class="text-gray-700">就绪</b></span>
          </div>
        </div>

        <!-- 数组可视化区域 —— 居中展示所有元素盒子，内含已排序/未排序分界 -->
        <div class="flex-1 flex items-center justify-center min-h-[180px] bg-gray-50 rounded-lg border border-dashed border-gray-300 p-4">
          <div id="array-display" class="flex flex-wrap items-center justify-center gap-1">
            <!-- JavaScript 动态渲染 -->
          </div>
        </div>

        <!-- 图例 —— 帮助理解颜色含义 -->
        <div class="bg-gray-50 rounded-lg p-3 border border-gray-200">
          <span class="text-xs font-semibold text-gray-500 mr-3">图例:</span>
          <span class="inline-flex items-center gap-1 text-xs mr-3">
            <span class="inline-block w-4 h-4 rounded bg-green-200 border border-green-400"></span> 已排序
          </span>
          <span class="inline-flex items-center gap-1 text-xs mr-3">
            <span class="inline-block w-4 h-4 rounded bg-white border-2 border-gray-300"></span> 未排序
          </span>
          <span class="inline-flex items-center gap-1 text-xs mr-3">
            <span class="inline-block w-4 h-4 rounded bg-orange-100 border-2 border-orange-500"></span> 当前最小
          </span>
          <span class="inline-flex items-center gap-1 text-xs mr-3">
            <span class="inline-block w-4 h-4 rounded bg-white border-2 border-blue-500 shadow-[0_0_0_3px_rgba(59,130,246,0.3)]"></span> 扫描中
          </span>
          <span class="inline-flex items-center gap-1 text-xs mr-3">
            <span class="inline-block w-4 h-4 rounded bg-yellow-100 border-2 border-yellow-500"></span> 交换闪烁
          </span>
          <span class="inline-flex items-center gap-1 text-xs">
            <span class="inline-block w-1 h-5 rounded bg-red-400"></span> 排序/未排序分界
          </span>
        </div>
      </div>

      <!-- ===== 右侧：日志侧栏 (w-80 = 320px) ===== -->
      <div class="w-80 bg-white rounded-lg shadow-md p-4 flex flex-col" style="max-height: 600px;">
        <!-- 日志标题行 + 状态徽章 -->
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-200">
          <h3 class="font-bold text-gray-700 text-sm">执行日志</h3>
          <span id="log-badge" class="text-xs px-2 py-0.5 rounded-full bg-gray-200 text-gray-600 font-medium">
            就绪
          </span>
        </div>
        <!-- 可滚动日志列表 -->
        <div id="log-list" class="flex-1 overflow-y-auto space-y-1 pr-1 text-xs font-mono">
          <div class="text-gray-400 italic">等待初始化…</div>
        </div>
        <!-- 清空日志按钮（可选） -->
        <button id="btn-clear-log"
          class="mt-2 w-full text-xs text-gray-400 hover:text-gray-600 transition-colors py-1">
          清空日志
        </button>
      </div>

    </div><!-- /主区域 -->

  </div><!-- /页面容器 -->

  <!-- ==================== JavaScript 状态机 ==================== -->
  <script>
  (function() {
    // ================================================================
    //  一、全局状态变量
    //  408 考试中简单选择排序的核心变量：
    //    - i: 外层循环索引，指向第 i 趟要确定的"目标位置"（也是已排序/未排序的边界）
    //    - j: 内层循环索引，扫描未排序部分，寻找最小元素
    //    - minIdx: 当前趟中找到的最小元素的下标
    // ================================================================
    let arr        = [];          // 当前数组（会被逐步排序）
    let originalArr= [];          // 原始输入（用于重置）
    let i          = 0;           // 外层循环索引 = 已排序边界
    let j          = 0;           // 内层扫描指针
    let minIdx     = 0;           // 当前趟最小元素下标
    let state      = 'IDLE';      // 状态机: IDLE | SCANNING | MIN_UPDATE | SWAPPING | PASS_COMPLETE | DONE
    let passNum    = 0;           // 第几趟（1-indexed，用于显示）
    let compareCount = 0;         // 比较次数统计
    let swapCount    = 0;         // 交换次数统计
    let logEntries   = [];        // 日志列表 [{text, type}, ...]
    let autoTimer    = null;      // 自动播放定时器句柄
    let justUpdatedMin = false;   // 标记本次 step 刚刚更新了最小值（用于触发闪烁动画）

    // ================================================================
    //  二、DOM 元素引用缓存
    // ================================================================
    const $dataInput   = document.getElementById('data-input');
    const $btnInit     = document.getElementById('btn-init');
    const $btnStep     = document.getElementById('btn-step');
    const $btnAuto     = document.getElementById('btn-auto');
    const $btnClearLog = document.getElementById('btn-clear-log');
    const $speedSelect = document.getElementById('speed-select');
    const $arrayDisplay= document.getElementById('array-display');
    const $logList     = document.getElementById('log-list');
    const $logBadge    = document.getElementById('log-badge');
    const $statusPass  = document.getElementById('status-pass');
    const $statusTarget= document.getElementById('status-target');
    const $statusScan  = document.getElementById('status-scan');
    const $statusMin   = document.getElementById('status-min');
    const $statCmp     = document.getElementById('stat-cmp');
    const $statSwap    = document.getElementById('stat-swap');
    const $statState   = document.getElementById('stat-state');

    // ================================================================
    //  三、工具函数
    // ================================================================

    /** 解析输入框中的逗号分隔数字字符串，返回数组。
     *  非法输入返回 null。空字符串 / 纯空格视为无效。*/
    function parseInput() {
      const raw = $dataInput.value.trim();
      if (!raw) return null;
      const parts = raw.split(',').map(s => s.trim()).filter(s => s !== '');
      if (parts.length === 0) return null;
      const nums = [];
      for (const p of parts) {
        const n = Number(p);
        if (isNaN(n)) return null;     // 包含非数字字符
        nums.push(n);
      }
      return nums;
    }

    /** 状态中文映射（用于徽章和状态显示） */
    function stateLabel(s) {
      const map = {
        'IDLE':          '就绪',
        'SCANNING':      '扫描中',
        'MIN_UPDATE':    '更新最小值',
        'SWAPPING':      '交换中',
        'PASS_COMPLETE': '本趟完成',
        'DONE':          '排序完成'
      };
      return map[s] || s;
    }

    /** 状态徽章颜色映射 */
    function badgeColor(s) {
      const map = {
        'IDLE':          'bg-gray-200 text-gray-600',
        'SCANNING':      'bg-blue-100 text-blue-700',
        'MIN_UPDATE':    'bg-orange-100 text-orange-700',
        'SWAPPING':      'bg-yellow-100 text-yellow-700',
        'PASS_COMPLETE': 'bg-green-100 text-green-700',
        'DONE':          'bg-green-500 text-white'
      };
      return map[s] || 'bg-gray-200 text-gray-600';
    }

    // ================================================================
    //  四、日志管理
    // ================================================================

    /** 添加一条日志（渲染到侧栏） */
    function addLog(text, type) {
      type = type || 'info';
      logEntries.push({ text, type });
      const div = document.createElement('div');
      div.className = 'log-entry py-1 px-2 rounded ' +
        (type === 'highlight' ? 'bg-yellow-50 text-yellow-800 font-semibold' :
         type === 'swap'      ? 'bg-purple-50 text-purple-700' :
         type === 'result'    ? 'bg-green-50 text-green-700 font-semibold' :
                                'text-gray-600');
      div.textContent = text;
      $logList.appendChild(div);
      // 自动滚动到底部
      $logList.scrollTop = $logList.scrollHeight;
    }

    /** 清空日志 */
    function clearLog() {
      logEntries = [];
      $logList.innerHTML = '';
    }

    /** 写入初始提示 */
    function logInitHint() {
      clearLog();
      addLog('点击「单步执行」或「自动播放」开始排序', 'info');
    }

    // ================================================================
    //  五、核心渲染函数
    // ================================================================

    /**
     * 获取数组盒子在当前位置和时间步应当使用的 CSS 类。
     * 根据 idx 与 i、j、minIdx 的关系以及当前状态机状态综合判断：
     *   - idx < i              → 已排序（绿色）
     *   - idx === minIdx       → 当前最小候选（橙色，仅扫描阶段）
     *   - idx === j            → 当前扫描位置（蓝色边框 + 脉冲）
     *   - idx === i            → 待排序目标位置（虚线边框）
     *   - 交换阶段             → 两个参与交换的元素闪黄色
     *   - 完成阶段             → 全部绿色
     */
    function getBoxClasses(idx) {
      const cls = ['array-box'];

      // 全部完成 → 统一亮绿色
      if (state === 'DONE') {
        cls.push('done-box');
        return cls.join(' ');
      }

      // 已排序区域（0 <= idx < i）
      if (idx < i) {
        cls.push('sorted-box');
      }
      // 未排序区域
      else {
        // 仅在未排序区域才出现高亮（避免已排序元素被错误高亮）
        if (idx === minIdx && (state === 'SCANNING' || state === 'MIN_UPDATE')) {
          cls.push('current-min');
          // 如果刚刚更新了最小值，添加闪烁动画
          if (justUpdatedMin && state === 'MIN_UPDATE') {
            cls.push('min-update-flash');
          }
        }
        if (idx === j && state === 'SCANNING') {
          cls.push('scanning-pos', 'scan-pulse');
        }
        if (idx === i && (state === 'SCANNING' || state === 'MIN_UPDATE')) {
          cls.push('target-pos');
        }
      }

      // 交换闪烁：同时高亮 i 和 minIdx（且 minIdx != i）
      if (state === 'SWAPPING' && (idx === i || idx === minIdx) && minIdx !== i) {
        cls.push('swap-flash', 'swap-bounce');
      }

      // 未排序且无任何特殊状态的盒子 → 默认白色
      if (idx >= i && !cls.includes('current-min') && !cls.includes('scanning-pos')
          && !cls.includes('target-pos') && !cls.includes('swap-flash')) {
        cls.push('unsorted-box');
      }

      return cls.join(' ');
    }

    /**
     * 创建单个数组盒子 DOM 元素。
     * 结构：
     *   [label]    ← 如 "当前最小"
     *   [value]    ← 数组值
     *   [index]    ← 下标
     *   [status]   ← 如 "扫描中"
     */
    function createBox(idx) {
      const wrapper = document.createElement('div');
      wrapper.className = getBoxClasses(idx);
      wrapper.setAttribute('data-idx', idx);

      // 标签（当前最小）
      if (idx === minIdx && (state === 'SCANNING' || state === 'MIN_UPDATE') && idx >= i) {
        const lbl = document.createElement('div');
        lbl.className = 'box-label bg-orange-500 text-white';
        lbl.textContent = '当前最小';
        wrapper.appendChild(lbl);
      } else {
        // 占位保持高度一致
        const lbl = document.createElement('div');
        lbl.className = 'box-label';
        lbl.style.visibility = 'hidden';
        wrapper.appendChild(lbl);
      }

      // 值
      const val = document.createElement('div');
      val.className = 'text-lg font-bold';
      val.textContent = arr[idx];
      wrapper.appendChild(val);

      // 下标
      const idxEl = document.createElement('div');
      idxEl.className = 'box-index';
      idxEl.textContent = '[' + idx + ']';
      wrapper.appendChild(idxEl);

      // 状态文字
      const statusEl = document.createElement('div');
      statusEl.className = 'box-status';
      if (idx === j && state === 'SCANNING') {
        statusEl.className += ' text-blue-600 font-semibold';
        statusEl.textContent = '扫描中';
      } else if (idx === i && (state === 'SCANNING' || state === 'MIN_UPDATE')) {
        statusEl.className += ' text-indigo-500';
        statusEl.textContent = '待填入';
      } else if (state === 'SWAPPING' && idx === i && minIdx !== i) {
        statusEl.className += ' text-yellow-600 font-semibold';
        statusEl.textContent = '交换→';
      } else if (state === 'SWAPPING' && idx === minIdx && minIdx !== i) {
        statusEl.className += ' text-yellow-600 font-semibold';
        statusEl.textContent = '←交换';
      } else {
        statusEl.style.visibility = 'hidden';
      }
      wrapper.appendChild(statusEl);

      return wrapper;
    }

    /** 创建已排序/未排序分割线 */
    function createDivider() {
      const div = document.createElement('div');
      div.className = 'flex flex-col items-center mx-1 boundary-divider';
      div.innerHTML = `
        <span class="text-[0.6rem] text-green-600 font-semibold leading-tight">已排序</span>
        <div class="w-1 h-8 bg-red-400 rounded-full my-0.5"></div>
        <span class="text-[0.6rem] text-gray-500 font-semibold leading-tight">未排序</span>
      `;
      return div;
    }

    /**
     * 渲染数组可视化区域。
     * 遍历所有元素，在已排序/未排序分界处（索引 i）插入分割线。
     */
    function renderArray() {
      $arrayDisplay.innerHTML = '';
      for (let idx = 0; idx < arr.length; idx++) {
        // 在已排序和未排序之间插入分界线（仅当有已排序元素且有未排序元素时）
        if (idx === i && i > 0 && state !== 'DONE') {
          $arrayDisplay.appendChild(createDivider());
        }
        $arrayDisplay.appendChild(createBox(idx));
      }
    }

    /** 刷新状态面板信息 */
    function renderStatus() {
      // 趟数
      $statusPass.textContent = (state === 'IDLE' || state === 'DONE')
        ? (state === 'DONE' ? '全部完成' : '—')
        : '第 ' + passNum + ' 趟';

      // 待排序位置
      if (state === 'IDLE' || state === 'DONE') {
        $statusTarget.textContent = '—';
      } else {
        $statusTarget.textContent = 'arr[' + i + '] = ' + arr[i];
      }

      // 扫描位置
      if (state === 'SCANNING' && j < arr.length) {
        $statusScan.textContent = 'arr[' + j + '] = ' + arr[j];
      } else if (state === 'MIN_UPDATE') {
        // MIN_UPDATE 时 j 尚未推进，显示刚刚比较过的位置
        const prevJ = Math.max(i + 1, j - 1);
        $statusScan.textContent = 'arr[' + prevJ + '] (刚更新最小)';
      } else if (state === 'SCANNING' && j >= arr.length) {
        $statusScan.textContent = '扫描完毕';
      } else {
        $statusScan.textContent = '—';
      }

      // 当前最小元素
      if (state === 'SCANNING' || state === 'MIN_UPDATE' || state === 'SWAPPING' || state === 'PASS_COMPLETE') {
        $statusMin.textContent = 'arr[' + minIdx + '] = ' + arr[minIdx];
      } else {
        $statusMin.textContent = '—';
      }

      // 统计
      $statCmp.textContent = compareCount;
      $statSwap.textContent = swapCount;
      $statState.textContent = stateLabel(state);
    }

    /** 刷新日志徽章 */
    function renderBadge() {
      $logBadge.textContent = stateLabel(state);
      $logBadge.className = 'text-xs px-2 py-0.5 rounded-full font-medium ' + badgeColor(state);
    }

    /** 启用/禁用按钮 */
    function updateButtons() {
      const isDone   = state === 'DONE';
      const isIdle   = state === 'IDLE';
      const isActive = !isDone && !isIdle && autoTimer === null;
      $btnStep.disabled = isDone || (autoTimer !== null);
      $btnAuto.disabled = isDone || (state === 'IDLE' && arr.length === 0);
    }

    /** 总渲染入口 */
    function renderAll() {
      renderArray();
      renderStatus();
      renderBadge();
      updateButtons();
      // 重置闪烁标记（仅在渲染后清除，确保本次动画触发）
      // 注意：不清除 justUpdatedMin，让 MIN_UPDATE 的下一步来清除
    }

    // ================================================================
    //  六、状态机核心 — step() 函数
    //  模拟简单选择排序的逐步执行过程，每调用一次推进一个子动作。
    //
    //  408 教材中简单选择排序的经典流程：
    //    for i = 0 to n-2:               // 第 i 趟
    //      minIdx = i                    // 假设第 i 个是最小
    //      for j = i+1 to n-1:           // 扫描未排序部分
    //        if arr[j] < arr[minIdx]:    // 发现更小的
    //          minIdx = j                // 更新最小值下标
    //      swap(arr[i], arr[minIdx])     // 将最小元素交换到第 i 位
    //
    //  状态机流转：
    //    IDLE → SCANNING → (MIN_UPDATE) → SCANNING → ... → SWAPPING → PASS_COMPLETE
    //      ↑___________________________________________________________↓ (下一趟)
    //    或 PASS_COMPLETE → DONE
    // ================================================================
    function step() {
      if (state === 'DONE') return;       // 已完成，不再响应

      switch (state) {

        // ---------- IDLE：启动第一趟 ----------
        case 'IDLE':
          if (arr.length === 0) return;
          passNum = 1;
          i = 0;
          j = i + 1;
          minIdx = i;
          state = 'SCANNING';
          addLog('═══ 第 ' + passNum + ' 趟开始 ═══', 'highlight');
          addLog('待排序位置 arr[' + i + '] = ' + arr[i] + '，初始设为当前最小元素', 'info');
          break;

        // ---------- MIN_UPDATE：最小值闪烁后继续扫描 ----------
        case 'MIN_UPDATE':
          // 清除闪烁标记，推进 j 到下一个待比较位置
          justUpdatedMin = false;
          j++;
          state = 'SCANNING';
          // 如果推进后 j 已越界，下一个 SCANNING 步骤会进入 SWAPPING
          break;

        // ---------- SCANNING：比较 arr[j] 与 arr[minIdx] ----------
        case 'SCANNING':
          if (j >= arr.length) {
            // 扫描完所有未排序元素，进入交换阶段
            state = 'SWAPPING';
            addLog('▸ 第 ' + passNum + ' 趟扫描完毕', 'highlight');
            addLog('  当前最小元素: arr[' + minIdx + '] = ' + arr[minIdx], 'info');
            if (minIdx !== i) {
              addLog('  待交换: arr[' + i + ']=' + arr[i] + ' ↔ arr[' + minIdx + ']=' + arr[minIdx], 'swap');
            } else {
              addLog('  最小元素已在正确位置，无需交换', 'info');
            }
          } else {
            // 执行一次比较
            compareCount++;
            const cmpResult = (arr[j] < arr[minIdx]);
            const cmpSymbol = cmpResult ? ' < ' : ' ≥ ';
            addLog('比较 arr[' + j + ']=' + arr[j] + ' vs arr[' + minIdx + ']=' + arr[minIdx]
              + '  →  ' + arr[j] + cmpSymbol + arr[minIdx]
              + (cmpResult ? ' 【更新最小值!】' : '  不更新'), cmpResult ? 'highlight' : 'info');

            if (cmpResult) {
              // 发现更小元素，进入 MIN_UPDATE 状态以触发闪烁
              justUpdatedMin = true;
              minIdx = j;
              state = 'MIN_UPDATE';
            } else {
              // 未发现更小元素，直接推进 j
              j++;
              // 保持 SCANNING 状态
            }
          }
          break;

        // ---------- SWAPPING：执行交换 ----------
        case 'SWAPPING':
          if (minIdx !== i) {
            // 实际执行交换
            swapCount++;
            addLog('交换: arr[' + i + ']=' + arr[i] + ' ↔ arr[' + minIdx + ']=' + arr[minIdx], 'swap');
            const tmp = arr[i];
            arr[i] = arr[minIdx];
            arr[minIdx] = tmp;
          }
          // 交换完成，本趟结束
          state = 'PASS_COMPLETE';
          addLog('第 ' + passNum + ' 趟结束，arr[' + i + '] = ' + arr[i] + ' 已就位', 'highlight');
          break;

        // ---------- PASS_COMPLETE：进入下一趟或结束 ----------
        case 'PASS_COMPLETE':
          i++;
          if (i >= arr.length - 1) {
            // 所有趟完成，最后一个元素自然就位
            state = 'DONE';
            addLog('══════════════════════', 'result');
            addLog('排序完成！共进行 ' + compareCount + ' 次比较，' + swapCount + ' 次交换', 'result');
            // 停止自动播放
            stopAuto();
          } else {
            // 开始下一趟
            passNum++;
            j = i + 1;
            minIdx = i;
            state = 'SCANNING';
            addLog('═══ 第 ' + passNum + ' 趟开始 ═══', 'highlight');
            addLog('待排序位置 arr[' + i + '] = ' + arr[i] + '，初始设为当前最小元素', 'info');
          }
          break;

        // ---------- DONE：无操作 ----------
        case 'DONE':
          break;
      }

      renderAll();
    }

    // ================================================================
    //  七、重置 / 初始化
    // ================================================================

    /** 从输入框读取数据并重置全部状态 */
    function initData() {
      stopAuto();                    // 停止可能正在运行的自动播放
      const nums = parseInput();
      if (!nums) {
        addLog('输入数据无效，请检查后重试（使用逗号分隔的数字）', 'highlight');
        // 回退到默认值
        $dataInput.value = '49,38,65,97,76,13,27,49';
        return initData();
      }
      originalArr = [...nums];
      arr         = [...nums];
      i           = 0;
      j           = 0;
      minIdx      = 0;
      state       = 'IDLE';
      passNum     = 0;
      compareCount= 0;
      swapCount   = 0;
      justUpdatedMin = false;
      clearLog();
      logInitHint();
      renderAll();
    }

    // ================================================================
    //  八、自动播放控制
    // ================================================================

    /** 获取当前速度设置（毫秒） */
    function getSpeed() {
      return parseInt($speedSelect.value, 10) || 500;
    }

    /** 启动自动播放 */
    function startAuto() {
      if (autoTimer) return;                     // 已在运行
      if (state === 'DONE') return;              // 已完成
      if (state === 'IDLE' && arr.length === 0)  // 无数据
        return;

      $btnAuto.textContent = '停止';
      $btnAuto.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
      $btnAuto.classList.add('bg-red-500', 'hover:bg-red-600');
      $btnStep.disabled = true;

      autoTimer = setInterval(function() {
        if (state === 'DONE') {
          stopAuto();
          return;
        }
        step();
      }, getSpeed());
    }

    /** 停止自动播放 */
    function stopAuto() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      $btnAuto.textContent = '自动播放';
      $btnAuto.classList.remove('bg-red-500', 'hover:bg-red-600');
      $btnAuto.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
      $btnStep.disabled = false;
      updateButtons();
    }

    /** 切换自动播放（按钮点击处理） */
    function toggleAuto() {
      if (autoTimer) {
        stopAuto();
      } else {
        if (state === 'IDLE') {
          step();   // 先执行第一步，让用户看到变化
        }
        startAuto();
      }
    }

    // ================================================================
    //  九、速度变化处理 —— 如果自动播放正在运行，重新设置定时器
    // ================================================================
    $speedSelect.addEventListener('change', function() {
      if (autoTimer) {
        // 重启定时器以应用新速度
        clearInterval(autoTimer);
        autoTimer = setInterval(function() {
          if (state === 'DONE') {
            stopAuto();
            return;
          }
          step();
        }, getSpeed());
      }
    });

    // ================================================================
    //  十、事件绑定
    // ================================================================

    $btnInit.addEventListener('click', initData);

    $btnStep.addEventListener('click', function() {
      if (state === 'DONE') return;
      if (state === 'IDLE' && arr.length === 0) {
        addLog('请先初始化数据', 'highlight');
        return;
      }
      step();
    });

    $btnAuto.addEventListener('click', toggleAuto);

    $btnClearLog.addEventListener('click', function() {
      clearLog();
      logInitHint();
    });

    // 回车键快速初始化
    $dataInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        initData();
      }
    });

    // ================================================================
    //  十一、页面加载时自动初始化
    // ================================================================
    initData();

  })();
  </script>

</body>
</html>
