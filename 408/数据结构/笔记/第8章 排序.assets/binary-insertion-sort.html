<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>折半插入排序演示</title>
    <!-- ===== 仅依赖 Tailwind CSS CDN ===== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ===== 自定义CSS动画与样式 ===== -->
    <style>
        /* ---- 基础动画 ---- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0);   }
        }
        @keyframes pulseHighlight {
            0%, 100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.5); }
            50%      { box-shadow: 0 0 0 6px rgba(234, 179, 8, 0);   }
        }
        @keyframes shiftRight {
            from { transform: translateX(-100%); opacity: 0.4; }
            to   { transform: translateX(0);     opacity: 1;   }
        }
        @keyframes insertPop {
            0%   { transform: scale(0.3); opacity: 0; }
            60%  { transform: scale(1.15); }
            100% { transform: scale(1);    opacity: 1; }
        }
        @keyframes sentinelPulse {
            0%, 100% { border-color: #8b5cf6; }
            50%      { border-color: #a78bfa; box-shadow: 0 0 8px rgba(139, 92, 246, 0.4); }
        }

        .animate-fade-in     { animation: fadeIn 0.35s ease-out; }
        .animate-pulse-hl    { animation: pulseHighlight 0.7s ease-in-out; }
        .animate-shift       { animation: shiftRight 0.35s ease-out; }
        .animate-insert-pop  { animation: insertPop 0.4s ease-out; }
        .animate-sentinel    { animation: sentinelPulse 1.2s ease-in-out infinite; }

        /* ---- 数组元素盒 ---- */
        .arr-box {
            width: 52px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #d1d5db; border-radius: 8px;
            font-size: 15px; font-weight: 700;
            transition: background-color 0.3s, border-color 0.3s, transform 0.2s;
            user-select: none; position: relative;
        }
        .arr-box-sentinel {
            border-style: dashed; border-color: #8b5cf6;
            background: #f5f3ff;
        }
        .arr-box-sorted   { background: #dcfce7; border-color: #86efac; }     /* 绿色 已排序 */
        .arr-box-unsorted { background: #f3f4f6; border-color: #d1d5db; color: #6b7280; } /* 灰色 未排序 */
        .arr-box-current  { background: #fef3c7; border-color: #fbbf24; border-style: dashed; color: #92400e; } /* 当前取出元素 */
        .arr-box-mid      { background: #fef08a; border-color: #eab308; transform: scale(1.08); z-index: 2; } /* 黄色 mid */
        .arr-box-shifting { background: #fef9c3; border-color: #facc15; }     /* 浅黄 正在移动 */
        .arr-box-inserted { background: #bbf7d0; border-color: #22c55e; }     /* 亮绿 刚插入 */

        /* ---- 搜索范围边框 ---- */
        .search-range-left  { border-left: 3px solid #3b82f6; }
        .search-range-right { border-right: 3px solid #3b82f6; }
        .search-range-top   { border-top: 3px solid #3b82f6; }
        .search-range-bottom { border-bottom: 3px solid #3b82f6; }

        /* ---- 指针箭头 ---- */
        .ptr-container { position: relative; height: 52px; }
        .ptr {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; font-size: 11px;
            font-weight: 700; white-space: nowrap;
        }
        .ptr-triangle {
            width: 0; height: 0;
            border-left: 7px solid transparent; border-right: 7px solid transparent;
            border-bottom: 10px solid; margin-bottom: 2px;
        }
        .ptr-lo  .ptr-triangle { border-bottom-color: #f97316; } /* orange */
        .ptr-mid .ptr-triangle { border-bottom-color: #eab308; } /* yellow */
        .ptr-hi  .ptr-triangle { border-bottom-color: #f97316; } /* orange */

        /* ---- 哨兵盒子特殊样式 ---- */
        .sentinel-box {
            border: 2px dashed #8b5cf6; background: #ede9fe;
            border-radius: 8px; min-width: 52px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; color: #7c3aed;
        }

        /* ---- 日志滚动条美化 ---- */
        #logArea::-webkit-scrollbar { width: 5px; }
        #logArea::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        #logArea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* ---- 按钮禁用状态 ---- */
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>

<body class="bg-slate-100 min-h-screen font-sans antialiased">

    <!-- ============ 顶部控制栏 ============ -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <h1 class="text-xl font-extrabold text-center text-slate-800 tracking-wide mb-2">
                折半插入排序演示 <span class="text-sm font-normal text-slate-400">(Binary Insertion Sort)</span>
            </h1>
            <div class="flex flex-wrap items-center justify-center gap-2">
                <!-- 数据输入框 -->
                <input
                    type="text" id="dataInput"
                    value="49,38,65,97,76,13,27,49"
                    class="border border-slate-300 rounded-md px-3 py-1.5 text-sm w-64
                           focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400
                           placeholder-slate-400 transition"
                    placeholder="逗号分隔数字，如: 49,38,65,97">
                <!-- 按钮组 -->
                <button id="btnInit"  onclick="initApp()"
                        class="px-4 py-1.5 bg-indigo-600 text-white rounded-md hover:bg-indigo-700
                               transition text-sm font-semibold shadow-sm">
                    初始化/重置
                </button>
                <button id="btnStep"  onclick="step()"
                        class="px-4 py-1.5 bg-emerald-600 text-white rounded-md hover:bg-emerald-700
                               transition text-sm font-semibold shadow-sm">
                    单步执行
                </button>
                <button id="btnAuto"  onclick="toggleAuto()"
                        class="px-4 py-1.5 bg-violet-600 text-white rounded-md hover:bg-violet-700
                               transition text-sm font-semibold shadow-sm">
                    自动播放
                </button>
            </div>
        </div>
    </header>

    <!-- ============ 主体区域 ============ -->
    <main class="max-w-7xl mx-auto mt-4 px-4 pb-8">
        <div class="flex gap-4">

            <!-- ===== 左侧：可视化区域 ===== -->
            <section class="flex-1 bg-white rounded-xl shadow-md p-5 min-w-0">

                <!-- 哨兵 + 数组展示区 -->
                <div id="visArea" class="overflow-x-auto pb-2">
                    <!-- 由 renderVisualization() 动态渲染 -->
                </div>

                <!-- 状态信息面板 -->
                <div id="statusPanel"
                     class="mt-5 bg-slate-50 border border-slate-200 rounded-lg p-4 text-sm space-y-2 text-slate-700">
                    <!-- 由 renderStatus() 动态渲染 -->
                </div>
            </section>

            <!-- ===== 右侧：日志侧边栏 (w-80 = 320px) ===== -->
            <aside class="w-80 bg-white rounded-xl shadow-md flex flex-col max-h-[calc(100vh-150px)]">
                <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                    <h2 class="text-base font-bold text-slate-800">执行日志</h2>
                    <span id="logBadge"
                          class="px-2 py-0.5 text-xs rounded-full font-medium bg-slate-100 text-slate-500">
                        就绪
                    </span>
                </div>
                <div id="logArea"
                     class="flex-1 overflow-y-auto px-3 py-2 text-sm space-y-0.5">
                    <div class="text-slate-400 italic text-xs">等待初始化...</div>
                </div>
            </aside>
        </div>
    </main>

    <!-- ============ JavaScript 核心逻辑 ============ -->
    <script>
    // ================================================================
    //  全局状态 — 严格遵循 408 考研折半插入排序算法
    //
    //  数组约定：
    //    data[0] — 哨兵 R[0]（存放当前待插入元素）
    //    data[1..n] — 实际待排序数据 R[1..n]
    //
    //  状态机:
    //    IDLE          — 等待开始 / 刚初始化
    //    BS_LOOP       — 折半查找进行中 (low / mid / high 更新)
    //    SHIFTING      — 元素后移中
    //    INSERTING     — 将哨兵值插入最终位置
    //    DONE          — 排序完成
    //
    //  每调用一次 step()，推进一个子步骤
    // ================================================================
    const app = {
        data:        [],      // Array<number|null>  data[0]=哨兵, data[1..n]=数据
        n:           0,       // 数据元素个数
        passIndex:   2,       // 当前趟待插入元素下标 (2..n)
        state:       'IDLE',  // 状态机状态
        low:         1,       // 折半查找下界
        high:        0,       // 折半查找上界
        mid:         0,       // 折半查找中间位置
        pos:         0,       // 最终插入位置
        shiftIdx:    0,       // 当前后移元素下标（从 passIndex-1 递减）
        compCount:   0,       // 折半查找累计比较次数
        straightComp:0,       // 模拟直接插入排序累计比较次数
        timerId:     null,    // 自动播放定时器句柄
        logEntries:  [],      // 日志条目数组

        /** 重置所有状态 */
        reset() {
            this.n = 0; this.passIndex = 2; this.state = 'IDLE';
            this.low = 1; this.high = 0; this.mid = 0;
            this.pos = 0; this.shiftIdx = 0; this.compCount = 0;
            this.straightComp = 0;
            this.timerId = null; this.logEntries = [];
        }
    };

    // ================================================================
    //  工具函数
    // ================================================================

    /** 添加一条日志 */
    function addLog(msg) {
        app.logEntries.push(msg);
        refreshLog();
    }

    /** 刷新日志面板（仅追加，保留历史） */
    function refreshLog() {
        const area = document.getElementById('logArea');
        if (!app.logEntries.length) {
            area.innerHTML = '<div class="text-slate-400 italic text-xs">等待初始化...</div>';
            return;
        }
        area.innerHTML = app.logEntries.map((m, i) => {
            const isLatest = i === app.logEntries.length - 1;
            return `<div class="animate-fade-in py-1 px-1.5 rounded text-xs leading-relaxed
                         ${isLatest ? 'bg-indigo-50 text-indigo-800 font-medium' : 'text-slate-600 border-b border-slate-100'}">
                    ${m}</div>`;
        }).join('');
        // 滚动到底部
        area.scrollTop = area.scrollHeight;
    }

    /** 更新日志旁的状态徽章 */
    function refreshBadge() {
        const badge = document.getElementById('logBadge');
        const map = {
            'IDLE':      { text: '就绪',      cls: 'bg-slate-200 text-slate-600' },
            'BS_LOOP':   { text: '折半查找中', cls: 'bg-amber-100 text-amber-700' },
            'SHIFTING':  { text: '元素后移中', cls: 'bg-orange-100 text-orange-700' },
            'INSERTING': { text: '插入元素中', cls: 'bg-emerald-100 text-emerald-700' },
            'DONE':      { text: '已完成',     cls: 'bg-blue-100 text-blue-700' },
        };
        const { text, cls } = map[app.state] || { text: '未知', cls: 'bg-slate-100' };
        badge.textContent = text;
        badge.className = `px-2 py-0.5 text-xs rounded-full font-medium ${cls}`;
    }

    // ================================================================
    //  核心算法：单步执行
    //  每次调用推进一个子步骤
    // ================================================================
    function step() {
        stopAutoPlay(); // 单步时自动停止播放

        // ----- 状态: 已完成 -----
        if (app.state === 'DONE') {
            addLog('排序已全部完成，请点击"初始化/重置"重新开始。');
            renderAll();
            return;
        }

        // ----- 状态: 空闲 → 开始第一趟 -----
        if (app.state === 'IDLE') {
            if (app.passIndex > app.n) {
                // 数据长度 ≤ 1，无需排序
                app.state = 'DONE';
                addLog('数组长度 ≤ 1，已天然有序，无需排序。');
                renderAll();
                return;
            }
            // 开始第 1 趟：设置哨兵，初始折半查找范围
            startPass();
            renderAll();
            return;
        }

        // ----- 状态: 折半查找 -----
        if (app.state === 'BS_LOOP') {
            stepBinarySearch();
            renderAll();
            return;
        }

        // ----- 状态: 元素后移 -----
        if (app.state === 'SHIFTING') {
            stepShifting();
            renderAll();
            return;
        }

        // ----- 状态: 插入元素 -----
        if (app.state === 'INSERTING') {
            stepInserting();
            renderAll();
            return;
        }
    }

    // ---- 开始新一趟：设哨兵 + 初始查找范围 ----
    function startPass() {
        // 将待插入元素 R[passIndex] 放入哨兵 R[0]
        app.data[0] = app.data[app.passIndex];
        // 折半查找范围：R[1 .. passIndex-1]（已排序部分）
        app.low = 1;
        app.high = app.passIndex - 1;
        app.mid = 0;
        app.pos = 0;
        app.shiftIdx = 0;
        app.state = 'BS_LOOP';
        addLog(`━━━ 第 ${app.passIndex - 1} 趟：取出 R[${app.passIndex}]=${app.data[app.passIndex]} 放入哨兵 R[0]，在 R[1..${app.high}] 中查找插入位置 ━━━`);
    }

    // ---- 一次折半查找迭代 ----
    function stepBinarySearch() {
        // 检查折半查找结束条件
        if (app.low > app.high) {
            // 折半查找完成，确定插入位置
            app.pos = app.high + 1;
            app.state = 'SHIFTING';
            app.shiftIdx = app.passIndex - 1;

            // 计算直接插入排序在本趟需要的比较次数
            // 公式: 从 passIndex-1 线性向左比较，直到 pos-1 位置比较失败
            // 比较次数 = passIndex - pos + 1
            const strCmp = app.passIndex - app.pos + 1;
            app.straightComp += strCmp;

            addLog(`折半查找结束 → low=${app.low}, high=${app.high}, 插入位置 pos=${app.pos}`);
            addLog(`(本趟直接插入排序需 ${strCmp} 次比较，折半查找用了若干次)`);

            // 判断是否需要移动（pos == passIndex 说明在末尾，无需移动）
            if (app.pos === app.passIndex) {
                // 已在正确位置，直接跳转插入
                addLog('插入位置等于当前位置，无需移动元素。');
                app.state = 'INSERTING';
            }
            return;
        }

        // 计算 mid，进行一次比较
        app.mid = Math.floor((app.low + app.high) / 2);
        app.compCount++;
        addLog(`[比较 #${app.compCount}] low=${app.low}, mid=${app.mid}, high=${app.high} | 比较 R[0]=${app.data[0]} 与 R[${app.mid}]=${app.data[app.mid]}`);

        if (app.data[0] < app.data[app.mid]) {
            // 哨兵值 < 中间值 → 插入位置在左半区
            app.high = app.mid - 1;
            addLog(`  → R[0](${app.data[0]}) < R[${app.mid}](${app.data[app.mid]})，搜索左半区，high = ${app.high}`);
        } else {
            // 哨兵值 >= 中间值 → 插入位置在右半区（保证稳定性）
            app.low = app.mid + 1;
            addLog(`  → R[0](${app.data[0]}) >= R[${app.mid}](${app.data[app.mid]})，搜索右半区，low = ${app.low}`);
        }
    }

    // ---- 一次元素后移操作 ----
    function stepShifting() {
        if (app.shiftIdx >= app.pos) {
            // 将 R[shiftIdx] 后移一位到 R[shiftIdx+1]
            const movedVal = app.data[app.shiftIdx];
            app.data[app.shiftIdx + 1] = app.data[app.shiftIdx];
            addLog(`元素后移：R[${app.shiftIdx}]=${movedVal} → R[${app.shiftIdx + 1}]`);
            app.shiftIdx--;

            // 检查是否全部移动完成
            if (app.shiftIdx < app.pos) {
                app.state = 'INSERTING';
                addLog('所有元素后移完成，准备插入。');
            }
        }
    }

    // ---- 插入哨兵值到最终位置 ----
    function stepInserting() {
        const val = app.data[0];
        app.data[app.pos] = val;
        app.data[0] = null; // 清空哨兵
        addLog(`插入完成：将 R[0]=${val} 放入 R[${app.pos}]`);
        addLog(`第 ${app.passIndex - 1} 趟结束 → 数组: [${app.data.slice(1).join(', ')}]`);

        // 推进到下一趟
        app.passIndex++;
        if (app.passIndex > app.n) {
            // 全部完成！
            app.state = 'DONE';
            const saved = app.straightComp - app.compCount;
            addLog(`========== 排序完成！==========`);
            addLog(`折半查找总比较次数: ${app.compCount}`);
            addLog(`直接插入总比较次数: ${app.straightComp}`);
            addLog(`节省比较次数: ${saved} (${app.straightComp > 0 ? Math.round(saved / app.straightComp * 100) : 0}%)`);
            addLog(`最终数组: [${app.data.slice(1).join(', ')}]`);
        } else {
            // 继续下一趟
            startPass();
        }
    }

    // ================================================================
    //  可视化渲染
    // ================================================================

    /** 顶层渲染入口 */
    function renderAll() {
        renderVisualization();
        renderStatus();
        refreshLog();
        refreshBadge();
        updateButtons();
    }

    /** 更新按钮文字和状态 */
    function updateButtons() {
        const btnAuto = document.getElementById('btnAuto');
        const btnStep = document.getElementById('btnStep');
        if (app.timerId) {
            btnAuto.textContent = '停止播放';
        } else {
            btnAuto.textContent = '自动播放';
        }
        // 完成后禁用单步和自动播放按钮
        if (app.state === 'DONE') {
            btnStep.disabled = true;
            btnAuto.disabled = app.timerId ? false : true; // 如果正在播放则不禁止停止
        } else {
            btnStep.disabled = false;
            btnAuto.disabled = false;
        }
    }

    /** 渲染数组可视化（哨兵 + 指针行 + 值行 + 下标行） */
    function renderVisualization() {
        const container = document.getElementById('visArea');
        if (!app.data.length || app.n === 0) {
            container.innerHTML = '<div class="text-slate-400 text-center py-8">请先输入数据并初始化</div>';
            return;
        }

        const cols = app.n + 1; // R[0] 哨兵 + R[1..n]

        // ── 决定每个位置的颜色/样式类 ──
        function boxClass(idx) {
            // idx=0 是哨兵
            if (idx === 0) return 'arr-box arr-box-sentinel';
            // idx < passIndex → 已排序（绿色）
            if (idx < app.passIndex) {
                // 如果正在 SHIFTING 且该位置被移动过，用移动色
                if (app.state === 'SHIFTING' && idx > app.shiftIdx && idx <= app.passIndex - 1) {
                    // 已被覆盖的值（移位后的位置）
                }
                // 如果是插入位置，用亮绿色
                if (app.state === 'INSERTING' && idx === app.pos) {
                    return 'arr-box arr-box-inserted animate-insert-pop';
                }
                return 'arr-box arr-box-sorted';
            }
            // idx == passIndex → 当前元素（已取出到哨兵）
            if (idx === app.passIndex && app.state !== 'IDLE') {
                return 'arr-box arr-box-current';
            }
            // idx > passIndex → 未排序（灰色）
            return 'arr-box arr-box-unsorted';
        }

        // ── 搜索范围高亮（折半查找时 [low, high]） ──
        function searchRangeClass(idx) {
            if (app.state !== 'BS_LOOP' && app.state !== 'SHIFTING') return '';
            if (idx < 1 || idx > app.n) return '';
            // 折半查找阶段高亮搜索范围
            if (app.state === 'BS_LOOP' && app.low <= app.high) {
                if (idx >= app.low && idx <= app.high) return 'search-range-top search-range-bottom';
            }
            return '';
        }

        // ── 构建指针行 ──
        let ptrHTML = '<div class="flex items-end gap-1 ml-1">';
        for (let i = 0; i < cols; i++) {
            ptrHTML += '<div class="ptr-container" style="width:52px;margin-right:4px;">';
            // 哨兵列不画指针
            if (i === 0) {
                ptrHTML += '</div>';
                continue;
            }
            // low 指针（橙色），仅当 low 在有效范围内且查找未结束时显示
            if (app.state === 'BS_LOOP' && i === app.low && app.low <= app.high) {
                ptrHTML += '<div class="ptr ptr-lo"><div class="ptr-triangle"></div><span style="color:#f97316">low</span></div>';
            }
            // mid 指针（黄色），仅当 mid 已计算（>0）且查找未结束时显示
            if (app.state === 'BS_LOOP' && i === app.mid && app.low <= app.high && app.mid > 0) {
                ptrHTML += '<div class="ptr ptr-mid" style="transform:translateX(-50%) translateY(-8px);"><div class="ptr-triangle"></div><span style="color:#eab308">mid</span></div>';
            }
            // high 指针（橙色），仅当 high 在有效范围内且查找未结束时显示
            if (app.state === 'BS_LOOP' && i === app.high && app.low <= app.high) {
                ptrHTML += '<div class="ptr ptr-hi"><div class="ptr-triangle"></div><span style="color:#f97316">high</span></div>';
            }
            ptrHTML += '</div>';
        }
        ptrHTML += '</div>';

        // ── 构建值行 ──
        let valHTML = '<div class="flex items-center gap-1 ml-1 mb-1">';
        for (let i = 0; i < cols; i++) {
            const val = app.data[i];
            const display = (val === null || val === undefined) ? '—' : val;
            let cls = boxClass(i);
            // 搜索范围额外类
            const sr = searchRangeClass(i);
            if (sr) cls += ' ' + sr;
            // 哨兵脉冲动画
            if (i === 0 && app.state === 'BS_LOOP') {
                cls += ' animate-sentinel';
            }
            // 正在SHIFTING时的动画
            if (app.state === 'SHIFTING' && i === app.shiftIdx + 1) {
                cls += ' animate-shift';
                // 如果是移入位置，变色
                cls += ' arr-box-shifting';
            }
            // mid元素高亮
            if (app.state === 'BS_LOOP' && i === app.mid && app.low <= app.high && app.mid > 0) {
                cls += ' arr-box-mid animate-pulse-hl';
            }
            // pos位置在SHIFTING时标识将来插入位置
            if (app.state === 'SHIFTING' && i === app.pos) {
                cls += ' border-dashed border-emerald-400 bg-emerald-50';
            }
            // 移动源位置（shiftIdx）高亮
            if (app.state === 'SHIFTING' && i === app.shiftIdx && app.shiftIdx >= app.pos) {
                cls += ' arr-box-shifting';
            }

            valHTML += `<div class="${cls}">${display}</div>`;
        }
        valHTML += '</div>';

        // ── 构建下标行 ──
        let idxHTML = '<div class="flex items-center gap-1 ml-1 text-xs text-slate-500 font-medium">';
        for (let i = 0; i < cols; i++) {
            const label = (i === 0) ? '哨兵R[0]' : `R[${i}]`;
            const w = (i === 0) ? 'width:56px;' : 'width:52px;margin-right:4px;';
            const color = (i === 0) ? 'color:#7c3aed;' : '';
            idxHTML += `<div style="text-align:center;${w}${color}">${label}</div>`;
        }
        idxHTML += '</div>';

        // ── 搜索范围标签 ──
        let rangeHTML = '';
        if (app.state === 'BS_LOOP' && app.low <= app.high) {
            rangeHTML = `<div class="mt-1 text-xs text-blue-600 font-medium animate-fade-in">
                折半查找范围: R[${app.low}] ～ R[${app.high}]
            </div>`;
        }

        // ── 组合 ──
        container.innerHTML = ptrHTML + valHTML + idxHTML + rangeHTML;
    }

    /** 渲染状态信息面板 */
    function renderStatus() {
        const panel = document.getElementById('statusPanel');
        if (!app.data.length || app.n === 0) {
            panel.innerHTML = '<div class="text-slate-400 italic">尚未初始化</div>';
            return;
        }

        // 当前array完整状态
        const arrStr = app.data.slice(1).join(', ');

        // 状态中文映射
        const stateCN = {
            'IDLE': '待开始', 'BS_LOOP': '折半查找', 'SHIFTING': '元素后移',
            'INSERTING': '插入元素', 'DONE': '已完成'
        };

        let html = '';
        html += `<div class="flex flex-wrap gap-x-6 gap-y-1 text-xs">
            <span><strong>当前状态:</strong> <span class="text-indigo-700 font-semibold">${stateCN[app.state] || app.state}</span></span>`;

        if (app.state !== 'IDLE' && app.state !== 'DONE') {
            html += `<span><strong>当前趟:</strong> 第 ${app.passIndex - 1} 趟</span>`;
            html += `<span><strong>待插入元素:</strong> R[${app.passIndex}] = ${app.data[0] !== null ? app.data[0] : '—'}</span>`;
        }

        // 折半查找详情
        if (app.state === 'BS_LOOP') {
            html += `<span><strong>low:</strong> ${app.low}</span>`;
            html += `<span><strong>mid:</strong> ${app.mid || '—'}</span>`;
            html += `<span><strong>high:</strong> ${app.high}</span>`;
            html += `<span><strong>搜索区间:</strong> R[${app.low}..${app.high}]</span>`;
        }

        // 移动详情
        if (app.state === 'SHIFTING') {
            html += `<span><strong>插入位置 pos:</strong> ${app.pos}</span>`;
            html += `<span><strong>正在移动下标:</strong> ${app.shiftIdx >= app.pos ? app.shiftIdx : '—'}</span>`;
        }

        // 比较计数器 — 关键教学指标
        const saved = app.straightComp - app.compCount;
        const pct = app.straightComp > 0 ? Math.round(saved / app.straightComp * 100) : 0;
        html += `</div>`;

        html += `<div class="flex flex-wrap gap-x-6 gap-y-1 text-xs pt-1 border-t border-slate-200 mt-1">
            <span class="text-indigo-700"><strong>折半查找比较次数:</strong> ${app.compCount}</span>
            <span class="text-amber-700"><strong>直接插入比较次数(模拟):</strong> ${app.straightComp}</span>
            <span class="text-emerald-700 font-bold">节省: ${saved} 次 (${pct}%)</span>
        </div>`;

        html += `<div class="text-xs text-slate-500 pt-1 border-t border-slate-200 mt-1">
            <strong>当前数组:</strong> [${arrStr}]
        </div>`;

        panel.innerHTML = html;
    }

    // ================================================================
    //  自动播放控制
    // ================================================================
    function toggleAuto() {
        if (app.timerId) {
            stopAutoPlay();
            return;
        }
        startAutoPlay();
    }

    function startAutoPlay() {
        if (app.state === 'DONE') {
            addLog('排序已完成，请先重置。');
            return;
        }
        if (app.state === 'IDLE') {
            // 如果还未开始，先执行一步
            step();
        }
        addLog('▶ 自动播放开始（间隔 800ms）');
        app.timerId = setInterval(() => {
            if (app.state === 'DONE') {
                stopAutoPlay();
                addLog('■ 自动播放结束');
                return;
            }
            step();
        }, 800);
        updateButtons();
    }

    function stopAutoPlay() {
        if (app.timerId) {
            clearInterval(app.timerId);
            app.timerId = null;
        }
        updateButtons();
    }

    // ================================================================
    //  初始化入口
    // ================================================================
    function initApp() {
        stopAutoPlay();

        // 解析输入
        const input = document.getElementById('dataInput').value.trim();
        if (!input) {
            addLog('错误：输入为空！');
            return;
        }

        const parts = input.split(',');
        const values = [];
        for (let p of parts) {
            const s = p.trim();
            if (s === '') continue;
            const n = parseInt(s, 10);
            if (isNaN(n)) {
                addLog(`错误："${s}" 不是有效数字！`);
                renderAll();
                return;
            }
            values.push(n);
        }

        if (values.length === 0) {
            addLog('错误：未解析到任何数字！');
            renderAll();
            return;
        }

        // 填充状态
        app.reset();
        app.n = values.length;
        app.data = [null, ...values];   // data[0] = null 哨兵占位
        app.logEntries = [];
        addLog(`初始化完成：共 ${app.n} 个元素 → [${values.join(', ')}]`);
        addLog('已排序部分: R[1]（第一个元素天然有序），未排序: R[2..' + app.n + ']');
        addLog('点击「单步执行」开始第一趟折半插入排序。');

        renderAll();
    }

    // ================================================================
    //  页面启动
    // ================================================================
    window.addEventListener('DOMContentLoaded', () => {
        // 自动初始化默认数据
        initApp();

        // 键盘快捷键：空格键 = 单步，回车键 = 自动播放/停止
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return; // 输入框内不拦截
            if (e.code === 'Space') {
                e.preventDefault();
                step();
            } else if (e.code === 'Enter') {
                e.preventDefault();
                toggleAuto();
            }
        });
    });
    </script>

</body>
</html>
