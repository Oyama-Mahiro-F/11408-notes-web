<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>循环队列 - 交互式演示</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes pulse-highlight {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.5); }
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes fade-out {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.5); }
  }
  @keyframes slide-arrow {
    0% { transform: translate(0, 0); }
    50% { transform: translate(var(--tx), var(--ty)); }
    100% { transform: translate(0, 0); }
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 4px currentColor); }
    50% { filter: drop-shadow(0 0 12px currentColor); }
  }
  .slot-circle { transition: all 0.4s ease; cursor: default; }
  .slot-circle.filled { fill: #4f46e5; stroke: #3730a3; }
  .slot-circle.empty { fill: #e5e7eb; stroke: #9ca3af; }
  .slot-circle.highlight { animation: pulse-highlight 0.6s ease-in-out 2; }
  .slot-reserved { fill: #fef3c7; stroke: #f59e0b; stroke-dasharray: 6 3; }
  .value-text { font-size: 16px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .value-text.empty-val { fill: #9ca3af; font-size: 12px; font-weight: 400; }
  .idx-text { font-size: 11px; fill: #6b7280; text-anchor: middle; pointer-events: none; }
  .pointer-line { stroke-width: 2.5; fill: none; }
  .pointer-line.front-ptr { stroke: #ef4444; }
  .pointer-line.rear-ptr { stroke: #22c55e; }
  .pointer-arrow { font-size: 10px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .log-entry { transition: all 0.3s ease; }
  .log-entry.warn { background: #fef2f2; border-left: 3px solid #ef4444; }
  .log-entry.info { background: #f0fdf4; border-left: 3px solid #22c55e; }
  .log-entry.step { background: #eff6ff; border-left: 3px solid #3b82f6; }
  .log-entry.formula { background: #fefce8; border-left: 3px solid #eab308; font-family: 'Courier New', monospace; }
  .array-cell { transition: all 0.3s ease; }
  .array-cell.front-marker { box-shadow: 0 0 0 3px #ef4444; }
  .array-cell.rear-marker { box-shadow: 0 0 0 3px #22c55e; }
  .formula-display { font-family: 'Courier New', Consolas, monospace; background: #1e293b; color: #f8fafc; padding: 6px 12px; border-radius: 6px; font-size: 13px; display: inline-block; }
  .formula-display .highlight-num { color: #fbbf24; font-weight: 700; }
  .formula-display .highlight-res { color: #4ade80; font-weight: 700; }
  #logPanel::-webkit-scrollbar { width: 6px; }
  #logPanel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  #logPanel { scroll-behavior: smooth; }
  .btn-disabled { opacity: 0.5; pointer-events: none; }
  .status-badge { transition: all 0.3s ease; }
</style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
<div class="max-w-7xl mx-auto px-4 py-3">

  <!-- ====== TOP CONTROL BAR ====== -->
  <div class="bg-white rounded-xl shadow-md p-4 mb-4">
    <div class="flex flex-wrap items-center gap-3">
      <h1 class="text-2xl font-bold text-indigo-700 mr-4 whitespace-nowrap">循环队列 演示</h1>
      <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full whitespace-nowrap">最大容量: 6 | 可用: 5 | 408标准</span>

      <div class="flex items-center gap-2 ml-auto flex-wrap">
        <label class="text-sm text-gray-600 whitespace-nowrap">入队值:</label>
        <input id="valueInput" type="number" value="10" min="0" max="999"
               class="w-20 px-2 py-1.5 border border-gray-300 rounded text-sm text-center focus:outline-none focus:ring-2 focus:ring-indigo-400">

        <button id="btnEnqueue" onclick="handleEnqueue()"
                class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
          入队 (Enqueue)
        </button>

        <button id="btnDequeue" onclick="handleDequeue()"
                class="px-4 py-1.5 bg-orange-500 text-white rounded-lg text-sm font-medium hover:bg-orange-600 transition disabled:opacity-50 disabled:cursor-not-allowed">
          出队 (Dequeue)
        </button>

        <button id="btnAutoDemo" onclick="handleAutoDemo()"
                class="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
          自动演示
        </button>

        <button id="btnReset" onclick="handleReset()"
                class="px-3 py-1.5 bg-gray-500 text-white rounded-lg text-sm font-medium hover:bg-gray-600 transition">
          重置
        </button>

        <button id="btnClear" onclick="handleClear()"
                class="px-3 py-1.5 bg-red-400 text-white rounded-lg text-sm font-medium hover:bg-red-500 transition">
          清空
        </button>
      </div>

      <div class="flex items-center gap-2 w-full mt-1">
        <span class="text-xs text-gray-500 whitespace-nowrap">动画速度:</span>
        <input id="speedSlider" type="range" min="100" max="1500" value="500" step="50"
               class="flex-1 max-w-[200px] h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
        <span id="speedLabel" class="text-xs text-gray-500 w-16">500ms</span>
      </div>
    </div>
  </div>

  <!-- ====== MAIN CONTENT: SVG Ring + Linear Array (left) | Log Panel (right) ====== -->
  <div class="flex gap-4">
    <!-- LEFT: Visualization Area -->
    <div class="flex-1 flex flex-col gap-4">

      <!-- Ring Visualization -->
      <div class="bg-white rounded-xl shadow-md p-3 flex justify-center items-center">
        <svg id="ringSVG" viewBox="0 0 500 500" width="480" height="480" class="max-w-full">
          <defs>
            <!-- Front pointer arrowhead -->
            <marker id="arrowFront" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
              <polygon points="0,0 10,5 0,10" fill="#ef4444" />
            </marker>
            <!-- Rear pointer arrowhead -->
            <marker id="arrowRear" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
              <polygon points="0,0 10,5 0,10" fill="#22c55e" />
            </marker>
            <!-- Glow filter -->
            <filter id="glowFront">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <filter id="glowRear">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>

          <!-- Background ring -->
          <circle cx="230" cy="230" r="150" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-dasharray="8 4" />
          <circle cx="230" cy="230" r="155" fill="none" stroke="#f3f4f6" stroke-width="1" />
          <circle cx="230" cy="230" r="145" fill="none" stroke="#f3f4f6" stroke-width="1" />

          <!-- Tick marks between slots -->
          <g id="tickMarks"></g>

          <!-- Slot circles -->
          <g id="slotGroup"></g>

          <!-- Slot labels (indices) -->
          <g id="idxLabels"></g>

          <!-- Front pointer -->
          <g id="frontPointer">
            <line id="frontLine" x1="0" y1="0" x2="0" y2="0" class="pointer-line front-ptr" marker-end="url(#arrowFront)" filter="url(#glowFront)" />
            <rect id="frontLabelBg" x="0" y="0" width="55" height="20" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1" />
            <text id="frontLabel" x="27" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">front=0</text>
          </g>

          <!-- Rear pointer -->
          <g id="rearPointer">
            <line id="rearLine" x1="0" y1="0" x2="0" y2="0" class="pointer-line rear-ptr" marker-end="url(#arrowRear)" filter="url(#glowRear)" />
            <rect id="rearLabelBg" x="0" y="0" width="55" height="20" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" />
            <text id="rearLabel" x="27" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">rear=0</text>
          </g>

          <!-- Center info -->
          <circle cx="230" cy="230" r="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
          <text x="230" y="222" text-anchor="middle" font-size="12" fill="#64748b">元素数</text>
          <text id="centerCount" x="230" y="242" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">0</text>

          <!-- Formula display area (foreignObject for HTML support) -->
          <foreignObject id="formulaFO" x="35" y="428" width="430" height="60" style="display: none;">
            <div xmlns="http://www.w3.org/1999/xhtml" id="formulaContent"
                 class="formula-display"
                 style="background:#1e293b;color:#f8fafc;font-family:'Courier New',monospace;font-size:13px;
                        padding:8px 14px;border-radius:8px;text-align:center;width:100%;height:100%;
                        display:flex;align-items:center;justify-content:center;">
              等待操作...
            </div>
          </foreignObject>
        </svg>
      </div>

      <!-- Linear Array Representation -->
      <div class="bg-white rounded-xl shadow-md p-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-3 text-center">线性数组表示</h3>
        <div id="linearArray" class="flex justify-center gap-2 mb-3"></div>
        <div id="linearMarkers" class="flex justify-center gap-2 text-center"></div>
      </div>

      <!-- Status Row -->
      <div class="bg-white rounded-xl shadow-md p-3 flex flex-wrap gap-3 items-center justify-center text-sm">
        <span class="status-badge px-3 py-1 rounded-full font-medium" id="statusFullBadge">状态: <span id="statusText" class="font-bold">队列空</span></span>
        <span class="text-gray-600">front = <b id="statusFront" class="text-red-600">0</b></span>
        <span class="text-gray-600">rear = <b id="statusRear" class="text-green-600">0</b></span>
        <span class="text-gray-600">元素数 = <b id="statusCount">0</b></span>
        <span class="text-gray-600">可用槽 = <b>5</b> / 总槽 = <b>6</b></span>
        <span id="reservedNote" class="text-xs text-amber-600 bg-amber-50 px-2 py-0.5 rounded">预留1个空槽区分空/满</span>
      </div>
    </div>

    <!-- RIGHT: Log Panel -->
    <div class="w-[300px] flex-shrink-0 bg-white rounded-xl shadow-md flex flex-col" style="max-height: 780px;">
      <div class="p-3 border-b border-gray-200 flex items-center justify-between">
        <h3 class="font-semibold text-gray-700">操作日志</h3>
        <button onclick="clearLog()" class="text-xs text-gray-400 hover:text-gray-600 transition">清空日志</button>
      </div>
      <div id="logPanel" class="flex-1 overflow-y-auto p-2 space-y-1.5" style="max-height: 720px;">
        <div class="log-entry step text-xs p-2 rounded">系统初始化完成。队列为空 (front=0, rear=0, maxSize=6)</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//   QUEUE STATE
// ============================================================
const MAX_SIZE = 6;
const USABLE = 5;
const CX = 230, CY = 230, SLOT_RADIUS = 150;
const SLOT_CIRCLE_R = 27;
const ARROW_OUTER = 200;
const ARROW_INNER = 157;

let state = {
  queue: new Array(MAX_SIZE).fill(null),
  front: 0,
  rear: 0,
  maxSize: MAX_SIZE,
  animating: false,
  speed: 500,
};

// Precompute slot positions for 6 slots around the circle
// Slot 0 at top (12 o'clock), going clockwise
const slotAngles = [];
for (let i = 0; i < MAX_SIZE; i++) {
  const angleDeg = -90 + i * (360 / MAX_SIZE); // start top, go clockwise
  const angleRad = (angleDeg * Math.PI) / 180;
  slotAngles.push({ deg: angleDeg, rad: angleRad });
}

function slotPos(i) {
  const a = slotAngles[i].rad;
  const x = CX + SLOT_RADIUS * Math.cos(a);
  const y = CY + SLOT_RADIUS * Math.sin(a);
  return { x, y, angleDeg: slotAngles[i].deg };
}

// ============================================================
//   HELPER FUNCTIONS
// ============================================================
function getCount() {
  return (state.rear - state.front + MAX_SIZE) % MAX_SIZE;
}

function isEmpty() {
  return state.front === state.rear;
}

function isFull() {
  return (state.rear + 1) % MAX_SIZE === state.front;
}

// ============================================================
//   SVG DRAWING
// ============================================================
function drawAll() {
  drawSlots();
  drawTickMarks();
  drawPointers();
  drawCenter();
  drawLinearArray();
  updateStatusDisplay();
}

function drawSlots() {
  const group = document.getElementById('slotGroup');
  const labelGroup = document.getElementById('idxLabels');
  group.innerHTML = '';
  labelGroup.innerHTML = '';

  for (let i = 0; i < MAX_SIZE; i++) {
    const { x, y } = slotPos(i);
    const val = state.queue[i];

    // Determine slot class
    let fillColor, strokeColor, textClass;
    if (val !== null) {
      fillColor = '#4f46e5';
      strokeColor = '#3730a3';
      textClass = 'value-text';
    } else if (isFull() && (state.rear + 1) % MAX_SIZE === i && i === state.front) {
      // Reserved slot (the empty one that distinguishes full from empty)
      fillColor = '#fef3c7';
      strokeColor = '#f59e0b';
      textClass = 'value-text empty-val';
    } else if (i === state.front && isEmpty()) {
      fillColor = '#e5e7eb';
      strokeColor = '#9ca3af';
      textClass = 'value-text empty-val';
    } else {
      fillColor = '#e5e7eb';
      strokeColor = '#9ca3af';
      textClass = 'value-text empty-val';
    }

    // Check if this is the reserved slot for full detection
    if (isFull() && i === state.front && state.queue[i] === null) {
      fillColor = '#fef3c7';
      strokeColor = '#f59e0b';
      strokeColor = '#f59e0b';
    }

    group.innerHTML += `
      <circle cx="${x}" cy="${y}" r="${SLOT_CIRCLE_R}" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2.5"
              class="slot-circle" id="slot-${i}" />
      <text x="${x}" y="${y}" class="${textClass}" id="valText-${i}">${val !== null ? val : '空'}</text>
    `;

    // Index label outside the slot
    const labelR = SLOT_RADIUS + 38;
    const lx = CX + labelR * Math.cos(slotAngles[i].rad);
    const ly = CY + labelR * Math.sin(slotAngles[i].rad);
    labelGroup.innerHTML += `
      <text x="${lx}" y="${ly}" class="idx-text" font-weight="${i === state.front && !isEmpty() ? 'bold' : 'normal'}"
            fill="${i === state.front ? '#ef4444' : i === state.rear ? '#22c55e' : '#6b7280'}">[${i}]</text>
    `;
  }

  // Highlight reserved slot for full state
  if (isFull()) {
    const reservedIdx = state.front;
    const { x, y } = slotPos(reservedIdx);
    labelGroup.innerHTML += `
      <text x="${x}" y="${y - SLOT_CIRCLE_R - 10}" text-anchor="middle" font-size="9" fill="#f59e0b" font-weight="600">
        预留空位
      </text>
    `;
  }
}

function drawTickMarks() {
  const group = document.getElementById('tickMarks');
  group.innerHTML = '';
  const innerR = SLOT_RADIUS - SLOT_CIRCLE_R - 5;
  const outerR = SLOT_RADIUS + SLOT_CIRCLE_R + 5;
  for (let i = 0; i < MAX_SIZE; i++) {
    const a = slotAngles[i].rad;
    const x1 = CX + innerR * Math.cos(a);
    const y1 = CY + innerR * Math.sin(a);
    const x2 = CX + outerR * Math.cos(a);
    const y2 = CY + outerR * Math.sin(a);
    group.innerHTML += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d1d5db" stroke-width="1" />`;
  }
}

function drawPointers() {
  // Front pointer
  const fPos = slotPos(state.front);
  const fAngle = slotAngles[state.front].rad;
  const fOx = CX + ARROW_OUTER * Math.cos(fAngle);
  const fOy = CY + ARROW_OUTER * Math.sin(fAngle);
  const fIx = CX + ARROW_INNER * Math.cos(fAngle);
  const fIy = CY + ARROW_INNER * Math.sin(fAngle);

  document.getElementById('frontLine').setAttribute('x1', fOx);
  document.getElementById('frontLine').setAttribute('y1', fOy);
  document.getElementById('frontLine').setAttribute('x2', fIx);
  document.getElementById('frontLine').setAttribute('y2', fIy);

  // Front label position (further out)
  const fLx = CX + (ARROW_OUTER + 22) * Math.cos(fAngle);
  const fLy = CY + (ARROW_OUTER + 22) * Math.sin(fAngle);
  document.getElementById('frontLabelBg').setAttribute('x', fLx - 28);
  document.getElementById('frontLabelBg').setAttribute('y', fLy - 10);
  document.getElementById('frontLabel').setAttribute('x', fLx);
  document.getElementById('frontLabel').setAttribute('y', fLy + 4);
  document.getElementById('frontLabel').textContent = `front=${state.front}`;

  // Rear pointer
  const rPos = slotPos(state.rear);
  const rAngle = slotAngles[state.rear].rad;
  const rOx = CX + ARROW_OUTER * Math.cos(rAngle);
  const rOy = CY + ARROW_OUTER * Math.sin(rAngle);
  const rIx = CX + ARROW_INNER * Math.cos(rAngle);
  const rIy = CY + ARROW_INNER * Math.sin(rAngle);

  document.getElementById('rearLine').setAttribute('x1', rOx);
  document.getElementById('rearLine').setAttribute('y1', rOy);
  document.getElementById('rearLine').setAttribute('x2', rIx);
  document.getElementById('rearLine').setAttribute('y2', rIy);

  // Rear label position
  const rLx = CX + (ARROW_OUTER + 22) * Math.cos(rAngle);
  const rLy = CY + (ARROW_OUTER + 22) * Math.sin(rAngle);
  document.getElementById('rearLabelBg').setAttribute('x', rLx - 28);
  document.getElementById('rearLabelBg').setAttribute('y', rLy - 10);
  document.getElementById('rearLabel').setAttribute('x', rLx);
  document.getElementById('rearLabel').setAttribute('y', rLy + 4);
  document.getElementById('rearLabel').textContent = `rear=${state.rear}`;

  // Show/hide front pointer: always show, but highlight when not animating
  const fp = document.getElementById('frontPointer');
  const rp = document.getElementById('rearPointer');
  fp.style.opacity = 1;
  rp.style.opacity = 1;
}

function drawCenter() {
  const count = getCount();
  document.getElementById('centerCount').textContent = count;
}

function drawLinearArray() {
  const container = document.getElementById('linearArray');
  const markers = document.getElementById('linearMarkers');
  container.innerHTML = '';
  markers.innerHTML = '';

  for (let i = 0; i < MAX_SIZE; i++) {
    const val = state.queue[i];
    const isEmpty_ = val === null;

    let borderColor = 'border-gray-300';
    let bgColor = 'bg-gray-100';
    let textColor = 'text-gray-400';

    if (!isEmpty_) {
      bgColor = 'bg-indigo-100';
      borderColor = 'border-indigo-400';
      textColor = 'text-indigo-800';
    }
    if (i === state.front) borderColor = 'border-red-400 border-[2.5px]';
    if (i === state.rear) borderColor = 'border-green-400 border-[2.5px]';
    if (i === state.front && i === state.rear && isEmpty_ && isEmpty()) {
      borderColor = 'border-gray-300';
    }
    // If full and this is the reserved slot
    if (isFull() && i === state.front && !isEmpty_) {
      borderColor = 'border-amber-400 border-[2.5px]';
      bgColor = 'bg-amber-50';
    }

    container.innerHTML += `
      <div class="array-cell w-16 h-16 border-2 ${borderColor} ${bgColor} rounded-lg flex flex-col items-center justify-center relative">
        <span class="text-[10px] text-gray-400 absolute top-0.5 left-1">[${i}]</span>
        <span class="text-lg font-bold ${textColor}">${isEmpty_ ? '—' : val}</span>
      </div>
    `;

    // Marker row
    let markerText = '';
    let markerColor = 'text-transparent';
    if (i === state.front && i === state.rear && isEmpty()) {
      markerText = 'front/rear';
      markerColor = 'text-gray-400 text-[10px]';
    } else if (i === state.front) {
      markerText = 'front';
      markerColor = 'text-red-500 text-xs font-bold';
    } else if (i === state.rear) {
      markerText = 'rear';
      markerColor = 'text-green-500 text-xs font-bold';
    }
    markers.innerHTML += `<div class="w-16 text-center"><span class="${markerColor}">${markerText}</span></div>`;
  }
}

function updateStatusDisplay() {
  const count = getCount();
  const empty = isEmpty();
  const full = isFull();

  document.getElementById('statusFront').textContent = state.front;
  document.getElementById('statusRear').textContent = state.rear;
  document.getElementById('statusCount').textContent = count;

  const statusText = document.getElementById('statusText');
  const badge = document.getElementById('statusFullBadge');
  if (empty) {
    statusText.textContent = '队列空';
    badge.className = 'status-badge px-3 py-1 rounded-full font-medium bg-gray-200 text-gray-700';
  } else if (full) {
    statusText.textContent = '队列满';
    badge.className = 'status-badge px-3 py-1 rounded-full font-medium bg-red-100 text-red-700';
  } else {
    statusText.textContent = '正常';
    badge.className = 'status-badge px-3 py-1 rounded-full font-medium bg-green-100 text-green-700';
  }
}

// ============================================================
//   FORMULA DISPLAY
// ============================================================
function showFormula(text) {
  const fo = document.getElementById('formulaFO');
  const content = document.getElementById('formulaContent');
  fo.style.display = 'block';
  content.innerHTML = text;
}

function hideFormula() {
  const fo = document.getElementById('formulaFO');
  fo.style.display = 'none';
}

// ============================================================
//   LOGGING
// ============================================================
function addLog(msg, type) {
  const panel = document.getElementById('logPanel');
  const div = document.createElement('div');
  div.className = `log-entry ${type} text-xs p-2 rounded`;
  const now = new Date();
  const time = now.toLocaleTimeString('zh-CN', { hour12: false });
  div.innerHTML = `<span class="text-gray-400">[${time}]</span> ${msg}`;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
}

function clearLog() {
  const panel = document.getElementById('logPanel');
  panel.innerHTML = '';
  addLog('日志已清空', 'step');
}

// ============================================================
//   SLEEP UTILITY
// ============================================================
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ============================================================
//   SLOT ANIMATION HELPERS
// ============================================================
function highlightSlot(index) {
  const el = document.getElementById('slot-' + index);
  if (el) {
    el.classList.add('highlight');
    setTimeout(() => el.classList.remove('highlight'), 800);
  }
}

function animateValueAppear(index, value) {
  const textEl = document.getElementById('valText-' + index);
  if (textEl) {
    textEl.style.animation = 'pop-in 0.4s ease-out';
    textEl.textContent = value;
    textEl.setAttribute('class', 'value-text');
    setTimeout(() => { textEl.style.animation = ''; }, 400);
  }
}

function animateValueRemove(index) {
  const textEl = document.getElementById('valText-' + index);
  if (textEl) {
    textEl.style.animation = 'fade-out 0.35s ease-in';
    setTimeout(() => {
      textEl.textContent = '空';
      textEl.setAttribute('class', 'value-text empty-val');
      textEl.style.animation = '';
    }, 350);
  }
}

// ============================================================
//   BUTTON STATE MANAGEMENT
// ============================================================
function setButtonsEnabled(enabled) {
  const buttons = ['btnEnqueue', 'btnDequeue', 'btnAutoDemo', 'btnReset', 'btnClear'];
  buttons.forEach(id => {
    const btn = document.getElementById(id);
    if (enabled) {
      btn.classList.remove('btn-disabled');
      btn.disabled = false;
    } else {
      btn.classList.add('btn-disabled');
      btn.disabled = true;
    }
  });
}

// ============================================================
//   ENQUEUE OPERATION
// ============================================================
async function handleEnqueue() {
  if (state.animating) return;
  state.animating = true;
  setButtonsEnabled(false);

  const input = document.getElementById('valueInput');
  const value = parseInt(input.value) || Math.floor(Math.random() * 90) + 10;
  input.value = value + 1; // auto-increment for convenience

  // Step 1: Check if full
  const nextRear = (state.rear + 1) % MAX_SIZE;
  addLog(`<b>入队(${value})</b> — 步骤①: 检查是否已满`, 'step');
  showFormula(`(rear + 1) % maxSize == front ?<br/>→ (${state.rear} + 1) % ${MAX_SIZE} = ${nextRear} == front(${state.front}) ? ${nextRear === state.front ? 'TRUE → 队列已满!' : 'FALSE → 可以入队'}`);

  await sleep(state.speed);

  if (isFull()) {
    addLog(`<b>队列已满！</b> 无法入队。 (rear+1)%maxSize = (${state.rear}+1)%${MAX_SIZE} = ${nextRear} == front(${state.front})`, 'warn');
    showFormula(`❌ 队列满！(rear+1)%maxSize = (${state.rear}+1)%${MAX_SIZE} = ${nextRear} == front(${state.front})`);
    await sleep(state.speed * 1.5);
    hideFormula();
    state.animating = false;
    setButtonsEnabled(true);
    drawAll();
    return;
  }

  // Step 2: Move rear pointer
  addLog(`步骤②: rear指针后移 → rear = (rear + 1) % maxSize = (${state.rear} + 1) % ${MAX_SIZE} = ${nextRear}`, 'info');
  showFormula(`rear = (rear + 1) % maxSize<br/>→ rear = (${state.rear} + 1) % ${MAX_SIZE} = <span class="highlight-res">${nextRear}</span>`);

  // Animate rear moving
  state.rear = nextRear;
  drawPointers();
  await sleep(state.speed * 0.7);

  // Step 3: Place value
  addLog(`步骤③: 放入元素 → queue[${state.rear}] = ${value}`, 'info');
  showFormula(`queue[rear] = value<br/>→ queue[${state.rear}] = ${value}`);

  state.queue[state.rear] = value;
  drawSlots();
  drawCenter();
  drawLinearArray();
  updateStatusDisplay();
  animateValueAppear(state.rear, value);
  highlightSlot(state.rear);

  await sleep(state.speed);

  const count = getCount();
  addLog(`入队完成！ front=${state.front}, rear=${state.rear}, 元素数=${count}`, 'info');
  hideFormula();
  state.animating = false;
  setButtonsEnabled(true);
  drawAll();
}

// ============================================================
//   DEQUEUE OPERATION
// ============================================================
async function handleDequeue() {
  if (state.animating) return;
  state.animating = true;
  setButtonsEnabled(false);

  // Step 1: Check if empty
  addLog(`<b>出队</b> — 步骤①: 检查是否为空`, 'step');
  showFormula(`front == rear ?<br/>→ ${state.front} == ${state.rear} ? ${isEmpty() ? 'TRUE → 队列为空!' : 'FALSE → 可以出队'}`);

  await sleep(state.speed);

  if (isEmpty()) {
    addLog(`<b>队列为空！</b> 无法出队。 front = rear = ${state.front}`, 'warn');
    showFormula(`❌ 队列空！front = rear = ${state.front}`);
    await sleep(state.speed * 1.5);
    hideFormula();
    state.animating = false;
    setButtonsEnabled(true);
    drawAll();
    return;
  }

  // Step 2: Move front pointer
  const nextFront = (state.front + 1) % MAX_SIZE;
  const dequeuedValue = state.queue[nextFront];

  addLog(`步骤②: front指针后移 → front = (front + 1) % maxSize = (${state.front} + 1) % ${MAX_SIZE} = ${nextFront}`, 'info');
  showFormula(`front = (front + 1) % maxSize<br/>→ front = (${state.front} + 1) % ${MAX_SIZE} = <span class="highlight-res">${nextFront}</span>`);

  // Animate value removal from old slot
  animateValueRemove(nextFront);
  state.queue[nextFront] = null;

  // Wait for fade-out animation to complete before redrawing
  await sleep(400);

  state.front = nextFront;
  drawPointers();
  drawSlots();
  drawCenter();
  drawLinearArray();
  updateStatusDisplay();


  // Step 3: Return value
  addLog(`步骤③: 取出元素 → 返回 queue[${nextFront}] = ${dequeuedValue}`, 'info');
  showFormula(`return queue[front] = queue[${nextFront}] = ${dequeuedValue}`);

  await sleep(state.speed);

  const count = getCount();
  addLog(`出队完成！ 取出值=<b>${dequeuedValue}</b>, front=${state.front}, rear=${state.rear}, 元素数=${count}`, 'info');
  hideFormula();
  state.animating = false;
  setButtonsEnabled(true);
  drawAll();
}

// ============================================================
//   AUTO DEMO
// ============================================================
async function handleAutoDemo() {
  if (state.animating) return;
  state.animating = true;
  setButtonsEnabled(false);
  addLog('<b>=== 自动演示开始 ===</b> 演示入队、出队和循环绕回', 'step');

  // Phase 1: Enqueue 3 values
  const demoValues = [10, 20, 30, 40, 50];
  for (let i = 0; i < 3; i++) {
    if (!state.animating) break;
    const v = demoValues[i];
    document.getElementById('valueInput').value = v;

    // Manual enqueue logic inline to avoid recursion issues
    if (isFull()) {
      addLog('队列已满，跳过入队', 'warn');
      continue;
    }
    const nr = (state.rear + 1) % MAX_SIZE;
    addLog(`自动入队: ${v} — rear: ${state.rear}→${nr}`, 'info');
    showFormula(`入队 ${v}: rear = (${state.rear}+1)%${MAX_SIZE} = ${nr}`);
    state.rear = nr;
    drawPointers();
    await sleep(state.speed * 0.6);
    state.queue[state.rear] = v;
    drawSlots();
    drawCenter();
    drawLinearArray();
    updateStatusDisplay();
    animateValueAppear(state.rear, v);
    highlightSlot(state.rear);
    await sleep(state.speed);
  }

  hideFormula();
  await sleep(state.speed * 0.5);

  // Phase 2: Dequeue 2 values
  for (let i = 0; i < 2; i++) {
    if (!state.animating) break;
    if (isEmpty()) {
      addLog('队列为空，跳过出队', 'warn');
      continue;
    }
    const nf = (state.front + 1) % MAX_SIZE;
    const dv = state.queue[nf];
    addLog(`自动出队: 值=${dv} — front: ${state.front}→${nf}`, 'info');
    showFormula(`出队: front = (${state.front}+1)%${MAX_SIZE} = ${nf}, 取出=${dv}`);
    animateValueRemove(nf);
    state.queue[nf] = null;
    // Wait for fade-out animation before redrawing
    await sleep(400);
    state.front = nf;
    drawPointers();
    drawSlots();
    drawCenter();
    drawLinearArray();
    updateStatusDisplay();
    await sleep(state.speed);
  }

  hideFormula();
  await sleep(state.speed * 0.5);

  // Phase 3: Enqueue more to show wrap-around
  for (let i = 3; i < 5; i++) {
    if (!state.animating) break;
    if (isFull()) {
      addLog('队列已满，跳过入队', 'warn');
      continue;
    }
    const v = demoValues[i];
    document.getElementById('valueInput').value = v;
    const nr = (state.rear + 1) % MAX_SIZE;
    addLog(`自动入队(绕回): ${v} — rear: ${state.rear}→${nr} (mod ${MAX_SIZE})`, 'info');
    showFormula(`入队 ${v}: rear = (${state.rear}+1)%${MAX_SIZE} = ${nr}`);
    state.rear = nr;
    drawPointers();
    await sleep(state.speed * 0.6);
    state.queue[state.rear] = v;
    drawSlots();
    drawCenter();
    drawLinearArray();
    updateStatusDisplay();
    animateValueAppear(state.rear, v);
    highlightSlot(state.rear);
    await sleep(state.speed);
  }

  hideFormula();
  await sleep(state.speed * 0.5);

  // Phase 4: Enqueue one more to show full detection
  if (!isFull() && state.animating) {
    const v = 60;
    document.getElementById('valueInput').value = v;
    if (!isFull()) {
      const nr = (state.rear + 1) % MAX_SIZE;
      addLog(`自动入队: ${v} — rear: ${state.rear}→${nr}`, 'info');
      showFormula(`入队 ${v}: rear = (${state.rear}+1)%${MAX_SIZE} = ${nr}`);
      state.rear = nr;
      drawPointers();
      await sleep(state.speed * 0.6);
      state.queue[state.rear] = v;
      drawSlots();
      drawCenter();
      drawLinearArray();
      updateStatusDisplay();
      animateValueAppear(state.rear, v);
      highlightSlot(state.rear);
      await sleep(state.speed);
    }
  }

  hideFormula();
  await sleep(state.speed * 0.5);

  // Show full state
  if (isFull()) {
    addLog('<b>队列已满！</b> 注意：position ' + state.front + ' 保留为空以区分空/满状态 (408标准)', 'warn');
    showFormula(`队列满: (rear+1)%maxSize = (${state.rear}+1)%${MAX_SIZE} = ${(state.rear+1)%MAX_SIZE} == front(${state.front}) ✓`);
    await sleep(state.speed * 1.5);
  }

  hideFormula();
  addLog('<b>=== 自动演示结束 ===</b>', 'step');
  state.animating = false;
  setButtonsEnabled(true);
  drawAll();
}

// ============================================================
//   RESET & CLEAR
// ============================================================
function handleReset() {
  if (state.animating) return;

  // Clear queue
  state.queue = new Array(MAX_SIZE).fill(null);
  state.front = 0;
  state.rear = 0;

  document.getElementById('valueInput').value = 10;
  hideFormula();
  addLog('<b>队列已重置</b> — front=0, rear=0, 所有槽清空', 'step');
  drawAll();
}

async function handleClear() {
  if (state.animating) return;

  // Same as reset
  state.queue = new Array(MAX_SIZE).fill(null);
  state.front = 0;
  state.rear = 0;

  document.getElementById('valueInput').value = 10;
  hideFormula();
  addLog('<b>队列已清空</b> — 所有元素已移除', 'info');
  drawAll();
}

// ============================================================
//   SPEED SLIDER
// ============================================================
document.getElementById('speedSlider').addEventListener('input', function() {
  state.speed = parseInt(this.value);
  document.getElementById('speedLabel').textContent = state.speed + 'ms';
});

// ============================================================
//   INITIAL DRAW
// ============================================================
drawAll();
addLog('演示就绪。maxSize=6，可用5个槽位。front=rear=0 表示空队列。', 'info');
addLog('提示：点击"自动演示"可观察完整的入队、出队和绕回过程。', 'step');
</script>
