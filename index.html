<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026考研笔记资料库</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/hljs-github.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menu-btn" title="目录">☰</button>
  <a class="brand" href="#/home">📖 2026考研笔记</a>
  <nav class="tabs" id="tabs"></nav>
  <div class="nav-search" id="nav-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="nav-search-input" placeholder="搜索笔记... (Ctrl+K)" autocomplete="off">
    <div class="dropdown" id="nav-search-dd"></div>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head" id="sidebar-head">
      <span class="sidebar-title">📚 笔记目录</span>
      <button class="sidebar-collapse" id="sidebar-collapse" title="收起目录">«</button>
    </div>
    <div class="tree" id="tree"><div class="tree-loading">加载目录...</div></div>
  </aside>
  <div class="sidebar-mask" id="sidebar-mask"></div>
  <main class="content" id="content">
    <div class="loading">加载中...</div>
  </main>
  <aside class="toc collapsed" id="toc">
    <div class="toc-head" id="toc-head"><span class="toc-arrow">▸</span><span class="toc-label">目录</span></div>
    <nav class="toc-list" id="toc-list"></nav>
  </aside>
</div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/markmap-lib.iife.js"></script>
<script src="vendor/markmap-view.iife.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
