name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p _site
          # 只复制网页相关的目录和文件（md 直渲染版）
          for dir in 408 数学 英语 政治 vendor css js search; do
            if [ -d "$dir" ]; then cp -r "$dir" _site/; fi
          done
          cp index.html _site/ 2>/dev/null || true
          cp manifest.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "Site files prepared."

      - uses: actions/configure-pages@v4

      - name: Clean up old artifacts
        run: |
          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name=="github-pages") | .id')
          for id in $artifacts; do
            echo "Deleting old artifact $id"
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
